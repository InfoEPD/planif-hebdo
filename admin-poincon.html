<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Poinçons — Planif EPD</title>
<style>
  :root {
    --accent:#ff7d4d; --accent-dark:#e2652f; --bg:#f4f5f7; --panel:#fff; --border:#e2e4ea;
    --text:#1c1f26; --text-secondary:#6b7080; --danger:#e2445c; --danger-bg:#fdecef;
    --green:#00c875; --green-bg:#e8faf1; --orange-bg:#fff4e8;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); }
  #clerk-signin { max-width:420px; margin:60px auto; }
  header.topbar { display:flex; align-items:center; justify-content:space-between; padding:14px 20px; background:var(--panel); border-bottom:1px solid var(--border); }
  header.topbar .brand { font-weight:700; font-size:17px; }
  .btn-signout { background:none; border:1px solid var(--border); border-radius:8px; padding:6px 12px; font-size:13px; color:var(--text-secondary); cursor:pointer; }
  nav.tabs { display:flex; gap:4px; padding:10px 20px 0; background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:wrap; }
  nav.tabs button { border:none; background:none; padding:10px 14px; font-size:14px; font-weight:600; color:var(--text-secondary); cursor:pointer; border-bottom:3px solid transparent; }
  nav.tabs button.active { color:var(--accent-dark); border-bottom-color:var(--accent); }
  main { max-width:1200px; margin:0 auto; padding:20px; }
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }
  .weeknav { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .weeknav button { border:1px solid var(--border); background:#fff; border-radius:8px; padding:8px 12px; cursor:pointer; }
  .weeknav .weeklabel { font-weight:700; }
  table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  th, td { padding:8px 10px; border-bottom:1px solid var(--border); font-size:13px; text-align:left; vertical-align:middle; }
  th { background:#fafafa; color:var(--text-secondary); font-weight:600; }
  tr:last-child td { border-bottom:none; }
  input[type=number], input[type=text], input[type=password], input[type=tel], select {
    padding:6px 8px; border:1px solid var(--border); border-radius:6px; font-size:13px; width:90px;
  }
  input[type=text].wide, input[type=tel].wide { width:160px; }
  .badge { display:inline-block; padding:3px 8px; border-radius:20px; font-size:11px; font-weight:700; }
  .badge-attente { background:var(--orange-bg); color:var(--accent-dark); }
  .badge-approuve { background:var(--green-bg); color:#0a8a52; }
  .badge-rejete { background:var(--danger-bg); color:var(--danger); }
  .badge-exporte { background:#e8f0fe; color:#3457d5; }
  .btn { border:none; border-radius:8px; padding:7px 12px; font-size:13px; font-weight:600; cursor:pointer; margin-right:4px; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-outline { background:#fff; border:1px solid var(--border); color:var(--text); }
  .btn-danger { background:var(--danger-bg); color:var(--danger); }
  .btn-green { background:var(--green-bg); color:#0a8a52; }
  .section-title { font-size:16px; font-weight:700; margin:24px 0 10px; }
  .empty-state { color:var(--text-secondary); padding:30px; text-align:center; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px; }
  .flex-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .reason-note { font-size:12px; color:var(--danger); margin-top:2px; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--text); color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; z-index:200; }
  .gps-link { font-size:11px; color:#3457d5; text-decoration:none; }
</style>
</head>
<body>

<div id="clerk-signin"></div>

<div id="app" style="display:none;">
  <header class="topbar">
    <div class="brand">⏱️ Administration — Poinçons EPD</div>
    <button class="btn-signout" id="btn-signout">Déconnexion</button>
  </header>
  <nav class="tabs">
    <button data-tab="approbation" class="active">Poinçons à approuver</button>
    <button data-tab="parprojet">Vue par projet</button>
    <button data-tab="comptes">Comptes employés</button>
    <button data-tab="messages">Messages</button>
    <button data-tab="export">Export paie</button>
  </nav>
  <main>

    <div class="tab-panel active" id="tab-approbation">
      <div class="weeknav">
        <button id="wk-prev">◀</button>
        <span class="weeklabel" id="wk-label"></span>
        <button id="wk-next">▶</button>
        <button class="btn btn-outline" id="wk-refresh" style="margin-left:auto;">↻ Rafraîchir</button>
      </div>
      <div id="approbation-content"><div class="empty-state">Chargement…</div></div>
    </div>

    <div class="tab-panel" id="tab-parprojet">
      <div class="weeknav">
        <span class="weeklabel" id="wk-label2"></span>
      </div>
      <div id="parprojet-content"><div class="empty-state">Chargement…</div></div>
    </div>

    <div class="tab-panel" id="tab-comptes">
      <div id="comptes-content"><div class="empty-state">Chargement…</div></div>
    </div>

    <div class="tab-panel" id="tab-messages">
      <div id="messages-content"><div class="empty-state">Chargement…</div></div>
    </div>

    <div class="tab-panel" id="tab-export">
      <div class="card">
        <p style="color:var(--text-secondary);font-size:13px;">
          Format provisoire (une ligne par poinçon approuvé de la semaine affichée). Le format sera ajusté
          dès réception d'un exemple de fichier attendu par le système de paie.
        </p>
        <button class="btn btn-primary" id="btn-export-txt">⬇ Générer le fichier .txt (semaine affichée)</button>
      </div>
    </div>

  </main>
</div>

<script>
// ===================== Configuration =====================
const CLERK_PUBLISHABLE_KEY = 'pk_test_c21pbGluZy10YXBpci03MDkwLmNsZXJrLmFjY291bnRzLmRldiQ';

const EMPLOYEES_BOARD = 8371777574;
const EMP_PHONE_COL = 't_l_phone_mkmx24h2';
const EMP_STATUT_COL = 'statut__1';
const COL_CLERK_ID = 'text_mm6dqed0';
const COL_ACCESS = 'boolean_mm6dd03t';

const POINCONS_BOARD = 18427410930;
const P_EMPLOYE = 'board_relation_mm6d1zaz';
const P_PROJET = 'board_relation_mm6ddgy';
const P_DATE = 'date_mm6d1p6e';
const P_SEMAINE = 'text_mm6d1bk5';
const P_HDEBUT = 'hour_mm6dfaha';
const P_HFIN = 'hour_mm6dfqfg';
const P_GPS_DEBUT = 'text_mm6d2r65';
const P_GPS_FIN = 'text_mm6ddr4z';
const P_MATIN_NP = 'boolean_mm6dbmf2';
const P_RAISON_MATIN = 'text_mm6dp8f9';
const P_DINER_NP = 'boolean_mm6dczby';
const P_RAISON_DINER = 'text_mm6djdex';
const P_PM_PRISE = 'boolean_mm6dpdmf';
const P_TOTAL_BRUT = 'numeric_mm6d12a7';
const P_TOTAL_AJUSTE = 'numeric_mm6d8c9m';
const P_KM_SUGGERE = 'numeric_mm6d4hvv';
const P_KM_AJUSTE = 'numeric_mm6dxafw';
const P_STATUT = 'color_mm6dxpt7';

const MESSAGES_BOARD = 18427410933;
const M_EMPLOYE = 'board_relation_mm6dwczs';
const M_MESSAGE = 'long_text_mm6dxv7r';
const M_DATE = 'date_mm6dxf1a';
const M_STATUT = 'color_mm6dfb7s';

// ===================== Helpers =====================
function loadExternalScript(attrs) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    Object.entries(attrs).forEach(([k, v]) => { if (k === 'src') s.src = v; else s.setAttribute(k, v); });
    s.async = true; s.crossOrigin = 'anonymous';
    s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}
function showToast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}
async function gql(query, variables) {
  const token = await Clerk.session.getToken();
  const res = await fetch('/api/monday', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ query, variables })
  });
  const data = await res.json();
  if (data.errors) throw new Error(data.errors.map(e => e.message).join('; '));
  if (data.error) throw new Error(data.error);
  return data.data;
}
function cvIndex(item) {
  const m = {};
  (item.column_values || []).forEach(c => { m[c.id] = c; });
  return m;
}
function mondayOfWeek(d) {
  const dt = new Date(d);
  const day = dt.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  dt.setDate(dt.getDate() + diff);
  return dt.toISOString().slice(0, 10);
}
function fmtWeekLabel(monday) {
  const start = new Date(monday + 'T12:00:00');
  const end = new Date(start); end.setDate(end.getDate() + 4);
  const f = d => d.toLocaleDateString('fr-CA', { day: 'numeric', month: 'short' });
  return `Semaine du ${f(start)} au ${f(end)}`;
}
function hourText(cv) {
  if (!cv || cv.hour == null) return '';
  return String(cv.hour).padStart(2, '0') + ':' + String(cv.minute).padStart(2, '0');
}
function statusBadge(label) {
  const cls = { 'En attente': 'badge-attente', 'Approuvé': 'badge-approuve', 'Rejeté': 'badge-rejete', 'Exporté': 'badge-exporte' }[label] || 'badge-attente';
  return `<span class="badge ${cls}">${label || 'En attente'}</span>`;
}

// ===================== État =====================
let currentWeek = mondayOfWeek(new Date());
let poinconsCache = [];
let employeesCache = [];

// ===================== Tab: Approbation (par employé) =====================
async function loadPoinconsForWeek() {
  document.getElementById('wk-label').textContent = fmtWeekLabel(currentWeek);
  document.getElementById('wk-label2').textContent = fmtWeekLabel(currentWeek);
  document.getElementById('approbation-content').innerHTML = '<div class="empty-state">Chargement…</div>';
  const data = await gql(`
    query($board: ID!, $col: String!, $val: [String]!) {
      items_page_by_column_values(board_id: $board, columns: [{ column_id: $col, column_values: $val }], limit: 300) {
        items {
          id name
          column_values(ids: ["${P_EMPLOYE}","${P_PROJET}","${P_DATE}","${P_HDEBUT}","${P_HFIN}","${P_GPS_DEBUT}","${P_GPS_FIN}","${P_MATIN_NP}","${P_RAISON_MATIN}","${P_DINER_NP}","${P_RAISON_DINER}","${P_PM_PRISE}","${P_TOTAL_BRUT}","${P_TOTAL_AJUSTE}","${P_KM_SUGGERE}","${P_KM_AJUSTE}","${P_STATUT}"]) {
            id text
            ... on BoardRelationValue { linked_items { id name } }
            ... on HourValue { hour minute }
          }
        }
      }
    }
  `, { board: String(POINCONS_BOARD), col: P_SEMAINE, val: [currentWeek] });

  poinconsCache = (data.items_page_by_column_values.items || []).map(it => {
    const cv = cvIndex(it);
    const emp = (cv[P_EMPLOYE].linked_items || [])[0] || { id: '', name: '?' };
    const proj = (cv[P_PROJET].linked_items || [])[0] || { id: '', name: '?' };
    return {
      itemId: it.id,
      empId: emp.id, empName: emp.name,
      projId: proj.id, projName: proj.name,
      date: cv[P_DATE].text || '',
      heureDebut: hourText(cv[P_HDEBUT]), heureFin: hourText(cv[P_HFIN]),
      gpsDebut: cv[P_GPS_DEBUT].text || '', gpsFin: cv[P_GPS_FIN].text || '',
      matinNP: cv[P_MATIN_NP].text === 'v', raisonMatin: cv[P_RAISON_MATIN].text || '',
      dinerNP: cv[P_DINER_NP].text === 'v', raisonDiner: cv[P_RAISON_DINER].text || '',
      pmPrise: cv[P_PM_PRISE].text === 'v',
      totalBrut: cv[P_TOTAL_BRUT].text || '', totalAjuste: cv[P_TOTAL_AJUSTE].text || '',
      kmSuggere: cv[P_KM_SUGGERE].text || '', kmAjuste: cv[P_KM_AJUSTE].text || '',
      statut: cv[P_STATUT].text || 'En attente'
    };
  }).sort((a, b) => a.empName.localeCompare(b.empName) || a.date.localeCompare(b.date));

  renderApprobation();
  renderParProjet();
}

function renderApprobation() {
  const el = document.getElementById('approbation-content');
  if (!poinconsCache.length) { el.innerHTML = '<div class="empty-state">Aucun poinçon cette semaine.</div>'; return; }
  const byEmp = {};
  poinconsCache.forEach(p => { (byEmp[p.empName] = byEmp[p.empName] || []).push(p); });
  let html = '';
  Object.keys(byEmp).sort().forEach(name => {
    html += `<div class="section-title">${name}</div><table><thead><tr>
      <th>Date</th><th>Projet</th><th>Début</th><th>Fin</th><th>Brut</th><th>Ajusté</th><th>KM</th>
      <th>Pauses</th><th>Statut</th><th></th></tr></thead><tbody>`;
    byEmp[name].forEach(p => {
      const pauseNotes = [];
      if (p.matinNP) pauseNotes.push('Matin non pris: ' + (p.raisonMatin || '—'));
      if (p.dinerNP) pauseNotes.push('Dîner non pris: ' + (p.raisonDiner || '—'));
      if (!p.pmPrise) pauseNotes.push('PM non pris');
      const gpsLinks = [
        p.gpsDebut ? `<a class="gps-link" target="_blank" href="https://maps.google.com/?q=${p.gpsDebut}">📍début</a>` : '',
        p.gpsFin ? `<a class="gps-link" target="_blank" href="https://maps.google.com/?q=${p.gpsFin}">📍fin</a>` : ''
      ].filter(Boolean).join(' ');
      html += `<tr data-item="${p.itemId}">
        <td>${p.date}<br>${gpsLinks}</td>
        <td>${p.projName}</td>
        <td>${p.heureDebut}</td>
        <td>${p.heureFin}</td>
        <td>${p.totalBrut}</td>
        <td><input type="number" step="0.25" class="inp-total" value="${p.totalAjuste}"></td>
        <td><input type="number" step="0.1" class="inp-km" value="${p.kmAjuste || p.kmSuggere}"></td>
        <td style="max-width:160px;font-size:11px;color:var(--danger);">${pauseNotes.join('<br>') || ''}</td>
        <td>${statusBadge(p.statut)}</td>
        <td>
          <button class="btn btn-green btn-approve">✔</button>
          <button class="btn btn-danger btn-reject">✘</button>
          <button class="btn btn-outline btn-save">Enreg.</button>
        </td>
      </tr>`;
    });
    html += `</tbody></table>`;
  });
  el.innerHTML = html;

  el.querySelectorAll('tr[data-item]').forEach(tr => {
    const itemId = tr.getAttribute('data-item');
    tr.querySelector('.btn-approve').addEventListener('click', () => savePoincon(itemId, tr, 'Approuvé'));
    tr.querySelector('.btn-reject').addEventListener('click', () => savePoincon(itemId, tr, 'Rejeté'));
    tr.querySelector('.btn-save').addEventListener('click', () => savePoincon(itemId, tr, null));
  });
}

async function savePoincon(itemId, tr, forceStatus) {
  const total = Number(tr.querySelector('.inp-total').value) || 0;
  const km = Number(tr.querySelector('.inp-km').value) || 0;
  const cv = { [P_TOTAL_AJUSTE]: total, [P_KM_AJUSTE]: km };
  if (forceStatus) cv[P_STATUT] = { label: forceStatus };
  try {
    await gql(`mutation($board: ID!, $item: ID!, $cv: JSON!) { change_multiple_column_values(board_id: $board, item_id: $item, column_values: $cv) { id } }`,
      { board: String(POINCONS_BOARD), item: String(itemId), cv: JSON.stringify(cv) });
    showToast('Enregistré ✔');
    loadPoinconsForWeek();
  } catch (err) { showToast('Erreur: ' + err.message); }
}

// ===================== Tab: Par projet =====================
function renderParProjet() {
  const el = document.getElementById('parprojet-content');
  if (!poinconsCache.length) { el.innerHTML = '<div class="empty-state">Aucun poinçon cette semaine.</div>'; return; }
  const byProj = {};
  poinconsCache.forEach(p => {
    byProj[p.projName] = byProj[p.projName] || { total: 0, rows: [] };
    byProj[p.projName].total += Number(p.totalAjuste) || 0;
    byProj[p.projName].rows.push(p);
  });
  let html = '';
  Object.keys(byProj).sort().forEach(name => {
    const g = byProj[name];
    html += `<div class="section-title">${name} — ${g.total.toFixed(2)} h</div><table><thead><tr>
      <th>Employé</th><th>Date</th><th>Ajusté</th><th>Statut</th></tr></thead><tbody>`;
    g.rows.sort((a, b) => a.date.localeCompare(b.date)).forEach(p => {
      html += `<tr><td>${p.empName}</td><td>${p.date}</td><td>${p.totalAjuste}</td><td>${statusBadge(p.statut)}</td></tr>`;
    });
    html += `</tbody></table>`;
  });
  el.innerHTML = html;
}

// ===================== Tab: Comptes employés =====================
async function loadComptes() {
  document.getElementById('comptes-content').innerHTML = '<div class="empty-state">Chargement…</div>';
  const data = await gql(`
    query($board: [ID!]) {
      boards(ids: $board) {
        items_page(query_params: { rules: [{ column_id: "${EMP_STATUT_COL}", compare_value: [0], operator: any_of }] }, limit: 200) {
          items { id name column_values(ids: ["${EMP_PHONE_COL}","${COL_CLERK_ID}","${COL_ACCESS}"]) { id text } }
        }
      }
    }
  `, { board: [String(EMPLOYEES_BOARD)] });

  employeesCache = ((data.boards[0] && data.boards[0].items_page.items) || []).map(it => {
    const cv = cvIndex(it);
    return { id: it.id, name: it.name, phone: cv[EMP_PHONE_COL].text || '', clerkUserId: cv[COL_CLERK_ID].text || '', accessEnabled: cv[COL_ACCESS].text === 'v' };
  }).sort((a, b) => a.name.localeCompare(b.name));

  renderComptes();
}

function renderComptes() {
  const el = document.getElementById('comptes-content');
  let html = `<table><thead><tr><th>Employé</th><th>Téléphone</th><th>Accès</th><th>Actions</th></tr></thead><tbody>`;
  employeesCache.forEach(e => {
    html += `<tr data-emp="${e.id}" data-clerk="${e.clerkUserId}">
      <td>${e.name}</td>
      <td>${e.phone}</td>
      <td>${e.clerkUserId ? (e.accessEnabled ? '<span class="badge badge-approuve">Actif</span>' : '<span class="badge badge-rejete">Désactivé</span>') : '<span class="badge badge-attente">Aucun compte</span>'}</td>
      <td>
        ${!e.clerkUserId ? `
          <input type="tel" class="inp-phone" placeholder="Téléphone" value="${e.phone}">
          <input type="password" class="inp-pass" placeholder="Mot de passe (min. 8)">
          <button class="btn btn-primary btn-create">Créer l'accès</button>
        ` : `
          <input type="password" class="inp-newpass" placeholder="Nouveau mot de passe">
          <button class="btn btn-outline btn-reset">Réinitialiser</button>
          <button class="btn ${e.accessEnabled ? 'btn-danger' : 'btn-green'} btn-toggle">${e.accessEnabled ? 'Désactiver' : 'Activer'}</button>
        `}
      </td>
    </tr>`;
  });
  html += `</tbody></table>`;
  el.innerHTML = html;

  el.querySelectorAll('tr[data-emp]').forEach(tr => {
    const empId = tr.getAttribute('data-emp');
    const clerkUserId = tr.getAttribute('data-clerk');
    const btnCreate = tr.querySelector('.btn-create');
    if (btnCreate) btnCreate.addEventListener('click', async () => {
      const phone = tr.querySelector('.inp-phone').value.trim();
      const pass = tr.querySelector('.inp-pass').value;
      if (!phone || !pass) { showToast('Téléphone et mot de passe requis.'); return; }
      try {
        const empName = tr.children[0].textContent;
        await employeeAdminCall({ action: 'createAccount', employeeItemId: empId, employeeName: empName, phone, password: pass });
        showToast('Compte créé ✔'); loadComptes();
      } catch (err) { showToast('Erreur: ' + err.message); }
    });
    const btnReset = tr.querySelector('.btn-reset');
    if (btnReset) btnReset.addEventListener('click', async () => {
      const pass = tr.querySelector('.inp-newpass').value;
      if (!pass) { showToast('Nouveau mot de passe requis.'); return; }
      try { await employeeAdminCall({ action: 'resetPassword', clerkUserId, password: pass }); showToast('Mot de passe changé ✔'); }
      catch (err) { showToast('Erreur: ' + err.message); }
    });
    const btnToggle = tr.querySelector('.btn-toggle');
    if (btnToggle) btnToggle.addEventListener('click', async () => {
      const emp = employeesCache.find(e => e.id === empId);
      try { await employeeAdminCall({ action: 'setAccess', clerkUserId, employeeItemId: empId, enabled: !emp.accessEnabled }); showToast('Mis à jour ✔'); loadComptes(); }
      catch (err) { showToast('Erreur: ' + err.message); }
    });
  });
}

async function employeeAdminCall(body) {
  const token = await Clerk.session.getToken();
  const res = await fetch('/api/employee-admin', {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('Erreur ' + res.status));
  return data;
}

// ===================== Tab: Messages =====================
async function loadMessages() {
  document.getElementById('messages-content').innerHTML = '<div class="empty-state">Chargement…</div>';
  const data = await gql(`
    query($board: [ID!]) {
      boards(ids: $board) {
        items_page(limit: 100) {
          items { id created_at column_values(ids: ["${M_EMPLOYE}","${M_MESSAGE}","${M_DATE}","${M_STATUT}"]) {
            id text ... on BoardRelationValue { linked_items { id name } }
          } }
        }
      }
    }
  `, { board: [String(MESSAGES_BOARD)] });

  const items = ((data.boards[0] && data.boards[0].items_page.items) || []).map(it => {
    const cv = cvIndex(it);
    const emp = (cv[M_EMPLOYE].linked_items || [])[0] || { name: '?' };
    return { itemId: it.id, empName: emp.name, message: cv[M_MESSAGE].text || '', date: cv[M_DATE].text || '', statut: cv[M_STATUT].text || 'Nouveau' };
  }).sort((a, b) => (a.statut === b.statut ? 0 : a.statut === 'Nouveau' ? -1 : 1) || b.date.localeCompare(a.date));

  const el = document.getElementById('messages-content');
  if (!items.length) { el.innerHTML = '<div class="empty-state">Aucun message.</div>'; return; }
  el.innerHTML = items.map(m => `
    <div class="card" data-item="${m.itemId}">
      <div class="flex-row" style="justify-content:space-between;">
        <strong>${m.empName}</strong>
        <span>${statusBadge(m.statut)}</span>
      </div>
      <div style="color:var(--text-secondary);font-size:12px;margin:4px 0;">${m.date}</div>
      <div>${(m.message || '').replace(/</g, '&lt;')}</div>
      ${m.statut === 'Nouveau' ? '<button class="btn btn-outline btn-treated" style="margin-top:8px;">Marquer traité</button>' : ''}
    </div>
  `).join('');

  el.querySelectorAll('.btn-treated').forEach(btn => {
    btn.addEventListener('click', async () => {
      const itemId = btn.closest('[data-item]').getAttribute('data-item');
      try {
        await gql(`mutation($board: ID!, $item: ID!, $cv: JSON!) { change_multiple_column_values(board_id: $board, item_id: $item, column_values: $cv) { id } }`,
          { board: String(MESSAGES_BOARD), item: String(itemId), cv: JSON.stringify({ [M_STATUT]: { label: 'Traité' } }) });
        showToast('Marqué traité ✔'); loadMessages();
      } catch (err) { showToast('Erreur: ' + err.message); }
    });
  });
}

// ===================== Export .txt =====================
function exportTxt() {
  const approved = poinconsCache.filter(p => p.statut === 'Approuvé');
  if (!approved.length) { showToast('Aucun poinçon approuvé cette semaine.'); return; }
  const lines = ['EmployeID;EmployeNom;Date;ProjetID;ProjetNom;HeuresAjustees;KM'];
  approved.forEach(p => {
    lines.push([p.empId, p.empName, p.date, p.projId, p.projName, p.totalAjuste, p.kmAjuste || p.kmSuggere].join(';'));
  });
  const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `poincons_${currentWeek}.txt`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

// ===================== Navigation =====================
document.querySelectorAll('nav.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'comptes' && !employeesCache.length) loadComptes();
    if (btn.dataset.tab === 'messages') loadMessages();
  });
});
document.getElementById('wk-prev').addEventListener('click', () => { const d = new Date(currentWeek); d.setDate(d.getDate() - 7); currentWeek = mondayOfWeek(d); loadPoinconsForWeek(); });
document.getElementById('wk-next').addEventListener('click', () => { const d = new Date(currentWeek); d.setDate(d.getDate() + 7); currentWeek = mondayOfWeek(d); loadPoinconsForWeek(); });
document.getElementById('wk-refresh').addEventListener('click', loadPoinconsForWeek);
document.getElementById('btn-export-txt').addEventListener('click', exportTxt);
document.getElementById('btn-signout').addEventListener('click', () => Clerk.signOut());

// ===================== Auth / démarrage =====================
async function initApp() {
  const meta = Clerk.user.publicMetadata || {};
  if (meta.role === 'employee' || meta.role === 'employee_disabled') {
    document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;">⚠ Accès réservé aux administrateurs.</div>';
    return;
  }
  document.getElementById('clerk-signin').classList.add('hidden');
  document.getElementById('app').style.display = 'block';
  await loadPoinconsForWeek();
}

async function boot() {
  const clerkDomain = atob(CLERK_PUBLISHABLE_KEY.split('_')[2]).slice(0, -1);
  await loadExternalScript({ src: `https://${clerkDomain}/npm/@clerk/clerk-js@6/dist/clerk.browser.js`, 'data-clerk-publishable-key': CLERK_PUBLISHABLE_KEY });
  await window.Clerk.load();
  window.Clerk.addListener(({ user }) => { if (user) initApp(); });
  if (window.Clerk.user) { initApp(); }
  else { window.Clerk.mountSignIn(document.getElementById('clerk-signin'), { appearance: { elements: { rootBox: { width: '100%' } } } }); }
}
boot();
</script>
