<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Poinçons — Planif EPD</title>
<style>
  :root {
    --accent:#ff7d4d; --accent-dark:#e2652f; --bg:#f4f5f7; --panel:#fff; --border:#e2e4ea;
    --text:#1c1f26; --text-secondary:#6b7080; --danger:#e2445c; --danger-bg:#fdecef;
    --green:#00c875; --green-bg:#e8faf1; --orange-bg:#fff4e8;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); }
  #clerk-signin { max-width:420px; margin:60px auto; }
  header.topbar { display:flex; align-items:center; justify-content:space-between; padding:14px 20px; background:var(--panel); border-bottom:1px solid var(--border); }
  header.topbar .brand { font-weight:700; font-size:17px; }
  .btn-signout { background:none; border:1px solid var(--border); border-radius:8px; padding:6px 12px; font-size:13px; color:var(--text-secondary); cursor:pointer; }
  nav.tabs { display:flex; gap:4px; padding:10px 20px 0; background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:wrap; }
  nav.tabs button { border:none; background:none; padding:10px 14px; font-size:14px; font-weight:600; color:var(--text-secondary); cursor:pointer; border-bottom:3px solid transparent; }
  nav.tabs button.active { color:var(--accent-dark); border-bottom-color:var(--accent); }
  main { max-width:1200px; margin:0 auto; padding:20px; }
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }
  .weeknav { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .weeknav button { border:1px solid var(--border); background:#fff; border-radius:8px; padding:8px 12px; cursor:pointer; }
  .weeknav .weeklabel { font-weight:700; }
  table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  th, td { padding:8px 10px; border-bottom:1px solid var(--border); font-size:13px; text-align:left; vertical-align:middle; }
  th { background:#fafafa; color:var(--text-secondary); font-weight:600; }
  tr:last-child td { border-bottom:none; }
  input[type=number], input[type=text], input[type=password], input[type=tel], select {
    padding:6px 8px; border:1px solid var(--border); border-radius:6px; font-size:13px; width:90px;
  }
  input[type=text].wide, input[type=tel].wide { width:160px; }
  .badge { display:inline-block; padding:3px 8px; border-radius:20px; font-size:11px; font-weight:700; }
  .badge-attente { background:var(--orange-bg); color:var(--accent-dark); }
  .badge-approuve { background:var(--green-bg); color:#0a8a52; }
  .badge-rejete { background:var(--danger-bg); color:var(--danger); }
  .badge-exporte { background:#e8f0fe; color:#3457d5; }
  .btn { border:none; border-radius:8px; padding:7px 12px; font-size:13px; font-weight:600; cursor:pointer; margin-right:4px; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-outline { background:#fff; border:1px solid var(--border); color:var(--text); }
  .btn-danger { background:var(--danger-bg); color:var(--danger); }
  .btn-green { background:var(--green-bg); color:#0a8a52; }
  .section-title { font-size:16px; font-weight:700; margin:24px 0 10px; }
  .empty-state { color:var(--text-secondary); padding:30px; text-align:center; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px; }
  .flex-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .reason-note { font-size:12px; color:var(--danger); margin-top:2px; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--text); color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; z-index:200; }
  .gps-link { font-size:11px; color:#3457d5; text-decoration:none; }
  .split-view { display:flex; gap:16px; align-items:flex-start; }
  .split-sidebar { width:220px; flex:none; background:var(--panel); border:1px solid var(--border); border-radius:10px; overflow-y:auto; max-height:74vh; }
  .split-sidebar button { display:block; width:100%; text-align:left; padding:10px 12px; border:none; background:none; border-bottom:1px solid var(--border); cursor:pointer; font-size:13px; color:var(--text); }
  .split-sidebar button:last-child { border-bottom:none; }
  .split-sidebar button.active { background:var(--orange-bg); color:var(--accent-dark); font-weight:700; }
  .split-sidebar button .sub { display:block; font-size:11px; color:var(--text-secondary); font-weight:400; }
  .split-main { flex:1; min-width:0; }
  table.summary-table th, table.summary-table td { text-align:center; }
  table.summary-table th:first-child, table.summary-table td:first-child { text-align:left; }
  table.summary-table tfoot td { font-weight:700; background:#fafafa; }
  .progress-note { font-size:12px; color:var(--text-secondary); margin:10px 0; display:flex; gap:14px; align-items:center; }
  .manual-add-form { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-top:14px; padding-top:14px; border-top:1px dashed var(--border); }
  .manual-add-form label { display:flex; flex-direction:column; font-size:11px; color:var(--text-secondary); gap:2px; }
  .hidden { display:none !important; }
  .dashboard-grid { display:grid; grid-template-columns:1fr 1.3fr; gap:10px; align-items:start; }
  .dashboard-lists { display:flex; flex-direction:column; gap:8px; }
  .dashboard-lists .card { padding:8px 10px; margin-bottom:0; }
  .dashboard-lists .card h4 { margin:0 0 4px; font-size:12px; }
  .dashboard-lists .card-body { max-height:150px; overflow-y:auto; }
  .dash-emp-row { display:flex; align-items:center; justify-content:space-between; padding:3px 0; border-bottom:1px solid var(--border); font-size:12px; line-height:1.25; }
  .dash-emp-row:last-child { border-bottom:none; }
  .dash-emp-row .proj { color:var(--text-secondary); font-size:11px; }
  .dashboard-map-card { padding:8px 10px; margin-bottom:0; }
  .dashboard-map-card h4 { margin:0 0 4px; font-size:12px; }
  #dashboard-map { height:340px; border-radius:8px; border:1px solid var(--border); }
  .map-legend { display:flex; gap:12px; align-items:center; margin:4px 0 6px; font-size:11px; }
  .map-legend .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; }
  #dash-map-search { width:100%; margin-bottom:6px; }
  .dashboard-lists .empty-state, .dashboard-map-card .empty-state { padding:8px; font-size:12px; }
  @media (max-width:900px) { .dashboard-grid { grid-template-columns:1fr; } }
  .msg-thread { display:flex; flex-direction:column; gap:8px; max-height:360px; overflow-y:auto; padding:8px; background:var(--bg); border-radius:10px; border:1px solid var(--border); }
  .msg-bubble-row { display:flex; }
  .msg-bubble-row.mine { justify-content:flex-end; }
  .msg-bubble { max-width:75%; border-radius:12px; padding:8px 10px; font-size:13px; background:#fff; border:1px solid var(--border); }
  .msg-bubble.admin { background:var(--orange-bg); }
  .msg-bubble-meta { font-size:10px; color:var(--text-secondary); margin-bottom:3px; }
  .msg-bubble textarea.msg-edit { width:100%; min-height:50px; font-size:13px; }
  .msg-compose { display:flex; gap:8px; margin-top:10px; align-items:flex-end; }
  .msg-compose-text { flex:1; min-height:44px; padding:8px; border:1px solid var(--border); border-radius:8px; font-size:13px; font-family:inherit; resize:vertical; }
  .badge-unread { display:inline-block; background:var(--danger); color:#fff; border-radius:20px; min-width:18px; height:18px; padding:0 5px; font-size:10px; font-weight:700; line-height:18px; text-align:center; margin-left:6px; }
</style>
</head>

<script>
// ===================== Configuration =====================
const CLERK_PUBLISHABLE_KEY = 'pk_test_c21pbGluZy10YXBpci03MDkwLmNsZXJrLmFjY291bnRzLmRldiQ';

const P_PROJET = 'board_relation_mm6ddgy';
const P_DATE = 'date_mm6d1p6e';

const P_RAISON_DINER = 'text_mm6djdex';

const P_TOTAL_AJUSTE = 'numeric_mm6d8c9m';
const P_KM_SUGGERE = 'numeric_mm6d4hvv';
const P_KM_AJUSTE = 'numeric_mm6dxafw';
const P_STATUT = 'color_mm6dxpt7';

const PROJECTS_BOARD = 8371776057;
const PROJECT_STAGE_COL = 'status3';
const PROJECT_ACTIVE_INDEX = 0; // "Projet en cours"

const MESSAGES_BOARD = 18427410933;
const M_EMPLOYE = 'board_relation_mm6dwczs';
const M_MESSAGE = 'long_text_mm6dxv7r';
const M_DATE = 'date_mm6dxf1a';
const M_STATUT = 'color_mm6dfb7s';
const M_REPONSE = 'long_text_mm6deccf';
const M_REPONSE_DATE = 'date_mm6da4sc';
const M_AUTEUR = 'color_mm6dd12s';
const M_LU_ADMIN = 'boolean_mm6dm8mb';
const M_LU_EMPLOYE = 'boolean_mm6dc4ar';

// Board de planification (mêmes colonnes que api/employee-today.js) — utilisé UNIQUEMENT par
// le Tableau de bord pour savoir qui est planifié aujourd'hui.
const PLANNING_BOARD = 18426416285;
const PL_PROJET = 'board_relation_mm66kzga';
const PL_DATE = 'date_mm66w0ga';
const PL_MENUISIERS = 'board_relation_mm66fec0';

// ===================== Helpers =====================
function loadExternalScript(attrs) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    Object.entries(attrs).forEach(([k, v]) => { if (k === 'src') s.src = v; else s.setAttribute(k, v); });
    s.async = true; s.crossOrigin = 'anonymous';
    s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}
function showToast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}
async function gql(query, variables) {
  const token = await Clerk.session.getToken();
  const res = await fetch('/api/monday', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ query, variables })
  });
  const data = await res.json();
  if (data.errors) throw new Error(data.errors.map(e => e.message).join('; '));
  if (data.error) throw new Error(data.error);
  return data.data;
}
function cvIndex(item) {
  const m = {};
  (item.column_values || []).forEach(c => { m[c.id] = c; });
  return m;
}
function round15(minutes) {
  return Math.round(minutes / 15) * 15;
}
// Formate une Date en "YYYY-MM-DD" en utilisant ses composantes LOCALES (jamais toISOString,
// qui convertit en UTC et peut décaler la date d'un jour selon l'heure/fuseau — c'était la
// cause du bug de sélection de semaine décalée d'une journée).
function toLocalISODate(dt) {
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, '0');
  const day = String(dt.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function mondayOfWeek(d) {
  // Accepte soit un objet Date, soit une chaîne "YYYY-MM-DD" — dans les deux cas on travaille
  // en calendrier LOCAL, jamais via un parsing/format qui passe par UTC.
  const dt = (d instanceof Date) ? new Date(d.getFullYear(), d.getMonth(), d.getDate()) : new Date(d + 'T12:00:00');
  const day = dt.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  dt.setDate(dt.getDate() + diff);
  return toLocalISODate(dt);
}
function fmtWeekLabel(monday) {
  const start = new Date(monday + 'T12:00:00');
  start.setDate(start.getDate() - 1); // dimanche précédent le lundi de la semaine
  const end = new Date(start); end.setDate(end.getDate() + 6); // samedi
  const f = d => d.toLocaleDateString('fr-CA', { day: 'numeric', month: 'short' });
  return `Semaine du ${f(start)} au ${f(end)}`;
}
function hourText(cv) {
  if (!cv || cv.hour == null) return '';
  return String(cv.hour).padStart(2, '0') + ':' + String(cv.minute).padStart(2, '0');
}
function statusBadge(label) {
  const cls = { 'En attente': 'badge-attente', 'Approuvé': 'badge-approuve', 'Rejeté': 'badge-rejete', 'Exporté': 'badge-exporte' }[label] || 'badge-attente';
  return `<span class="badge ${cls}">${label || 'En attente'}</span>`;
}
// Retire l'indicatif "1" en tête (format monday: souvent "1" + 10 chiffres) afin
// de toujours afficher exactement 10 chiffres, sans indicatif.
function formatPhone10(raw) {
  const digits = String(raw || '').replace(/\D/g, '');
  const ten = (digits.length === 11 && digits[0] === '1') ? digits.slice(1) : digits;
  return ten;
}

// ===================== État =====================
let currentWeek = mondayOfWeek(new Date());
let poinconsCache = [];
let employeesCache = [];
let activeProjectsCache = [];
let messagesCache = [];
let selectedEmpId = null;
let selectedProjId = null;

function weekDatesSunToSat(monday) {
  const start = new Date(monday + 'T12:00:00');
  start.setDate(start.getDate() - 1); // dimanche précédent le lundi de la semaine
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    days.push(toLocalISODate(d));
  }
  return days;
}
const DAY_LABELS = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];
function fmtDayHeader(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  return DAY_LABELS[d.getDay()] + ' ' + d.getDate();
}

async function loadActiveProjects() {
  const data = await gql(`
    query($board: [ID!], $col: ID!, $val: CompareValue!) {
      boards(ids: $board) {
        items_page(query_params: { rules: [{ column_id: $col, compare_value: $val, operator: any_of }] }, limit: 300) {
          items { id name }
        }
      }
    }
  `, { board: [String(PROJECTS_BOARD)], col: PROJECT_STAGE_COL, val: [PROJECT_ACTIVE_INDEX] });
  activeProjectsCache = ((data.boards[0] && data.boards[0].items_page.items) || [])
    .map(it => ({ id: it.id, name: it.name }))
    .sort((a, b) => a.name.localeCompare(b.name));
}

// ===================== Chargement commun des poinçons de la semaine =====================
async function loadPoinconsForWeek() {
  document.getElementById('wk-label').textContent = fmtWeekLabel(currentWeek);
  document.getElementById('wk-label2').textContent = fmtWeekLabel(currentWeek);
  document.getElementById('wk-label3').textContent = fmtWeekLabel(currentWeek);
  document.getElementById('parempl-content').innerHTML = '<div class="empty-state">Chargement…</div>';
  document.getElementById('parprojet-content').innerHTML = '<div class="empty-state">Chargement…</div>';
  document.getElementById('semaine-content').innerHTML = '<div class="empty-state">Chargement…</div>';

  try {
    await loadPoinconsForWeekInner();
  } catch (err) {
    const msg = `<div class="empty-state">Erreur de chargement: ${err.message}<br><button class="btn btn-outline" style="margin-top:8px;" onclick="loadPoinconsForWeek()">↻ Réessayer</button></div>`;
    document.getElementById('parempl-content').innerHTML = msg;
    document.getElementById('parprojet-content').innerHTML = msg;
    document.getElementById('semaine-content').innerHTML = msg;
    showToast('Erreur: ' + err.message);
  }
}

async function loadPoinconsForWeekInner() {
  const data = await gql(`
    query($board: ID!, $col: String!, $val: [String]!) {
      items_page_by_column_values(board_id: $board, columns: [{ column_id: $col, column_values: $val }], limit: 300) {
        items {
          id name
          column_values(ids: ["${P_EMPLOYE}","${P_PROJET}","${P_DATE}","${P_HDEBUT}","${P_HFIN}","${P_GPS_DEBUT}","${P_GPS_FIN}","${P_MATIN_NP}","${P_RAISON_MATIN}","${P_DINER_NP}","${P_RAISON_DINER}","${P_PM_PRISE}","${P_TOTAL_BRUT}","${P_TOTAL_AJUSTE}","${P_KM_SUGGERE}","${P_KM_AJUSTE}","${P_STATUT}"]) {
            id text
            ... on BoardRelationValue { linked_items { id name } }
            ... on HourValue { hour minute }
          }
        }
      }
    }
  `, { board: String(POINCONS_BOARD), col: P_SEMAINE, val: [currentWeek] });

  poinconsCache = (data.items_page_by_column_values.items || []).map(it => {
    const cv = cvIndex(it);
    const emp = (cv[P_EMPLOYE].linked_items || [])[0] || { id: '', name: '?' };
    const proj = (cv[P_PROJET].linked_items || [])[0] || { id: '', name: '?' };
    return {
      itemId: it.id,
      empId: emp.id, empName: emp.name,
      projId: proj.id, projName: proj.name,
      date: cv[P_DATE].text || '',
      heureDebut: hourText(cv[P_HDEBUT]), heureFin: hourText(cv[P_HFIN]),
      gpsDebut: cv[P_GPS_DEBUT].text || '', gpsFin: cv[P_GPS_FIN].text || '',
      matinNP: cv[P_MATIN_NP].text === 'v', raisonMatin: cv[P_RAISON_MATIN].text || '',
      dinerNP: cv[P_DINER_NP].text === 'v', raisonDiner: cv[P_RAISON_DINER].text || '',
      pmPrise: cv[P_PM_PRISE].text === 'v',
      totalBrut: cv[P_TOTAL_BRUT].text || '', totalAjuste: cv[P_TOTAL_AJUSTE].text || '',
      kmSuggere: cv[P_KM_SUGGERE].text || '', kmAjuste: cv[P_KM_AJUSTE].text || '',
      statut: cv[P_STATUT].text || 'En attente'
    };
  }).sort((a, b) => a.empName.localeCompare(b.empName) || a.date.localeCompare(b.date));

  if (!employeesCache.length) await loadComptes();
  if (!activeProjectsCache.length) await loadActiveProjects();
  await loadMessagesCache();

  renderVueSemaine();
  renderParEmploye();
  renderParProjet();
  renderExportPendingNote();
}

// ===================== Tab: Vue de la semaine =====================
function renderVueSemaine() {
  const el = document.getElementById('semaine-content');
  const totals = {};
  poinconsCache.forEach(p => {
    if (!p.empId) return;
    totals[p.empId] = totals[p.empId] || { name: p.empName, total: 0, pending: 0 };
    // Les poinçons rejetés ne comptent pas dans le total d'heures de la semaine.
    if (p.statut !== 'Rejeté') totals[p.empId].total += Number(p.totalAjuste) || 0;
    if (!p.statut || p.statut === 'En attente') totals[p.empId].pending += 1;
  });
  const rows = Object.keys(totals).map(empId => {
    const emp = employeesCache.find(e => e.id === empId);
    return { empId, name: totals[empId].name, codeAvantage: (emp && emp.codeAvantage) || '', total: totals[empId].total, pending: totals[empId].pending };
  }).sort((a, b) => (a.codeAvantage || '').localeCompare(b.codeAvantage || '', undefined, { numeric: true }));

  if (!rows.length) { el.innerHTML = '<div class="empty-state">Aucun poinçon cette semaine.</div>'; return; }

  let grand = 0, grandPending = 0;
  let html = `<table><thead><tr><th>Employé</th><th>Total heures (ajustées)</th><th>Poinçons en attente</th></tr></thead><tbody>`;
  rows.forEach(r => {
    grand += r.total;
    grandPending += r.pending;
    html += `<tr><td>${r.name}<br><span style="font-size:11px;color:var(--text-secondary);">${r.codeAvantage || '—'}</span></td><td>${r.total.toFixed(2)} h</td><td>${r.pending ? `<span class="badge badge-attente">${r.pending}</span>` : '—'}</td></tr>`;
  });
  html += `</tbody><tfoot><tr><td>Total</td><td><strong>${grand.toFixed(2)} h</strong></td><td><strong>${grandPending || '—'}</strong></td></tr></tfoot></table>`;
  el.innerHTML = html;
}

async function savePoincon(itemId, tr, forceStatus) {
  const total = Number(tr.querySelector('.inp-total').value) || 0;
  const km = Number(tr.querySelector('.inp-km').value) || 0;
  const cv = { [P_TOTAL_AJUSTE]: total, [P_KM_AJUSTE]: km };
  if (forceStatus) cv[P_STATUT] = { label: forceStatus };
  try {
    await gql(`mutation($board: ID!, $item: ID!, $cv: JSON!) { change_multiple_column_values(board_id: $board, item_id: $item, column_values: $cv) { id } }`,
      { board: String(POINCONS_BOARD), item: String(itemId), cv: JSON.stringify(cv) });
    showToast('Enregistré ✔');
    await loadPoinconsForWeek();
  } catch (err) { showToast('Erreur: ' + err.message); }
}

// ===================== Vue détail commune (employé OU projet) =====================
// groupField: le champ par lequel regrouper les LIGNES du tableau sommaire ('projName' en
// vue employé, 'empName' en vue projet). opts.manualMode / fixedEmpId|fixedProjId servent au
// formulaire d'ajout manuel.
function renderEntityDetail(rows, days, groupField, counterpartLabel, opts) {
  const addForm = manualAddFormHtml(opts, days);
  const messagesHtmlTop = opts.showMessagesForEmpId ? renderMessagesSection(opts.showMessagesForEmpId) : '';
  if (!rows.length) {
    return addForm + '<div class="empty-state">Aucun poinçon cette semaine.</div>' + messagesHtmlTop;
  }

  // Les poinçons rejetés sont retirés des totaux et de la liste principale — ils vivent dans
  // une section repliable "Rejetés" plus bas (voir en fin de fonction), avec un bouton pour
  // les restaurer en cas d'erreur d'approbation.
  const rejectedRows = rows.filter(p => p.statut === 'Rejeté');
  rows = rows.filter(p => p.statut !== 'Rejeté');

  if (!rows.length) {
    return addForm + '<div class="empty-state">Aucun poinçon actif cette semaine.</div>' + messagesHtmlTop + renderRejectedSection(rejectedRows, counterpartLabel);
  }

  // --- Tableau sommaire (heures ajustées) ---
  const groups = {};
  rows.forEach(p => {
    const key = p[groupField] || '—';
    groups[key] = groups[key] || {};
    groups[key][p.date] = (groups[key][p.date] || 0) + (Number(p.totalAjuste) || 0);
  });
  const groupNames = Object.keys(groups).sort((a, b) => a.localeCompare(b));
  const dayTotals = {};
  days.forEach(d => { dayTotals[d] = 0; });
  let grandTotal = 0;

  let table = `<table class="summary-table"><thead><tr><th>${counterpartLabel === 'projet' ? 'Projet' : 'Employé'}</th>${days.map(d => `<th>${fmtDayHeader(d)}</th>`).join('')}<th>Total</th></tr></thead><tbody>`;
  groupNames.forEach(name => {
    let rowTotal = 0;
    table += `<tr><td>${name}</td>`;
    days.forEach(d => {
      const v = groups[name][d] || 0;
      rowTotal += v; dayTotals[d] += v; grandTotal += v;
      table += `<td>${v ? v.toFixed(2) : '—'}</td>`;
    });
    table += `<td><strong>${rowTotal.toFixed(2)}</strong></td></tr>`;
  });
  table += `</tbody><tfoot><tr><td>Total</td>${days.map(d => `<td>${dayTotals[d] ? dayTotals[d].toFixed(2) : '—'}</td>`).join('')}<td><strong>${grandTotal.toFixed(2)} h</strong></td></tr></tfoot></table>`;

  // --- Suivi de l'approbation ---
  const nApprouve = rows.filter(p => p.statut === 'Approuvé').length;
  const nAttente = rows.filter(p => !p.statut || p.statut === 'En attente').length;
  const nRejete = rejectedRows.length;
  const progress = `<div class="progress-note">${statusBadge('Approuvé')} ${nApprouve}<span>${statusBadge('En attente')} ${nAttente}</span><span>${statusBadge('Rejeté')} ${nRejete}</span></div>`;

  // --- Liste détaillée ---
  let list = `<div class="section-title">Détail des poinçons</div><table><thead><tr>
    <th>Date</th><th>${counterpartLabel === 'projet' ? 'Employé' : 'Projet'}</th><th>Début</th><th>Fin</th><th>Brut</th><th>Ajusté</th><th>KM</th><th>Pauses</th><th>Statut</th><th></th>
  </tr></thead><tbody>`;
  rows.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(p => {
    const pauseNotes = [];
    if (p.matinNP) pauseNotes.push('Matin non pris: ' + (p.raisonMatin || '—'));
    if (p.dinerNP) pauseNotes.push('Dîner non pris: ' + (p.raisonDiner || '—'));
    if (!p.pmPrise) pauseNotes.push('PM non pris');
    const gpsLinks = [
      p.gpsDebut ? `<a class="gps-link" target="_blank" href="https://maps.google.com/?q=${p.gpsDebut}">📍début</a>` : '',
      p.gpsFin ? `<a class="gps-link" target="_blank" href="https://maps.google.com/?q=${p.gpsFin}">📍fin</a>` : ''
    ].filter(Boolean).join(' ');
    const counterpart = counterpartLabel === 'projet' ? p.empName : p.projName;
    list += `<tr data-item="${p.itemId}">
      <td>${p.date}<br>${gpsLinks}</td>
      <td>${counterpart}</td>
      <td>${p.heureDebut}</td>
      <td>${p.heureFin}</td>
      <td>${p.totalBrut}</td>
      <td><input type="number" step="0.25" class="inp-total" value="${p.totalAjuste}"></td>
      <td><input type="number" step="0.1" class="inp-km" value="${p.kmSuggere || p.kmAjuste || ''}"></td>
      <td style="max-width:160px;font-size:11px;color:var(--danger);">${pauseNotes.join('<br>') || ''}</td>
      <td>${statusBadge(p.statut)}</td>
      <td>
        <button class="btn btn-green btn-approve">✔</button>
        <button class="btn btn-danger btn-reject">✘</button>
        <button class="btn btn-outline btn-save">Enreg.</button>
      </td>
    </tr>`;
  });
  list += `</tbody></table>`;

  const messagesHtml = opts.showMessagesForEmpId ? renderMessagesSection(opts.showMessagesForEmpId) : '';

  return table + progress + addForm + list + messagesHtml + renderRejectedSection(rejectedRows, counterpartLabel);
}

// --- Section repliable des poinçons rejetés (exclus des totaux, restaurables) ---
function renderRejectedSection(rows, counterpartLabel) {
  if (!rows.length) return '';
  let html = `<details style="margin-top:16px;">
    <summary style="cursor:pointer;font-weight:700;font-size:13px;color:var(--text-secondary);">Poinçons rejetés (${rows.length})</summary>
    <table style="margin-top:8px;"><thead><tr>
      <th>Date</th><th>${counterpartLabel === 'projet' ? 'Employé' : 'Projet'}</th><th>Début</th><th>Fin</th><th>Ajusté</th><th>Statut</th><th></th>
    </tr></thead><tbody>`;
  rows.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(p => {
    const counterpart = counterpartLabel === 'projet' ? p.empName : p.projName;
    html += `<tr data-item="${p.itemId}" data-rejected="1">
      <td>${p.date}</td><td>${counterpart}</td><td>${p.heureDebut}</td><td>${p.heureFin}</td><td>${p.totalAjuste}</td><td>${statusBadge(p.statut)}</td>
      <td><button class="btn btn-outline btn-restore">↩ Restaurer</button></td>
    </tr>`;
  });
  html += `</tbody></table></details>`;
  return html;
}

async function restorePoincon(itemId) {
  try {
    await gql(`mutation($board: ID!, $item: ID!, $cv: JSON!) { change_multiple_column_values(board_id: $board, item_id: $item, column_values: $cv) { id } }`,
      { board: String(POINCONS_BOARD), item: String(itemId), cv: JSON.stringify({ [P_STATUT]: { label: 'En attente' } }) });
    showToast('Poinçon restauré ✔');
    await loadPoinconsForWeek();
  } catch (err) { showToast('Erreur: ' + err.message); }
}

// --- Messages de l'employé, affichés à la fin de ses poinçons de la semaine (Vue par employé) ---
// Construit le fil de discussion complet avec un employé (toutes les semaines confondues —
// une conversation ne doit pas disparaître quand on change de semaine affichée). Les anciens
// messages avec une "Réponse" (ancien format, avant l'ajout de la colonne Auteur) sont
// affichés comme une bulle Admin distincte pour préserver l'historique.
function renderMessagesSection(empId) {
  const bubbles = [];
  messagesCache.filter(m => m.empId === empId).forEach(m => {
    bubbles.push({
      itemId: m.itemId, auteur: m.auteur || 'Employé', message: m.message, date: m.date,
      luAdmin: m.luAdmin, luEmploye: m.luEmploye, legacy: false
    });
    if ((m.reponse || '').trim()) {
      bubbles.push({
        itemId: m.itemId + '-legacy', auteur: 'Admin', message: m.reponse, date: m.reponseDate || m.date,
        luAdmin: true, luEmploye: true, legacy: true
      });
    }
  });
  bubbles.sort((a, b) => a.date.localeCompare(b.date));

  let html = `<div class="section-title">Messages avec l'employé</div><div class="msg-thread">`;
  if (!bubbles.length) {
    html += `<div class="empty-state" style="padding:14px;">Aucun message échangé pour le moment.</div>`;
  } else {
    bubbles.forEach(b => {
      const mine = b.auteur === 'Admin';
      html += `<div class="msg-bubble-row ${mine ? 'mine' : ''}" data-msg="${b.itemId}" data-legacy="${b.legacy ? '1' : '0'}">
        <div class="msg-bubble ${mine ? 'admin' : 'emp'}">
          <div class="msg-bubble-meta">${mine ? 'Vous' : 'Employé'} — ${(b.date || '').slice(0, 10)}</div>
          <div class="msg-view">${(b.message || '').replace(/</g, '&lt;')}</div>
          <textarea class="msg-edit hidden">${(b.message || '').replace(/</g, '&lt;')}</textarea>
          <div class="flex-row" style="margin-top:6px;">
            <button class="btn btn-outline btn-msg-edit" style="padding:3px 8px;font-size:11px;">✏️</button>
            <button class="btn btn-outline btn-msg-save hidden" style="padding:3px 8px;font-size:11px;">Enreg.</button>
            <button class="btn btn-outline btn-msg-cancel hidden" style="padding:3px 8px;font-size:11px;">Annuler</button>
            <button class="btn btn-danger btn-msg-delete" style="padding:3px 8px;font-size:11px;">🗑️</button>
          </div>
        </div>
      </div>`;
    });
  }
  html += `</div>
    <div class="msg-compose">
      <textarea class="msg-compose-text" placeholder="Écrire un message à cet employé…"></textarea>
      <button class="btn btn-primary btn-msg-send-new">✉️ Envoyer</button>
    </div>`;
  return html;
}

function manualAddFormHtml(opts, days) {
  const minDate = days[0], maxDate = days[6];
  const todayStr = new Date().toISOString().slice(0, 10);
  const defaultDate = (todayStr >= minDate && todayStr <= maxDate) ? todayStr : days[1]; // lundi par défaut

  const projectOptions = activeProjectsCache.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
  const employeeOptions = employeesCache.filter(e => e.statut === 'Actif' || e.statut === 'Inactif')
    .slice().sort((a, b) => a.name.localeCompare(b.name))
    .map(e => `<option value="${e.id}">${e.name}</option>`).join('');

  const empField = opts.manualMode === 'employee'
    ? `<div><label>Employé</label><input type="hidden" class="manual-emp" value="${opts.fixedEmpId || ''}"><div style="padding:6px 0;font-weight:600;font-size:13px;">${opts.fixedEmpName || ''}</div></div>`
    : `<label>Employé<select class="manual-emp wide"><option value="">— choisir —</option>${employeeOptions}</select></label>`;

  const projField = opts.manualMode === 'project'
    ? `<div><label>Projet</label><input type="hidden" class="manual-proj" value="${opts.fixedProjId || ''}"><div style="padding:6px 0;font-weight:600;font-size:13px;">${opts.fixedProjName || ''}</div></div>`
    : `<label>Projet<select class="manual-proj wide"><option value="">— choisir —</option>${projectOptions}</select></label>`;

  return `<div class="manual-add-form">
    ${empField}
    ${projField}
    <label>Date<input type="date" class="manual-date" value="${defaultDate}" min="${minDate}" max="${maxDate}"></label>
    <label>Début<input type="time" class="manual-hdebut"></label>
    <label>Fin<input type="time" class="manual-hfin"></label>
    <div style="display:flex;flex-direction:row;align-items:center;gap:14px;flex-wrap:nowrap;">
      <label style="flex-direction:row;align-items:center;gap:4px;white-space:nowrap;"><input type="checkbox" class="manual-matin" checked> Pause matin prise</label>
      <label style="flex-direction:row;align-items:center;gap:4px;white-space:nowrap;"><input type="checkbox" class="manual-diner" checked> Dîner pris</label>
      <label style="flex-direction:row;align-items:center;gap:4px;white-space:nowrap;"><input type="checkbox" class="manual-pm"> Pause PM prise</label>
    </div>
    <button class="btn btn-primary btn-manual-add">+ Ajouter un poinçon (oubli)</button>
  </div>`;
}

function wireDetailEvents(el, opts) {
  el.querySelectorAll('tr[data-item]').forEach(tr => {
    const itemId = tr.getAttribute('data-item');
    const btnApprove = tr.querySelector('.btn-approve');
    const btnReject = tr.querySelector('.btn-reject');
    const btnSave = tr.querySelector('.btn-save');
    const btnRestore = tr.querySelector('.btn-restore');
    if (btnApprove) btnApprove.addEventListener('click', () => savePoincon(itemId, tr, 'Approuvé'));
    if (btnReject) btnReject.addEventListener('click', () => savePoincon(itemId, tr, 'Rejeté'));
    if (btnSave) btnSave.addEventListener('click', () => savePoincon(itemId, tr, null));
    if (btnRestore) btnRestore.addEventListener('click', () => restorePoincon(itemId));
  });
  const addBtn = el.querySelector('.btn-manual-add');
  if (addBtn) addBtn.addEventListener('click', () => handleManualAdd(el));
  const msgEmpId = opts && opts.showMessagesForEmpId;
  wireMessageEvents(el, msgEmpId);
  // Consulter le fil de messages d'un employé = les marquer lus (pastille rouge du sidebar).
  if (msgEmpId) markEmployeeMessagesReadByAdmin(msgEmpId);
}

function wireMessageEvents(el, empId) {
  el.querySelectorAll('[data-msg]').forEach(row => {
    const itemId = row.getAttribute('data-msg');
    const isLegacy = row.getAttribute('data-legacy') === '1';
    const viewEl = row.querySelector('.msg-view');
    const editEl = row.querySelector('.msg-edit');
    const btnEdit = row.querySelector('.btn-msg-edit');
    const btnSave = row.querySelector('.btn-msg-save');
    const btnCancel = row.querySelector('.btn-msg-cancel');
    const btnDelete = row.querySelector('.btn-msg-delete');
    if (isLegacy) {
      // Bulle "réponse" historique (ancien format, avant la colonne Auteur) — non modifiable
      // individuellement ici, affichée pour préserver l'historique seulement.
      if (btnEdit) btnEdit.classList.add('hidden');
      if (btnSave) btnSave.classList.add('hidden');
      if (btnCancel) btnCancel.classList.add('hidden');
      if (btnDelete) btnDelete.classList.add('hidden');
      return;
    }
    if (btnEdit) btnEdit.addEventListener('click', () => {
      viewEl.classList.add('hidden'); btnEdit.classList.add('hidden');
      editEl.classList.remove('hidden'); btnSave.classList.remove('hidden'); btnCancel.classList.remove('hidden');
    });
    if (btnCancel) btnCancel.addEventListener('click', () => {
      editEl.value = viewEl.textContent;
      viewEl.classList.remove('hidden'); btnEdit.classList.remove('hidden');
      editEl.classList.add('hidden'); btnSave.classList.add('hidden'); btnCancel.classList.add('hidden');
    });
    if (btnSave) btnSave.addEventListener('click', async () => {
      const newText = editEl.value.trim();
      if (!newText) { showToast('Message vide.'); return; }
      try {
        await gql(`mutation($board: ID!, $item: ID!, $cv: JSON!) { change_multiple_column_values(board_id: $board, item_id: $item, column_values: $cv) { id } }`,
          { board: String(MESSAGES_BOARD), item: String(itemId), cv: JSON.stringify({ [M_MESSAGE]: { text: newText } }) });
        showToast('Message modifié ✔');
        await loadMessagesCache();
        renderParEmploye();
      } catch (err) { showToast('Erreur: ' + err.message); }
    });
    if (btnDelete) btnDelete.addEventListener('click', async () => {
      if (!confirm('Supprimer ce message ?')) return;
      try {
        await gql(`mutation($item: ID!) { delete_item(item_id: $item) { id } }`, { item: String(itemId) });
        showToast('Message supprimé ✔');
        await loadMessagesCache();
        renderParEmploye();
      } catch (err) { showToast('Erreur: ' + err.message); }
    });
  });

  // --- Envoyer un NOUVEAU message à l'employé (pas seulement répondre) ---
  const composeText = el.querySelector('.msg-compose-text');
  const btnSendNew = el.querySelector('.btn-msg-send-new');
  if (btnSendNew && empId) {
    btnSendNew.addEventListener('click', async () => {
      const text = (composeText.value || '').trim();
      if (!text) { showToast('Message vide.'); return; }
      const nowTor = new Date();
      const dateStr = nowTor.toLocaleDateString('en-CA', { timeZone: 'America/Toronto' });
      const timeStr = nowTor.toLocaleTimeString('en-CA', { timeZone: 'America/Toronto', hour12: false, hour: '2-digit', minute: '2-digit' });
      const cv = {
        [M_EMPLOYE]: { item_ids: [Number(empId)] },
        [M_MESSAGE]: { text },
        [M_DATE]: { date: dateStr, time: timeStr + ':00' },
        [M_STATUT]: { label: 'Nouveau' },
        [M_AUTEUR]: { label: 'Admin' },
        // L'admin vient d'écrire ce message : lu de son côté, pas encore de celui de l'employé
        // (déclenche la pastille rouge sur son bouton "Mes messages" mobile).
        [M_LU_ADMIN]: { checked: 'true' },
        [M_LU_EMPLOYE]: { checked: 'false' }
      };
      try {
        await gql(`mutation($board: ID!, $name: String!, $cv: JSON!) { create_item(board_id: $board, item_name: $name, column_values: $cv) { id } }`,
          { board: String(MESSAGES_BOARD), name: `Admin — ${dateStr}`, cv: JSON.stringify(cv) });
        showToast('Message envoyé ✔');
        await loadMessagesCache();
        renderParEmploye();
      } catch (err) { showToast('Erreur: ' + err.message); }
    });
  }
}

// Marque comme "lus par l'admin" tous les messages non lus envoyés par cet employé — appelé
// automatiquement chaque fois que son fil de messages est affiché (consulter = lire).
async function markEmployeeMessagesReadByAdmin(empId) {
  const toMark = messagesCache.filter(m => m.empId === empId && m.auteur === 'Employé' && !m.luAdmin);
  if (!toMark.length) return;
  for (const m of toMark) {
    try {
      await gql(`mutation($board: ID!, $item: ID!, $cv: JSON!) { change_multiple_column_values(board_id: $board, item_id: $item, column_values: $cv) { id } }`,
        { board: String(MESSAGES_BOARD), item: String(m.itemId), cv: JSON.stringify({ [M_LU_ADMIN]: { checked: 'true' } }) });
      m.luAdmin = true; // mise à jour optimiste du cache local
    } catch (e) { /* ignore — sera retenté au prochain rafraîchissement */ }
  }
  const badge = document.querySelector(`.split-sidebar button[data-emp="${empId}"] .badge-unread`);
  if (badge) badge.remove();
}

async function handleManualAdd(el) {
  const empEl = el.querySelector('.manual-emp');
  const projEl = el.querySelector('.manual-proj');
  const empId = empEl.value;
  const projId = projEl.value;
  const dateVal = el.querySelector('.manual-date').value;
  const hDebut = el.querySelector('.manual-hdebut').value;
  const hFin = el.querySelector('.manual-hfin').value;
  if (!empId || !projId || !dateVal || !hDebut || !hFin) { showToast('Veuillez remplir tous les champs.'); return; }

  const [dh, dm] = hDebut.split(':').map(Number);
  const [fh, fm] = hFin.split(':').map(Number);
  let elapsed = (fh * 60 + fm) - (dh * 60 + dm);
  if (elapsed < 0) elapsed += 1440;
  // Le total payable (plus bas) utilise le temps RÉEL écoulé (elapsed, non arrondi). Le total
  // brut affiché, lui, partage la même base décimale que l'ajusté (arrondi au quart d'heure).
  const brutH = Math.round((round15(elapsed) / 60) * 100) / 100;

  // Même logique CCQ que le poinçon mobile : dîner déduit seulement si la journée se rend à
  // 13h00+, pause PM ajustée seulement si elle se rend à 14h00+.
  const morningTaken = el.querySelector('.manual-matin').checked;
  const lunchTaken = el.querySelector('.manual-diner').checked;
  const afternoonTaken = el.querySelector('.manual-pm').checked;
  const finishMinutes = fh * 60 + fm;
  const lunchApplicable = finishMinutes >= 13 * 60;
  const afternoonApplicable = finishMinutes >= 14 * 60;
  const morningSkipped = !morningTaken;
  const afternoonSkipped = afternoonApplicable && !afternoonTaken;
  const payableRaw = elapsed - (lunchApplicable ? 30 : 0) + (morningSkipped ? 15 : 0) + (afternoonSkipped ? 15 : 0);
  const payableMin = Math.max(0, round15(payableRaw));
  const ajusteH = Math.round((payableMin / 60) * 100) / 100;

  const cv = {
    [P_EMPLOYE]: { item_ids: [Number(empId)] },
    [P_PROJET]: { item_ids: [Number(projId)] },
    [P_DATE]: { date: dateVal },
    [P_SEMAINE]: mondayOfWeek(dateVal),
    [P_HDEBUT]: { hour: dh, minute: dm },
    [P_HFIN]: { hour: fh, minute: fm },
    [P_MATIN_NP]: { checked: morningSkipped ? 'true' : 'false' },
    [P_DINER_NP]: { checked: (lunchApplicable && !lunchTaken) ? 'true' : 'false' },
    [P_PM_PRISE]: { checked: afternoonTaken ? 'true' : 'false' },
    [P_TOTAL_BRUT]: brutH,
    [P_TOTAL_AJUSTE]: ajusteH,
    [P_STATUT]: { label: 'En attente' }
  };
  try {
    await gql(`mutation($board: ID!, $name: String!, $cv: JSON!) { create_item(board_id: $board, item_name: $name, column_values: $cv) { id } }`,
      { board: String(POINCONS_BOARD), name: `Poinçon manuel ${dateVal}`, cv: JSON.stringify(cv) });
    showToast('Poinçon ajouté ✔');
    await loadPoinconsForWeek();
  } catch (err) { showToast('Erreur: ' + err.message); }
}

// ===================== Tab: Vue par employé =====================
function renderParEmploye() {
  const el = document.getElementById('parempl-content');
  const days = weekDatesSunToSat(currentWeek);

  // Employés à afficher : ceux qui ont un compte ACTIF sur l'app mobile, PLUS ceux qui ont au
  // moins un poinçon dans la semaine affichée (poinconsCache est déjà filtré sur currentWeek) —
  // ceci préserve l'historique : un employé désactivé/parti reste visible dans les semaines
  // passées où il a des poinçons, sans polluer la liste des semaines où il n'en a aucun.
  const empIdsWithPunchThisWeek = new Set(poinconsCache.map(p => p.empId));
  const sidebarEmployees = employeesCache.filter(e => (e.clerkUserId && e.accessEnabled) || empIdsWithPunchThisWeek.has(e.id))
    .slice()
    .sort((a, b) => (a.codeAvantage || '').localeCompare(b.codeAvantage || '', undefined, { numeric: true }));

  if (!selectedEmpId || !sidebarEmployees.some(e => e.id === selectedEmpId)) {
    const withPunch = sidebarEmployees.find(e => poinconsCache.some(p => p.empId === e.id));
    selectedEmpId = (withPunch || sidebarEmployees[0] || {}).id || null;
  }

  const sidebarHtml = sidebarEmployees.map(e => {
    const empPunches = poinconsCache.filter(p => p.empId === e.id);
    const count = empPunches.length;
    const pendingCount = empPunches.filter(p => !p.statut || p.statut === 'En attente').length;
    // Crochet vert : l'employé a des poinçons cette semaine ET plus aucun n'est en attente.
    const doneCheck = (count > 0 && pendingCount === 0) ? ' <span style="color:var(--green);" title="Aucun poinçon en attente">✔</span>' : '';
    const unreadMsgCount = messagesCache.filter(m => m.empId === e.id && m.auteur === 'Employé' && !m.luAdmin).length;
    const unreadBadge = unreadMsgCount ? ` <span class="badge-unread" title="${unreadMsgCount} nouveau message${unreadMsgCount > 1 ? 's' : ''}">${unreadMsgCount}</span>` : '';
    return `<button class="${e.id === selectedEmpId ? 'active' : ''}" data-emp="${e.id}">${e.name}${doneCheck}${unreadBadge}<span class="sub">${e.codeAvantage || '—'}${count ? ' · ' + count + ' poinçon' + (count > 1 ? 's' : '') : ''}</span></button>`;
  }).join('');

  const selectedEmp = sidebarEmployees.find(e => e.id === selectedEmpId);
  const empHeader = selectedEmp
    ? `<div style="margin-bottom:14px;"><div style="font-size:20px;font-weight:800;">${selectedEmp.name}</div><div style="font-size:12px;color:var(--text-secondary);">${selectedEmp.codeAvantage || '—'}</div></div>`
    : '';
  const empRows = poinconsCache.filter(p => p.empId === selectedEmpId);
  const detailOpts = { manualMode: 'employee', fixedEmpId: selectedEmpId, fixedEmpName: selectedEmp && selectedEmp.name, showMessagesForEmpId: selectedEmpId };
  const mainHtml = selectedEmpId
    ? empHeader + renderEntityDetail(empRows, days, 'projName', 'employe', detailOpts)
    : '<div class="empty-state">Aucun employé actif ni avec poinçon cette semaine.</div>';

  el.innerHTML = `<div class="split-view">
    <div class="split-sidebar">${sidebarHtml || '<div class="empty-state">Aucun employé.</div>'}</div>
    <div class="split-main">${mainHtml}</div>
  </div>`;

  el.querySelectorAll('.split-sidebar button[data-emp]').forEach(btn => {
    btn.addEventListener('click', () => { selectedEmpId = btn.getAttribute('data-emp'); renderParEmploye(); });
  });
  wireDetailEvents(el, detailOpts);
}

// ===================== Tab: Vue par projet =====================
function renderParProjet() {
  const el = document.getElementById('parprojet-content');
  const days = weekDatesSunToSat(currentWeek);

  const projMap = new Map();
  poinconsCache.forEach(p => { if (p.projId && !projMap.has(p.projId)) projMap.set(p.projId, p.projName); });
  const sidebarProjects = Array.from(projMap.entries()).map(([id, name]) => ({ id, name })).sort((a, b) => a.name.localeCompare(b.name));

  if (!selectedProjId || !sidebarProjects.some(p => p.id === selectedProjId)) {
    selectedProjId = (sidebarProjects[0] || {}).id || null;
  }

  const sidebarHtml = sidebarProjects.map(p => {
    const count = poinconsCache.filter(x => x.projId === p.id).length;
    return `<button class="${p.id === selectedProjId ? 'active' : ''}" data-proj="${p.id}">${p.name}<span class="sub">${count} poinçon${count > 1 ? 's' : ''}</span></button>`;
  }).join('');

  const selectedProj = sidebarProjects.find(p => p.id === selectedProjId);
  const projRows = poinconsCache.filter(p => p.projId === selectedProjId);
  const mainHtml = selectedProjId
    ? renderEntityDetail(projRows, days, 'empName', 'projet', { manualMode: 'project', fixedProjId: selectedProjId, fixedProjName: selectedProj && selectedProj.name })
    : '<div class="empty-state">Aucun projet cette semaine.</div>';

  el.innerHTML = `<div class="split-view">
    <div class="split-sidebar">${sidebarHtml || '<div class="empty-state">Aucun projet cette semaine.</div>'}</div>
    <div class="split-main">${mainHtml}</div>
  </div>`;

  el.querySelectorAll('.split-sidebar button[data-proj]').forEach(btn => {
    btn.addEventListener('click', () => { selectedProjId = btn.getAttribute('data-proj'); renderParProjet(); });
  });
  wireDetailEvents(el);
}

// ===================== Tab: Comptes employés =====================
async function loadComptes() {
  document.getElementById('comptes-content').innerHTML = '<div class="empty-state">Chargement…</div>';
  const data = await gql(`
    query($board: [ID!]) {
      boards(ids: $board) {
        items_page(query_params: { rules: [
          { column_id: "${EMP_ENTREPRISE_COL}", compare_value: [1], operator: any_of },
          { column_id: "${EMP_STATUT_COL}", compare_value: [0,1,2], operator: any_of }
        ] }, limit: 300) {
          items { id name column_values(ids: ["${EMP_PHONE_COL}","${COL_CLERK_ID}","${COL_ACCESS}","${EMP_STATUT_COL}","${EMP_CODE_AVANTAGE_COL}","${EMP_TITRE_COL}","${EMP_ADRESSE_COL}"]) { id text } }
        }
      }
    }
  `, { board: [String(EMPLOYEES_BOARD)] });

  employeesCache = ((data.boards[0] && data.boards[0].items_page.items) || []).map(it => {
    const cv = cvIndex(it);
    return {
      id: it.id, name: it.name,
      phone: formatPhone10(cv[EMP_PHONE_COL].text),
      clerkUserId: cv[COL_CLERK_ID].text || '',
      accessEnabled: cv[COL_ACCESS].text === 'v',
      statut: cv[EMP_STATUT_COL].text || '',
      codeAvantage: cv[EMP_CODE_AVANTAGE_COL].text || '',
      titre: cv[EMP_TITRE_COL].text || '',
      adresse: cv[EMP_ADRESSE_COL].text || ''
    };
  }).sort((a, b) => a.name.localeCompare(b.name));

  renderComptes();
}

const COMPTES_COLS_HEAD = `<th>Employé</th><th>Titre d'emploi</th><th>Code avantage</th><th>Adresse complète</th><th>Téléphone</th><th>Accès</th><th>Actions</th>`;

function comptesRowHtml(e, isTermine) {
  return `<tr data-emp="${e.id}" data-clerk="${e.clerkUserId}">
      <td>${e.name}</td>
      <td>${e.titre || '—'}</td>
      <td>${e.codeAvantage || '—'}</td>
      <td style="max-width:220px;">${e.adresse || '—'}</td>
      <td>${e.phone}</td>
      <td>${e.clerkUserId ? (e.accessEnabled ? '<span class="badge badge-approuve">Actif</span>' : '<span class="badge badge-rejete">Désactivé</span>') : '<span class="badge badge-attente">Aucun compte</span>'}</td>
      <td>
        ${!e.clerkUserId ? (isTermine ? '<span style="color:var(--text-secondary);font-size:12px;">Employé terminé — accès non disponible</span>' : `
          <input type="tel" class="inp-phone" placeholder="Téléphone" value="${e.phone}">
          <input type="password" class="inp-pass" placeholder="Mot de passe (min. 5)">
          <button class="btn btn-primary btn-create">Créer l'accès</button>
        `) : `
          <input type="password" class="inp-newpass" placeholder="Nouveau mot de passe">
          <button class="btn btn-outline btn-reset">Réinitialiser</button>
          <button class="btn ${e.accessEnabled ? 'btn-danger' : 'btn-green'} btn-toggle">${e.accessEnabled ? 'Désactiver' : 'Activer'}</button>
        `}
      </td>
    </tr>`;
}

function renderComptes() {
  const el = document.getElementById('comptes-content');
  const term = (document.getElementById('comptes-search').value || '').trim().toLowerCase();
  const matches = e => !term || [e.name, e.titre, e.codeAvantage, e.adresse, e.phone].join(' ').toLowerCase().includes(term);

  const actifs = employeesCache.filter(e => e.statut === 'Actif' && matches(e));
  const inactifs = employeesCache.filter(e => e.statut === 'Inactif' && matches(e));
  const termines = employeesCache.filter(e => e.statut === 'Terminé' && matches(e));

  let html = `<div class="section-title">Actifs</div>
    <table><thead><tr>${COMPTES_COLS_HEAD}</tr></thead>
    <tbody>${actifs.map(e => comptesRowHtml(e, false)).join('') || '<tr><td colspan="7" class="empty-state">Aucun résultat.</td></tr>'}</tbody></table>

    <div class="section-title">Inactifs</div>
    <table><thead><tr>${COMPTES_COLS_HEAD}</tr></thead>
    <tbody>${inactifs.map(e => comptesRowHtml(e, false)).join('') || '<tr><td colspan="7" class="empty-state">Aucun résultat.</td></tr>'}</tbody></table>

    <details style="margin-top:20px;" ${term ? 'open' : ''}>
      <summary style="cursor:pointer;font-weight:700;font-size:15px;color:var(--text-secondary);">Employés terminés (historique — ${termines.length})</summary>
      <table style="margin-top:10px;"><thead><tr>${COMPTES_COLS_HEAD}</tr></thead>
      <tbody>${termines.map(e => comptesRowHtml(e, true)).join('') || '<tr><td colspan="7" class="empty-state">Aucun résultat.</td></tr>'}</tbody></table>
    </details>`;
  el.innerHTML = html;

  el.querySelectorAll('tr[data-emp]').forEach(tr => {
    const empId = tr.getAttribute('data-emp');
    const clerkUserId = tr.getAttribute('data-clerk');
    const btnCreate = tr.querySelector('.btn-create');
    if (btnCreate) btnCreate.addEventListener('click', async () => {
      const phone = tr.querySelector('.inp-phone').value.trim();
      const pass = tr.querySelector('.inp-pass').value;
      if (!phone || !pass) { showToast('Téléphone et mot de passe requis.'); return; }
      try {
        const empName = tr.children[0].textContent;
        await employeeAdminCall({ action: 'createAccount', employeeItemId: empId, employeeName: empName, phone, password: pass });
        showToast('Compte créé ✔'); loadComptes();
      } catch (err) { showToast('Erreur: ' + err.message); }
    });
    const btnReset = tr.querySelector('.btn-reset');
    if (btnReset) btnReset.addEventListener('click', async () => {
      const pass = tr.querySelector('.inp-newpass').value;
      if (!pass) { showToast('Nouveau mot de passe requis.'); return; }
      try { await employeeAdminCall({ action: 'resetPassword', clerkUserId, password: pass }); showToast('Mot de passe changé ✔'); }
      catch (err) { showToast('Erreur: ' + err.message); }
    });
    const btnToggle = tr.querySelector('.btn-toggle');
    if (btnToggle) btnToggle.addEventListener('click', async () => {
      const emp = employeesCache.find(e => e.id === empId);
      try { await employeeAdminCall({ action: 'setAccess', clerkUserId, employeeItemId: empId, enabled: !emp.accessEnabled }); showToast('Mis à jour ✔'); loadComptes(); }
      catch (err) { showToast('Erreur: ' + err.message); }
    });
  });
}

async function employeeAdminCall(body) {
  const token = await Clerk.session.getToken();
  const res = await fetch('/api/employee-admin', {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('Erreur ' + res.status));
  return data;
}

// ===================== Messages (intégrés dans Vue par employé) =====================
// Les messages libres envoyés par les employés depuis le mobile sont maintenant affichés
// directement à la fin des poinçons du jour concerné, dans "Vue par employé" (voir
// renderMessagesSection). Ce cache est chargé une fois par cycle de loadPoinconsForWeek().
async function loadMessagesCache() {
  const data = await gql(`
    query($board: [ID!]) {
      boards(ids: $board) {
        items_page(limit: 300) {
          items { id created_at column_values(ids: ["${M_EMPLOYE}","${M_MESSAGE}","${M_DATE}","${M_STATUT}","${M_REPONSE}","${M_REPONSE_DATE}","${M_AUTEUR}","${M_LU_ADMIN}","${M_LU_EMPLOYE}"]) {
            id text ... on BoardRelationValue { linked_items { id name } }
          } }
        }
      }
    }
  `, { board: [String(MESSAGES_BOARD)] });

  messagesCache = ((data.boards[0] && data.boards[0].items_page.items) || []).map(it => {
    const cv = cvIndex(it);
    const emp = (cv[M_EMPLOYE].linked_items || [])[0] || { id: '', name: '?' };
    return {
      itemId: it.id, empId: emp.id, empName: emp.name,
      message: cv[M_MESSAGE].text || '', date: cv[M_DATE].text || '', statut: cv[M_STATUT].text || 'Nouveau',
      reponse: cv[M_REPONSE].text || '', reponseDate: cv[M_REPONSE_DATE].text || '',
      // Messages créés avant l'ajout de la colonne "Auteur" : traités comme envoyés par
      // l'employé (comportement historique), et considérés lus des deux côtés.
      auteur: cv[M_AUTEUR].text || 'Employé',
      luAdmin: cv[M_AUTEUR].text ? (cv[M_LU_ADMIN].text === 'v') : true,
      luEmploye: cv[M_AUTEUR].text ? (cv[M_LU_EMPLOYE].text === 'v') : true
    };
  }).sort((a, b) => b.date.localeCompare(a.date)); // tri par date décroissante (fait côté client — "order_by" n'est pas supporté sur ce champ)
}

// ===================== Tab: Tableau de bord =====================
function todayInMontreal() {
  const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Toronto', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
  const map = {}; parts.forEach(p => { map[p.type] = p.value; });
  return `${map.year}-${map.month}-${map.day}`;
}

let leafletLoaded = false;
let dashboardMap = null;
let dashboardMarkersByEmp = {};
async function ensureLeaflet() {
  if (leafletLoaded) return;
  if (!document.getElementById('leaflet-css')) {
    const link = document.createElement('link');
    link.id = 'leaflet-css'; link.rel = 'stylesheet';
    link.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css';
    document.head.appendChild(link);
  }
  await loadExternalScript({ src: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js' });
  leafletLoaded = true;
}
function parseGps(str) {
  if (!str) return null;
  const parts = String(str).split(',').map(Number);
  if (parts.length !== 2 || !isFinite(parts[0]) || !isFinite(parts[1])) return null;
  return { lat: parts[0], lng: parts[1] };
}

async function loadDashboard() {
  const el = document.getElementById('dashboard-content');
  el.innerHTML = '<div class="empty-state">Chargement…</div>';
  const today = todayInMontreal();
  document.getElementById('dash-label').textContent = new Date(today + 'T12:00:00').toLocaleDateString('fr-CA', { weekday: 'long', day: 'numeric', month: 'long' });

  if (!employeesCache.length) await loadComptes();

  let data;
  try {
    data = await gql(`
      query($poinBoard: ID!, $poinCol: String!, $poinVal: [String]!, $planBoard: ID!, $planCol: String!, $planVal: [String]!) {
        todayPunches: items_page_by_column_values(board_id: $poinBoard, columns: [{ column_id: $poinCol, column_values: $poinVal }], limit: 300) {
          items {
            id
            column_values(ids: ["${P_EMPLOYE}","${P_PROJET}","${P_HDEBUT}","${P_HFIN}","${P_GPS_DEBUT}","${P_GPS_FIN}"]) {
              id text
              ... on BoardRelationValue { linked_items { id name } }
              ... on HourValue { hour minute }
            }
          }
        }
        todayPlanning: items_page_by_column_values(board_id: $planBoard, columns: [{ column_id: $planCol, column_values: $planVal }], limit: 300) {
          items {
            id
            column_values(ids: ["${PL_PROJET}","${PL_MENUISIERS}"]) {
              id text
              ... on BoardRelationValue { linked_item_ids linked_items { id name } }
            }
          }
        }
      }
    `, { poinBoard: String(POINCONS_BOARD), poinCol: P_DATE, poinVal: [today], planBoard: String(PLANNING_BOARD), planCol: PL_DATE, planVal: [today] });
  } catch (err) { el.innerHTML = `<div class="empty-state">Erreur: ${err.message}</div>`; return; }

  const punchItems = ((data.todayPunches && data.todayPunches.items) || []).map(it => {
    const cv = cvIndex(it);
    const emp = (cv[P_EMPLOYE].linked_items || [])[0] || { id: '', name: '?' };
    const proj = (cv[P_PROJET].linked_items || [])[0] || { id: '', name: '?' };
    return {
      itemId: it.id, empId: emp.id, empName: emp.name, projName: proj.name,
      heureDebut: hourText(cv[P_HDEBUT]), heureFin: hourText(cv[P_HFIN]),
      gpsDebut: cv[P_GPS_DEBUT].text || '', gpsFin: cv[P_GPS_FIN].text || '',
      open: !cv[P_HFIN].text
    };
  });

  const empIdsWithOpenPunch = new Set(punchItems.filter(p => p.open).map(p => p.empId));
  const empIdsWithAnyPunch = new Set(punchItems.map(p => p.empId));

  const currentlyPunched = punchItems.filter(p => p.open).sort((a, b) => a.empName.localeCompare(b.empName));

  // "Terminé" = au moins un poinçon fermé aujourd'hui et AUCUN poinçon ouvert présentement.
  const finished = Array.from(empIdsWithAnyPunch).filter(id => !empIdsWithOpenPunch.has(id)).map(id => {
    const closedForEmp = punchItems.filter(p => p.empId === id && !p.open);
    const last = closedForEmp.slice().sort((a, b) => (b.heureFin || '').localeCompare(a.heureFin || ''))[0];
    return last ? { empId: id, empName: last.empName, projName: last.projName, heureFin: last.heureFin, gps: last.gpsFin } : null;
  }).filter(Boolean).sort((a, b) => a.empName.localeCompare(b.empName));

  // Employés planifiés aujourd'hui (tous chantiers) qui n'ont encore aucun poinçon.
  const plannedMap = new Map();
  ((data.todayPlanning && data.todayPlanning.items) || []).forEach(it => {
    const cv = cvIndex(it);
    const proj = (cv[PL_PROJET].linked_items || [])[0] || null;
    const menIds = (cv[PL_MENUISIERS].linked_item_ids || []);
    const menNames = cv[PL_MENUISIERS].linked_items || [];
    menIds.forEach((id, idx) => {
      const key = String(id);
      if (!plannedMap.has(key)) plannedMap.set(key, { empId: key, empName: (menNames[idx] && menNames[idx].name) || '?', projName: proj ? proj.name : '' });
    });
  });
  const plannedNotYetPunched = Array.from(plannedMap.values()).filter(p => !empIdsWithAnyPunch.has(p.empId)).sort((a, b) => a.empName.localeCompare(b.empName));

  const rowHtml = (name, sub) => `<div class="dash-emp-row"><span>${name}</span><span class="proj">${sub}</span></div>`;

  el.innerHTML = `<div class="dashboard-grid">
    <div class="dashboard-lists">
      <div class="card"><h4>🟢 Actuellement poinçonnés (${currentlyPunched.length})</h4>
        <div class="card-body">${currentlyPunched.length ? currentlyPunched.map(p => rowHtml(p.empName, `${p.projName} · depuis ${p.heureDebut}`)).join('') : '<div class="empty-state">Personne actuellement.</div>'}</div>
      </div>
      <div class="card"><h4>🟠 Planifiés aujourd'hui, pas encore poinçonnés (${plannedNotYetPunched.length})</h4>
        <div class="card-body">${plannedNotYetPunched.length ? plannedNotYetPunched.map(p => rowHtml(p.empName, p.projName)).join('') : '<div class="empty-state">Tout le monde a poinçonné.</div>'}</div>
      </div>
      <div class="card"><h4>⚪ Journée terminée (${finished.length})</h4>
        <div class="card-body">${finished.length ? finished.map(p => rowHtml(p.empName, `${p.projName} · fini à ${p.heureFin}`)).join('') : '<div class="empty-state">Personne n\'a encore terminé.</div>'}</div>
      </div>
    </div>
    <div class="card dashboard-map-card">
      <h4>Carte des poinçons du jour</h4>
      <input type="text" id="dash-map-search" list="dash-map-search-list" placeholder="🔎 Rechercher un employé…">
      <datalist id="dash-map-search-list"></datalist>
      <div id="dash-map-search-msg" style="font-size:11px;color:var(--text-secondary);min-height:14px;margin-bottom:4px;"></div>
      <div class="map-legend">
        <span><span class="dot" style="background:#00c875;"></span>Actuellement poinçonné</span>
        <span><span class="dot" style="background:#8b8f9c;"></span>Journée terminée</span>
      </div>
      <div id="dashboard-map"></div>
    </div>
  </div>`;

  // La carte (Leaflet, chargée depuis un CDN) est un "bonus" — si le script ne charge pas
  // (réseau bloqué, CDN inaccessible, etc.), ça ne doit JAMAIS empêcher le reste de
  // l'application (Vue de la semaine, Vue par employé, Vue par projet) de fonctionner.
  try {
    await ensureLeaflet();
    renderDashboardMap(currentlyPunched, finished);
  } catch (err) {
    const mapEl = document.getElementById('dashboard-map');
    if (mapEl) mapEl.outerHTML = '<div class="empty-state">Carte indisponible (problème réseau). Le reste du tableau de bord fonctionne normalement.</div>';
  }
}

function renderDashboardMap(currentlyPunched, finished) {
  const mapEl = document.getElementById('dashboard-map');
  if (!mapEl || typeof L === 'undefined') return;
  dashboardMap = L.map('dashboard-map');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap', maxZoom: 19
  }).addTo(dashboardMap);

  // Conserve un marqueur par employé pour permettre à la recherche de centrer/zoomer dessus.
  dashboardMarkersByEmp = {};
  const bounds = [];
  currentlyPunched.forEach(p => {
    const gps = parseGps(p.gpsDebut);
    if (!gps) return;
    const marker = L.circleMarker([gps.lat, gps.lng], { radius: 8, color: '#0a8a52', fillColor: '#00c875', fillOpacity: 0.9, weight: 2 })
      .addTo(dashboardMap).bindPopup(`<strong>${p.empName}</strong><br>${p.projName}<br>Depuis ${p.heureDebut}`);
    dashboardMarkersByEmp[p.empId] = { marker, name: p.empName, latlng: [gps.lat, gps.lng] };
    bounds.push([gps.lat, gps.lng]);
  });
  finished.forEach(p => {
    const gps = parseGps(p.gps);
    if (!gps) return;
    const marker = L.circleMarker([gps.lat, gps.lng], { radius: 7, color: '#5a5f6d', fillColor: '#8b8f9c', fillOpacity: 0.85, weight: 2 })
      .addTo(dashboardMap).bindPopup(`<strong>${p.empName}</strong><br>${p.projName}<br>Terminé à ${p.heureFin}`);
    dashboardMarkersByEmp[p.empId] = { marker, name: p.empName, latlng: [gps.lat, gps.lng] };
    bounds.push([gps.lat, gps.lng]);
  });

  if (bounds.length) dashboardMap.fitBounds(bounds, { padding: [30, 30] });
  else dashboardMap.setView([45.5019, -73.5674], 10); // Vue par défaut (Montréal) si aucune position GPS

  // --- Recherche d'employé sur la carte ---
  const searchList = document.getElementById('dash-map-search-list');
  if (searchList) {
    searchList.innerHTML = Object.values(dashboardMarkersByEmp).map(m => `<option value="${m.name}"></option>`).join('');
  }
  const searchInput = document.getElementById('dash-map-search');
  const searchMsg = document.getElementById('dash-map-search-msg');
  if (searchInput) {
    const doSearch = () => {
      const term = searchInput.value.trim().toLowerCase();
      if (!term) { searchMsg.textContent = ''; return; }
      const match = Object.values(dashboardMarkersByEmp).find(m => m.name.toLowerCase().includes(term));
      if (match) {
        dashboardMap.setView(match.latlng, 15);
        match.marker.openPopup();
        searchMsg.textContent = '';
      } else {
        searchMsg.textContent = 'Aucun poinçon aujourd\'hui pour cet employé.';
      }
    };
    searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
    searchInput.addEventListener('change', doSearch);
  }
}

// ===================== Export .txt =====================
// L'export est bloqué tant qu'il reste des poinçons "en attente" pour la semaine affichée —
// évite d'exporter une paie incomplète/non approuvée par erreur.
function pendingCountForWeek() {
  return poinconsCache.filter(p => !p.statut || p.statut === 'En attente').length;
}
function renderExportPendingNote() {
  const el = document.getElementById('export-pending-note');
  if (!el) return;
  const btn = document.getElementById('btn-export-txt');
  const n = pendingCountForWeek();
  if (n > 0) {
    el.innerHTML = `<p style="color:var(--danger);font-size:13px;font-weight:600;">⚠ Il reste ${n} poinçon${n > 1 ? 's' : ''} en attente d'approbation cette semaine — l'export est bloqué tant qu'ils ne sont pas tous approuvés ou rejetés.</p>`;
    if (btn) { btn.disabled = true; btn.style.opacity = '0.5'; btn.style.cursor = 'not-allowed'; }
  } else {
    el.innerHTML = '';
    if (btn) { btn.disabled = false; btn.style.opacity = ''; btn.style.cursor = ''; }
  }
}
function exportTxt() {
  if (pendingCountForWeek() > 0) { showToast('Impossible d\'exporter : des poinçons sont encore en attente cette semaine.'); return; }
  const approved = poinconsCache.filter(p => p.statut === 'Approuvé');
  if (!approved.length) { showToast('Aucun poinçon approuvé cette semaine.'); return; }
  const lines = ['EmployeID;EmployeNom;Date;ProjetID;ProjetNom;HeuresAjustees;KM'];
  approved.forEach(p => {
    lines.push([p.empId, p.empName, p.date, p.projId, p.projName, p.totalAjuste, p.kmAjuste || p.kmSuggere].join(';'));
  });
  const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `poincons_${currentWeek}.txt`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

// ===================== Navigation =====================
document.querySelectorAll('nav.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'comptes' && !employeesCache.length) loadComptes();
    if (btn.dataset.tab === 'dashboard') loadDashboard();
  });
});
document.getElementById('dash-refresh').addEventListener('click', loadDashboard);
function goPrevWeek() { const d = new Date(currentWeek + 'T12:00:00'); d.setDate(d.getDate() - 7); currentWeek = mondayOfWeek(d); loadPoinconsForWeek(); }
function goNextWeek() { const d = new Date(currentWeek + 'T12:00:00'); d.setDate(d.getDate() + 7); currentWeek = mondayOfWeek(d); loadPoinconsForWeek(); }
document.getElementById('wk-prev').addEventListener('click', goPrevWeek);
document.getElementById('wk-next').addEventListener('click', goNextWeek);
document.getElementById('wk-refresh').addEventListener('click', loadPoinconsForWeek);
document.getElementById('wk-prev2').addEventListener('click', goPrevWeek);
document.getElementById('wk-next2').addEventListener('click', goNextWeek);
document.getElementById('wk-refresh2').addEventListener('click', loadPoinconsForWeek);
document.getElementById('wk-prev3').addEventListener('click', goPrevWeek);
document.getElementById('wk-next3').addEventListener('click', goNextWeek);
document.getElementById('wk-refresh3').addEventListener('click', loadPoinconsForWeek);
document.getElementById('btn-export-txt').addEventListener('click', exportTxt);
document.getElementById('btn-signout').addEventListener('click', () => Clerk.signOut());
document.getElementById('comptes-search').addEventListener('input', () => { if (employeesCache.length) renderComptes(); });

// ===================== Auth / démarrage =====================
let appStarted = false;
async function initApp() {
  const meta = Clerk.user.publicMetadata || {};
  if (meta.role === 'employee' || meta.role === 'employee_disabled') {
    document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;">⚠ Accès réservé aux administrateurs.</div>';
    return;
  }
  appStarted = true;
  document.getElementById('clerk-signin').classList.add('hidden');
  document.getElementById('app').style.display = 'block';
  // Le Tableau de bord ne doit JAMAIS empêcher le reste de l'app de charger — s'il échoue pour
  // une raison quelconque (réseau, CDN, etc.), on l'affiche en erreur mais on continue.
  try {
    await loadDashboard();
  } catch (err) {
    const el = document.getElementById('dashboard-content');
    if (el) el.innerHTML = `<div class="empty-state">Erreur de chargement du tableau de bord: ${err.message}</div>`;
  }
  await loadPoinconsForWeek();
}

async function boot() {
  const clerkDomain = atob(CLERK_PUBLISHABLE_KEY.split('_')[2]).slice(0, -1);
  await loadExternalScript({ src: `https://${clerkDomain}/npm/@clerk/ui@1/dist/ui.browser.js` });
  await loadExternalScript({ src: `https://${clerkDomain}/npm/@clerk/clerk-js@6/dist/clerk.browser.js`, 'data-clerk-publishable-key': CLERK_PUBLISHABLE_KEY });
  await window.Clerk.load({ ui: { ClerkUI: window.__internal_ClerkUICtor } });
  // IMPORTANT : Clerk redéclenche périodiquement ce callback (rafraîchissement de session en
  // arrière-plan), même sans changement réel d'utilisateur. Sans le garde-fou `appStarted`,
  // ça relançait loadPoinconsForWeek() en boucle (~toutes les 30s) et vidait la page en plein
  // travail. On n'initialise donc qu'une seule fois, à la vraie connexion.
  window.Clerk.addListener(({ user }) => { if (user && !appStarted) initApp(); });
  if (window.Clerk.user) { initApp(); }
  else { window.Clerk.mountSignIn(document.getElementById('clerk-signin'), { appearance: { elements: { rootBox: { width: '100%' } } } }); }
}
boot();
</script>
