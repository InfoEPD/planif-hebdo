// ----- Géorepérage GPS (rayon de tolérance par projet) — Vue par employé / Vue par projet -----
// Réutilise directement le "GPS début"/"GPS fin" déjà stocké sur chaque poinçon (texte
// "lat,lng") — aucune nouvelle colonne Monday nécessaire côté poinçon : on compare simplement
// ces coordonnées à l'adresse + rayon toléré du PROJET DE CE POINÇON (voir Configuration >
// Restriction de projets), pour chacun des deux relevés séparément.
function haversineMetersClient(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const toRad = d => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function parseGpsText(text) {
  if (!text) return null;
  const parts = text.split(',').map(s => parseFloat(s.trim()));
  if (parts.length !== 2 || !isFinite(parts[0]) || !isFinite(parts[1])) return null;
  return { lat: parts[0], lng: parts[1] };
}
// Récupère (et met en cache) l'adresse géolocalisée + le rayon toléré pour les projets demandés.
async function loadProjectGeoFences(projectIds) {
  const ids = Array.from(new Set((projectIds || []).filter(Boolean).map(String)))
    .filter(id => !(id in projectGeoCache));
  if (!ids.length) return;
  const data = await gql(`
    query($ids: [ID!]) {
      items(ids: $ids) {
        id
        column_values(ids: ["${PROJECT_ADDR_COL}", "${PROJECT_RAYON_COL}"]) { id text value }
      }
    }
  `, { ids });
  (data.items || []).forEach(it => {
    const cv = cvIndex(it);
    const addrCv = cv[PROJECT_ADDR_COL];
    let geo = null;
    if (addrCv && addrCv.value) {
      try {
        const v = JSON.parse(addrCv.value);
        const lat = parseFloat(v.lat), lng = parseFloat(v.lng);
        if (isFinite(lat) && isFinite(lng)) {
          const rayonNum = parseFloat((cv[PROJECT_RAYON_COL] && cv[PROJECT_RAYON_COL].text) || '');
          geo = { lat, lng, radius: isFinite(rayonNum) && rayonNum > 0 ? rayonNum : DEFAULT_RAYON_M };
        }
      } catch (e) { /* adresse non géolocalisée */ }
    }
    projectGeoCache[String(it.id)] = geo; // null = pas de validation possible pour ce projet
  });
}
// Retourne { debut: {ok,distance}|null, fin: {ok,distance}|null } pour un poinçon — null quand
// aucune validation n'est possible (projet sans adresse géolocalisée, ou relevé GPS absent).
function geoStatusForPunch(p) {
  const geo = projectGeoCache[String(p.projId)];
  if (!geo) return { debut: null, fin: null };
  const evalPos = (gpsText) => {
    const pos = parseGpsText(gpsText);
    if (!pos) return null;
    const distance = Math.round(haversineMetersClient(geo.lat, geo.lng, pos.lat, pos.lng));
    return { ok: distance <= geo.radius, distance };
  };
  return { debut: evalPos(p.gpsDebut), fin: evalPos(p.gpsFin) };
}
// Petit indicateur coloré : cercle vert plein = dans la zone ; point rouge clignotant = hors
// zone. Rien n'est affiché si aucune validation n'est possible (voir geoStatusForPunch()).
function geoDotHtml(status) {
  if (!status) return '';
  const title = status.ok ? `Dans la zone du chantier (≈${status.distance} m de l'adresse)` : `Hors zone du chantier (≈${status.distance} m de l'adresse)`;
  const cls = status.ok ? 'geo-dot geo-dot-ok' : 'geo-dot geo-dot-bad';
  return `<span class="${cls}" title="${title}"></span>`;
}

// ----- Colonne "KM" : repli sur la distance routière calculée en planification -----
// Charge une seule fois (ce cache ne dépend pas de la semaine affichée) la matrice de distances
// routières employé → chantier calculée par index.html lors de la planification (voir
// loadRoadDistances() dans index.html) — sert de repli pour la colonne "KM" d'un poinçon quand
// celui-ci n'a pas de km suggéré/ajusté propre.
async function loadRoadDistancesCache() {
  try {
    const data = await gql(`
      query($board: [ID!]) {
        boards(ids: $board) {
          items_page(limit: 100) {
            items { id column_values(ids: ["${DIST_EMP_COL}","${DIST_JSON_COL}"]) { id text } }
          }
        }
      }
    `, { board: [String(DISTANCES_BOARD)] });
    const items = ((data.boards[0] && data.boards[0].items_page.items) || []);
    items.forEach(it => {
      const cv = cvIndex(it);
      const empId = cv[DIST_EMP_COL] && cv[DIST_EMP_COL].text;
      if (!empId) return;
      try {
        distancesCache[empId] = JSON.parse((cv[DIST_JSON_COL] && cv[DIST_JSON_COL].text) || '{}');
      } catch (e) { /* JSON invalide, ignorer */ }
    });
  } catch (e) { /* cache indisponible — la colonne KM retombera simplement sur kmSuggere/kmAjuste */ }
  distancesCacheLoaded = true;
}
// Valeur affichée dans la colonne "KM" : km suggéré/ajusté du poinçon en priorité, sinon la
// distance routière domicile-employé → chantier déjà calculée en planification (repli, jamais
// enregistrée sur le poinçon tant que l'admin ne modifie pas le champ lui-même).
function kmForPunch(p) {
  if (p.kmSuggere) return p.kmSuggere;
  if (p.kmAjuste) return p.kmAjuste;
  const empDist = distancesCache[String(p.empId)];
  const fallback = empDist && empDist[String(p.projId)];
  return (fallback !== undefined && fallback !== null) ? fallback : '';
}

// ----- "KM entre chantiers" (Vue de la semaine) — saisie manuelle, propre à CHAQUE semaine -----
// Contrairement à distancesCache (repli KM, ne dépend pas de la semaine), ce cache DOIT être
// rechargé à chaque changement de semaine (voir loadPoinconsForWeekInner()).
async function loadInterKmCache(weekKey) {
  interKmCache = {};
  try {
    const data = await gql(`
      query($board: ID!, $col: String!, $val: [String]!) {
        items_page_by_column_values(board_id: $board, columns: [{ column_id: $col, column_values: $val }], limit: 200) {
          items { id column_values(ids: ["${INTER_KM_EMP_COL}","${INTER_KM_VAL_COL}"]) { id text } }
        }
      }
    `, { board: String(INTER_KM_BOARD), col: INTER_KM_SEMAINE_COL, val: [weekKey] });
    ((data.items_page_by_column_values && data.items_page_by_column_values.items) || []).forEach(it => {
      const cv = cvIndex(it);
      const empId = cv[INTER_KM_EMP_COL] && cv[INTER_KM_EMP_COL].text;
      if (!empId) return;
      interKmCache[empId] = { itemId: it.id, km: (cv[INTER_KM_VAL_COL] && cv[INTER_KM_VAL_COL].text) || '' };
    });
  } catch (e) { /* cache indisponible — la colonne reste vide et modifiable normalement */ }
}
// Crée ou met à jour l'item "KM entre chantiers" de cet employé pour la semaine affichée.
async function saveInterKm(empId, rawVal, inputEl) {
  const val = rawVal.trim() === '' ? null : Number(rawVal);
  if (rawVal.trim() !== '' && !isFinite(val)) { showToast('Valeur invalide.'); return; }
  try {
    const existing = interKmCache[empId];
    if (existing && existing.itemId) {
      await gql(`mutation($board: ID!, $item: ID!, $cv: JSON!) { change_multiple_column_values(board_id: $board, item_id: $item, column_values: $cv) { id } }`,
        { board: String(INTER_KM_BOARD), item: String(existing.itemId), cv: JSON.stringify({ [INTER_KM_VAL_COL]: val }) });
      interKmCache[empId] = { itemId: existing.itemId, km: val === null ? '' : val };
    } else {
      const emp = employeesCache.find(e => e.id === empId);
      const created = await gql(`mutation($board: ID!, $name: String!, $cv: JSON!) { create_item(board_id: $board, item_name: $name, column_values: $cv) { id } }`,
        { board: String(INTER_KM_BOARD), name: `${(emp && emp.name) || empId} - ${currentWeek}`, cv: JSON.stringify({ [INTER_KM_EMP_COL]: empId, [INTER_KM_SEMAINE_COL]: currentWeek, [INTER_KM_VAL_COL]: val }) });
      interKmCache[empId] = { itemId: created.create_item.id, km: val === null ? '' : val };
    }
    showToast('Enregistré ✔');
  } catch (err) {
    showToast('Erreur d\'enregistrement: ' + err.message);
    if (inputEl) inputEl.value = (interKmCache[empId] && interKmCache[empId].km) || '';
  }
}

async function loadPoinconsForWeekInner() {
  const data = await gql(`
    query($board: ID!, $col: String!, $val: [String]!) {
      items_page_by_column_values(board_id: $board, columns: [{ column_id: $col, column_values: $val }], limit: 300) {
        items {
          id name
          column_values(ids: ["${P_EMPLOYE}","${P_PROJET}","${P_DATE}","${P_HDEBUT}","${P_HFIN}","${P_GPS_DEBUT}","${P_GPS_FIN}","${P_MATIN_NP}","${P_RAISON_MATIN}","${P_DINER_NP}","${P_RAISON_DINER}","${P_PM_PRISE}","${P_TOTAL_BRUT}","${P_TOTAL_AJUSTE}","${P_KM_SUGGERE}","${P_KM_AJUSTE}","${P_STATUT}","${P_ARRET_AUTO}","${P_TACHE}"]) {
            id text
            ... on BoardRelationValue { linked_items { id name } }
            ... on HourValue { hour minute }
          }
        }
      }
    }
  `, { board: String(POINCONS_BOARD), col: P_SEMAINE, val: [currentWeek] });

  poinconsCache = (data.items_page_by_column_values.items || []).map(it => {
    const cv = cvIndex(it);
    const emp = (cv[P_EMPLOYE].linked_items || [])[0] || { id: '', name: '?' };
    const proj = (cv[P_PROJET].linked_items || [])[0] || { id: '', name: '?' };
    return {
      itemId: it.id,
      empId: emp.id, empName: emp.name,
      projId: proj.id, projName: proj.name,
      date: cv[P_DATE].text || '',
      heureDebut: hourText(cv[P_HDEBUT]), heureFin: hourText(cv[P_HFIN]),
      gpsDebut: cv[P_GPS_DEBUT].text || '', gpsFin: cv[P_GPS_FIN].text || '',
      matinNP: cv[P_MATIN_NP].text === 'v', raisonMatin: cv[P_RAISON_MATIN].text || '',
      dinerNP: cv[P_DINER_NP].text === 'v', raisonDiner: cv[P_RAISON_DINER].text || '',
      pmPrise: cv[P_PM_PRISE].text === 'v',
      totalBrut: cv[P_TOTAL_BRUT].text || '', totalAjuste: cv[P_TOTAL_AJUSTE].text || '',
      kmSuggere: cv[P_KM_SUGGERE].text || '', kmAjuste: cv[P_KM_AJUSTE].text || '',
      statut: cv[P_STATUT].text || 'En attente',
      arretAuto: cv[P_ARRET_AUTO].text === 'v',
      tache: cv[P_TACHE].text || ''
    };
  }).sort((a, b) => a.empName.localeCompare(b.empName) || a.date.localeCompare(b.date));

  if (!employeesCache.length) await loadComptes();
  if (!activeProjectsCache.length) await loadActiveProjects();
  if (!tachesCache.length) await loadMetiersTaches();
  if (!distancesCacheLoaded) await loadRoadDistancesCache();
  await loadMessagesCache();
  await loadProjectGeoFences(poinconsCache.map(p => p.projId));
  await loadInterKmCache(currentWeek); // propre à currentWeek — toujours rechargé (voir loadInterKmCache)

  renderVueSemaine();
  renderParEmploye();
  renderParProjet();
  populateExportWeekSelect();
}

// ===================== Tab: Vue de la semaine =====================
// Un poinçon compte comme "hors CCQ" selon la TÂCHE réellement poinçonnée (chaque tâche porte
// son propre statut CCQ/hors CCQ — voir Configuration, Métiers & Tâches), PAS selon le flag
// "Hors CCQ seulement" du projet (qui ne fait que RESTREINDRE quelles tâches sont sélectionnables
// sur ce projet — un poinçon sur un projet "normal" peut très bien utiliser une tâche hors CCQ).
// Si la tâche n'est plus retrouvée (renommée/supprimée depuis), on retombe sur le flag du projet
// à défaut de mieux.
function isPunchHorsCcq(p) {
  const tache = tachesCache.find(t => t.name === p.tache);
  if (tache) return !tache.ccq;
  return isProjectHorsCcq(p.projId);
}

function renderVueSemaine() {
  const el = document.getElementById('semaine-content');
  const totals = {};
  // Regroupe les KM (voir kmForPunch — kmSuggere/kmAjuste ou repli distancesCache) PAR
  // EMPLOYÉ PUIS PAR JOUR, pour les 3 colonnes "🚗 tranche de km" ci-dessous : un jour compte
  // dans une tranche dès qu'AU MOINS UN poinçon de ce jour-là s'y trouve (voir countDaysInRange).
  const kmByEmpDate = {};
  poinconsCache.forEach(p => {
    if (!p.empId) return;
    totals[p.empId] = totals[p.empId] || { name: p.empName, totalCcq: 0, totalHorsCcq: 0, pending: 0 };
    // Les poinçons rejetés ne comptent pas dans le total d'heures de la semaine (ni dans les
    // tranches de km, par cohérence).
    if (p.statut !== 'Rejeté') {
      const h = Number(p.totalAjuste) || 0;
      if (isPunchHorsCcq(p)) totals[p.empId].totalHorsCcq += h;
      else totals[p.empId].totalCcq += h;
      const km = Number(kmForPunch(p));
      if (isFinite(km) && km > 0) {
        kmByEmpDate[p.empId] = kmByEmpDate[p.empId] || {};
        (kmByEmpDate[p.empId][p.date] = kmByEmpDate[p.empId][p.date] || []).push(km);
      }
    }
    if (!p.statut || p.statut === 'En attente') totals[p.empId].pending += 1;
  });
  // Nombre de jours (dans la semaine affichée) où au moins un poinçon de cet employé tombe
  // dans la tranche [min, max] (max=null = pas de plafond, pour "120km+").
  const countDaysInRange = (empId, min, max) => {
    const byDate = kmByEmpDate[empId] || {};
    return Object.values(byDate).filter(kms => kms.some(km => km >= min && (max === null || km <= max))).length;
  };
  const rows = Object.keys(totals).map(empId => {
    const emp = employeesCache.find(e => e.id === empId);
    const t = totals[empId];
    const interKmEntry = interKmCache[empId];
    return {
      empId, name: t.name, codeAvantage: (emp && emp.codeAvantage) || '',
      totalCcq: t.totalCcq, totalHorsCcq: t.totalHorsCcq, total: t.totalCcq + t.totalHorsCcq, pending: t.pending,
      days65: countDaysInRange(empId, 65, 89),
      days90: countDaysInRange(empId, 90, 119),
      days120: countDaysInRange(empId, 120, null),
      interKm: (interKmEntry && interKmEntry.km !== undefined && interKmEntry.km !== null) ? interKmEntry.km : ''
    };
  }).sort((a, b) => (a.codeAvantage || '').localeCompare(b.codeAvantage || '', undefined, { numeric: true }));

  if (!rows.length) { el.innerHTML = '<div class="empty-state">Aucun poinçon cette semaine.</div>'; return; }

  let grandCcq = 0, grandHorsCcq = 0, grandPending = 0, grandDays65 = 0, grandDays90 = 0, grandDays120 = 0, grandInterKm = 0;
  let html = `<table><thead><tr><th>Employé</th><th>Heures CCQ ajusté</th><th>Heures hors CCQ ajusté</th><th>Total</th><th>🚗 65-89km</th><th>🚗 90-119km</th><th>🚗 120km+</th><th>KM entre chantiers</th><th>Poinçons en attente</th></tr></thead><tbody>`;
  rows.forEach(r => {
    grandCcq += r.totalCcq;
    grandHorsCcq += r.totalHorsCcq;
    grandPending += r.pending;
    grandDays65 += r.days65;
    grandDays90 += r.days90;
    grandDays120 += r.days120;
    grandInterKm += Number(r.interKm) || 0;
    const pendingCell = r.pending
      ? `<span class="badge badge-attente">${r.pending}</span>`
      : `<span style="color:var(--green);font-weight:700;" title="Aucun poinçon en attente">✔</span>`;
    html += `<tr>
      <td>${r.name}<br><span style="font-size:11px;color:var(--text-secondary);">${r.codeAvantage || '—'}</span></td>
      <td>${r.totalCcq ? r.totalCcq.toFixed(2) + ' h' : '—'}</td>
      <td>${r.totalHorsCcq ? r.totalHorsCcq.toFixed(2) + ' h' : '—'}</td>
      <td><strong>${r.total.toFixed(2)} h</strong></td>
      <td>${r.days65 || '—'}</td>
      <td>${r.days90 || '—'}</td>
      <td>${r.days120 || '—'}</td>
      <td><input type="number" step="0.1" class="inp-inter-km" data-emp="${r.empId}" value="${r.interKm}" placeholder="—"></td>
      <td>${pendingCell}</td>
    </tr>`;
  });
  html += `</tbody><tfoot><tr>
    <td>Total</td>
    <td><strong>${grandCcq.toFixed(2)} h</strong></td>
    <td><strong>${grandHorsCcq.toFixed(2)} h</strong></td>
    <td><strong>${(grandCcq + grandHorsCcq).toFixed(2)} h</strong></td>
    <td><strong>${grandDays65 || '—'}</strong></td>
    <td><strong>${grandDays90 || '—'}</strong></td>
    <td><strong>${grandDays120 || '—'}</strong></td>
    <td><strong>${grandInterKm ? grandInterKm.toFixed(1) + ' km' : '—'}</strong></td>
    <td><strong>${grandPending || '—'}</strong></td>
  </tr></tfoot></table>`;
  el.innerHTML = html;

  el.querySelectorAll('.inp-inter-km').forEach(inp => {
    inp.addEventListener('change', () => saveInterKm(inp.getAttribute('data-emp'), inp.value, inp));
  });
}

// Construit les <option> du menu déroulant Tâche, regroupées par Métier. L'admin peut choisir
// n'importe quelle Tâche existante (pas seulement celles du métier actuel de l'employé) pour
// pouvoir corriger un poinçon passé. Si la valeur historique ne correspond plus à aucune Tâche
// active (renommée/supprimée depuis), elle est quand même affichée pour ne pas la perdre.
function tacheOptionsHtml(selected) {
  const groups = {};
  tachesCache.forEach(t => { (groups[t.metierName || '(sans métier)'] = groups[t.metierName || '(sans métier)'] || []).push(t); });
  let html = `<option value="">—</option>`;
  Object.keys(groups).sort((a, b) => a.localeCompare(b)).forEach(metName => {
    html += `<optgroup label="${metName.replace(/"/g, '&quot;')}">`;
    groups[metName].forEach(t => {
      const val = t.name.replace(/"/g, '&quot;');
      html += `<option value="${val}" ${t.name === selected ? 'selected' : ''}>${t.name} (${t.ccq ? 'CCQ' : 'hors CCQ'})</option>`;
    });
    html += `</optgroup>`;
  });
  if (selected && !tachesCache.some(t => t.name === selected)) {
    html += `<option value="${selected.replace(/"/g, '&quot;')}" selected>${selected} (ancienne valeur)</option>`;
  }
  return html;
}

// ----- Tâche, UNIQUEMENT pour le formulaire d'AJOUT MANUEL (contrairement à
// tacheOptionsHtml() ci-dessus, qui liste TOUTES les tâches pour permettre de corriger un
// ancien poinçon) : ici on restreint aux tâches réellement autorisées pour l'employé
// sélectionné (selon son Titre d'emploi/Métier), et si le projet choisi est marqué "Hors
// CCQ seulement", on retire en plus les tâches CCQ. -----
function isProjectHorsCcq(projId) {
  const p = activeProjectsCache.find(x => x.id === projId) || allProjectsCache.find(x => x.id === projId);
  return !!(p && p.horsCcq);
}
function manualAllowedTaches(empId, projId) {
  const emp = employeesCache.find(e => e.id === empId);
  if (!emp) return [];
  let list = tachesForTitre(emp.titre);
  if (isProjectHorsCcq(projId)) list = list.filter(t => !t.ccq);
  return list;
}
function manualTacheOptionsHtml(list) {
  if (!list.length) return `<option value="">— aucune tâche autorisée —</option>`;
  // Aucun attribut "selected" : le navigateur sélectionne la première option par défaut,
  // ce qui correspond exactement à "mettre la première tâche attribuée à l'employé" demandé.
  return list.map(t => `<option value="${t.name.replace(/"/g, '&quot;')}">${t.name} (${t.ccq ? 'CCQ' : 'hors CCQ'})</option>`).join('');
}
// Options de Tâche pour une ligne de poinçon EXISTANTE (Vue par employé/projet, détail des
// poinçons) : mêmes restrictions que le formulaire d'ajout manuel (tâches autorisées pour le
// métier de l'employé de cette ligne + retrait des tâches CCQ si le projet de cette ligne est
// "Hors CCQ seulement"), mais en préservant toujours la valeur historique même si elle ne fait
// plus partie des tâches autorisées (employé changé de métier depuis, tâche renommée/supprimée)
// — on ne perd jamais ce qui a réellement été poinçonné.
function rowTacheOptionsHtml(empId, projId, selected) {
  const emp = employeesCache.find(e => e.id === empId);
  let list = emp ? tachesForTitre(emp.titre) : [];
  if (isProjectHorsCcq(projId)) list = list.filter(t => !t.ccq);
  let html = `<option value="">—</option>`;
  list.forEach(t => {
    const val = t.name.replace(/"/g, '&quot;');
    html += `<option value="${val}" ${t.name === selected ? 'selected' : ''}>${t.name} (${t.ccq ? 'CCQ' : 'hors CCQ'})</option>`;
  });
  if (selected && !list.some(t => t.name === selected)) {
    html += `<option value="${selected.replace(/"/g, '&quot;')}" selected>${selected} (ancienne valeur)</option>`;
  }
  return html;
}
// Recalcule et remplace les options du <select class="manual-tache"> selon l'employé et le
// projet actuellement sélectionnés dans le formulaire (fonctionne autant pour les champs fixes
// — <input type="hidden">, valeur immuable — que pour les <select> déroulants).
function updateManualTacheSelect(el) {
  const empEl = el.querySelector('.manual-emp');
  const projEl = el.querySelector('.manual-proj');
  const tacheEl = el.querySelector('.manual-tache');
  if (!empEl || !projEl || !tacheEl) return;
  const list = manualAllowedTaches(empEl.value, projEl.value);
  tacheEl.innerHTML = manualTacheOptionsHtml(list);
}

// Formate l'étiquette complète (jour + date) affichée sur la ligne de séparation de journée
// dans "Détail des poinçons".
function fmtDaySepLabel(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString('fr-CA', { weekday: 'long', day: 'numeric', month: 'long' });
}

// Calcule uniquement le temps BRUT (Début → Fin) d'une ligne de poinçon — indépendant des
// pauses, qui sont désormais gérées au niveau de la JOURNÉE (voir computeDayPayable) plutôt
// que par poinçon individuel.
function computeRowBrut(tr) {
  const [dh, dm] = (tr.querySelector('.inp-debut').value || '00:00').split(':').map(Number);
  const [fh, fm] = (tr.querySelector('.inp-fin').value || '00:00').split(':').map(Number);
  let elapsed = (fh * 60 + fm) - (dh * 60 + dm);
  if (elapsed < 0) elapsed += 1440;
  const brutH = Math.round((round15(elapsed) / 60) * 100) / 100;
  return { dh, dm, fh, fm, elapsed, brutH };
}

// Calcule le total PAYABLE de toute une JOURNÉE (un ou plusieurs poinçons/segments, ex. en cas
// de changement de chantier) à partir des 3 cases de pause de la ligne de séparation et de
// l'heure de FIN la plus tardive parmi tous les segments de la journée (peu importe l'ordre
// chronologique de fermeture) — même convention que le serveur (voir api/punch.js, action
// 'finish' / getDayPauseHandled). L'ajustement complet de la journée est imputé au segment qui
// a travaillé le PLUS D'HEURES ce jour-là (pas nécessairement le dernier fermé) ; tous les
// autres segments sont payés = leur propre brut (comme un "switch"), de façon à ce que la somme
// des segments égale exactement le total payable de la journée.
function computeDayPayable(rowTrs, daySepTr) {
  const matinPrise = daySepTr.querySelector('.day-chk-matin').checked;
  const dinerPris = daySepTr.querySelector('.day-chk-diner').checked;
  const pmPrise = daySepTr.querySelector('.day-chk-pm').checked;

  const brutData = rowTrs.map(tr => computeRowBrut(tr));
  const finishMinutes = brutData.reduce((max, b) => Math.max(max, b.fh * 60 + b.fm), 0);
  const lunchApplicable = finishMinutes >= 13 * 60;
  const afternoonApplicable = finishMinutes >= 14 * 60;
  const morningSkipped = !matinPrise;
  const lunchSkipped = lunchApplicable && !dinerPris;
  const afternoonSkipped = afternoonApplicable && !pmPrise;

  const sumElapsed = brutData.reduce((s, b) => s + b.elapsed, 0);
  // Dîner : pris = 30 min déduites ; NON pris = neutre (0), jamais une addition positive —
  // même règle que partout ailleurs dans l'app.
  const lunchAdjust = lunchApplicable ? (lunchSkipped ? 0 : -30) : 0;
  const payableRaw = sumElapsed
    + lunchAdjust
    + (morningSkipped ? 15 : 0)
    + (afternoonSkipped ? 15 : 0);
  const dayPayableMin = Math.max(0, round15(payableRaw));

  // Le segment qui a travaillé le plus d'heures absorbe l'ajustement — à égalité, on garde le
  // dernier segment chronologique (comportement historique).
  let biggestIndex = 0;
  brutData.forEach((b, i) => { if (round15(b.elapsed) >= round15(brutData[biggestIndex].elapsed)) biggestIndex = i; });
  const otherSum = brutData.reduce((s, b, i) => i === biggestIndex ? s : s + round15(b.elapsed), 0);
  const biggestAjusteMin = Math.max(0, dayPayableMin - otherSum);
  const ajusteMinList = brutData.map((b, i) => i === biggestIndex ? biggestAjusteMin : round15(b.elapsed));

  return { matinPrise, dinerPris, pmPrise, lunchApplicable, afternoonApplicable, morningSkipped, lunchSkipped, afternoonSkipped, dayPayableMin, brutData, ajusteMinList, biggestIndex };
}

// Rafraîchit l'affichage Brut/Ajusté (lecture seule) de TOUS les poinçons d'une journée, le
// total ajusté de la journée affiché sur la ligne de séparation, ainsi que la disponibilité des
// cases Dîner/PM — dès que Début/Fin d'un poinçon ou une case de pause de la journée change,
// avant même d'enregistrer.
function updateDayDisplay(el, dateKey) {
  const daySepTr = el.querySelector(`tr.day-sep[data-daysep="${CSS.escape(dateKey)}"]`);
  const rowTrs = Array.from(el.querySelectorAll(`tr[data-item][data-date="${CSS.escape(dateKey)}"]`));
  if (!daySepTr || !rowTrs.length) return;
  const d = computeDayPayable(rowTrs, daySepTr);
  rowTrs.forEach((tr, i) => {
    tr.querySelector('.brut-display').textContent = d.brutData[i].brutH.toFixed(2);
    const ajH = Math.round((d.ajusteMinList[i] / 60) * 100) / 100;
    tr.querySelector('.ajuste-display').innerHTML = `<strong>${ajH.toFixed(2)}</strong>`;
  });
  const chkDiner = daySepTr.querySelector('.day-chk-diner');
  const chkPm = daySepTr.querySelector('.day-chk-pm');
  chkDiner.disabled = !d.lunchApplicable;
  chkPm.disabled = !d.afternoonApplicable;
  const totalEl = daySepTr.querySelector('.day-total-display');
  if (totalEl) totalEl.textContent = (Math.round((d.dayPayableMin / 60) * 100) / 100).toFixed(2) + ' h';
}

function wireRowRecalc(el) {
  el.querySelectorAll('table tbody tr[data-item]').forEach(tr => {
    if (!tr.querySelector('.inp-debut')) return; // ligne d'une autre table (ex. rejetés)
    const dateKey = tr.getAttribute('data-date');
    ['.inp-debut', '.inp-fin'].forEach(sel => {
      const input = tr.querySelector(sel);
      if (input) input.addEventListener('input', () => updateDayDisplay(el, dateKey));
    });
  });
  el.querySelectorAll('tr.day-sep').forEach(sepTr => {
    const dateKey = sepTr.getAttribute('data-daysep');
    ['.day-chk-matin', '.day-chk-diner', '.day-chk-pm'].forEach(sel => {
      const input = sepTr.querySelector(sel);
      if (input) input.addEventListener('input', () => updateDayDisplay(el, dateKey));
    });
  });
}

// Sauvegarde automatique : dès qu'on quitte une ligne (focus déplacé ailleurs qu'à l'intérieur
// de celle-ci), on enregistre TOUTE la journée (Début/Fin/Tâche/KM de chaque segment + pauses
// de la ligne de séparation) sans avoir à cliquer un bouton. Un changement direct d'une case de
// pause (ligne de séparation) déclenche la même sauvegarde de groupe immédiatement.
function wireRowAutosave(el) {
  el.querySelectorAll('table tbody tr[data-item]').forEach(tr => {
    if (!tr.querySelector('.inp-debut')) return; // pas une ligne éditable (ex. rejetés)
    const dateKey = tr.getAttribute('data-date');
    tr.addEventListener('focusout', () => {
      if (tr.dataset.saving === '1') return;
      setTimeout(() => {
        if (tr.contains(document.activeElement)) return; // focus toujours dans la ligne
        if (!document.body.contains(tr)) return; // ligne déjà retirée (ex. rechargement en cours)
        tr.dataset.saving = '1';
        saveDayGroup(el, dateKey, {}).finally(() => { tr.dataset.saving = '0'; });
      }, 80);
    });
  });
  el.querySelectorAll('tr.day-sep').forEach(sepTr => {
    const dateKey = sepTr.getAttribute('data-daysep');
    ['.day-chk-matin', '.day-chk-diner', '.day-chk-pm'].forEach(sel => {
      const input = sepTr.querySelector(sel);
      if (!input) return;
      input.addEventListener('change', () => {
        if (sepTr.dataset.saving === '1') return;
        sepTr.dataset.saving = '1';
        saveDayGroup(el, dateKey, {}).finally(() => { sepTr.dataset.saving = '0'; });
      });
    });
  });
}

// Enregistre TOUS les segments d'une même journée (un seul poinçon la plupart du temps, mais
// potentiellement plusieurs en cas de changement de chantier) : Début/Fin/Tâche/KM propres à
// chaque segment, et les 3 champs de pause imputés UNIQUEMENT au DERNIER segment chronologique
// (les autres sont remis à neutre — Ajusté = Brut, aucune pause cochée), exactement la même
// convention que celle déjà utilisée par le serveur (api/punch.js). `opts.statusItemId` +
// `opts.statusLabel` permettent d'approuver/rejeter UN SEUL poinçon précis de la journée sans
// toucher au statut des autres segments de cette même journée.
async function saveDayGroup(el, dateKey, opts) {
  opts = opts || {};
  const daySepTr = el.querySelector(`tr.day-sep[data-daysep="${CSS.escape(dateKey)}"]`);
  const rowTrs = Array.from(el.querySelectorAll(`tr[data-item][data-date="${CSS.escape(dateKey)}"]`));
  if (!daySepTr || !rowTrs.length) return;
  const d = computeDayPayable(rowTrs, daySepTr);
  showSaveStatus('Modification en cours…');
  try {
    for (let i = 0; i < rowTrs.length; i++) {
      const tr = rowTrs[i];
      const itemId = tr.getAttribute('data-item');
      const isBiggest = i === d.biggestIndex;
      const km = Number(tr.querySelector('.inp-km').value) || 0;
      const selTache = tr.querySelector('.sel-tache');
      const ajusteH = Math.round((d.ajusteMinList[i] / 60) * 100) / 100;
      const cv = {
        [P_HDEBUT]: { hour: d.brutData[i].dh, minute: d.brutData[i].dm },
        [P_HFIN]: { hour: d.brutData[i].fh, minute: d.brutData[i].fm },
        [P_TOTAL_BRUT]: d.brutData[i].brutH,
        [P_TOTAL_AJUSTE]: ajusteH,
        [P_KM_AJUSTE]: km,
        [P_MATIN_NP]: { checked: (isBiggest && d.morningSkipped) ? 'true' : 'false' },
        [P_DINER_NP]: { checked: (isBiggest && d.lunchApplicable && d.lunchSkipped) ? 'true' : 'false' },
        [P_PM_PRISE]: { checked: (isBiggest && d.pmPrise) ? 'true' : 'false' }
      };
      if (selTache) cv[P_TACHE] = selTache.value;
      if (opts.statusItemId && opts.statusLabel && String(itemId) === String(opts.statusItemId)) cv[P_STATUT] = { label: opts.statusLabel };
      await gql(`mutation($board: ID!, $item: ID!, $cv: JSON!) { change_multiple_column_values(board_id: $board, item_id: $item, column_values: $cv) { id } }`,
        { board: String(POINCONS_BOARD), item: String(itemId), cv: JSON.stringify(cv) });
    }
    showToast('Enregistré ✔');
    await loadPoinconsForWeek(true);
  } catch (err) { showToast('Erreur: ' + err.message); }
  finally { hideSaveStatus(); }
}

// ===================== Vue détail commune (employé OU projet) =====================
// groupField: le champ par lequel regrouper les LIGNES du tableau sommaire ('projName' en
// vue employé, 'empName' en vue projet). opts.manualMode / fixedEmpId|fixedProjId servent au
// formulaire d'ajout manuel.
// Carte Leaflet (Vue par employé ET Vue par projet) — placée sous le fil de messages en vue
// employé, ou directement après la liste en vue projet (voir renderEntityDetail). Même patron
// que la carte du Tableau de bord ; le contenu réel est peuplé par renderEmployeeMap()/
// renderProjectMap() une fois le HTML injecté dans le DOM (voir renderParEmploye()/renderParProjet()).
// opts.mapElId distingue les deux instances ('employee-map' ou 'project-map') — absent = pas de carte.
function mapCardHtml(opts) {
  if (!opts || !opts.mapElId) return '';
  return `<div class="card employee-map-card" style="margin-top:16px;">
    <h4>Carte des poinçons de la semaine</h4>
    <div class="map-legend">
      <span><span class="dot" style="background:#00c875;"></span>Dans la zone</span>
      <span><span class="dot" style="background:#df2f4a;"></span>Hors zone</span>
      <span><span class="dot" style="background:#8b8f9c;"></span>Non validable</span>
      <span><span style="display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid #3457d5;background:rgba(52,87,213,.1);margin-right:4px;vertical-align:middle;"></span>Rayon toléré du chantier</span>
    </div>
    <div id="${opts.mapElId}"></div>
  </div>`;
}

function renderEntityDetail(rows, days, groupField, counterpartLabel, opts) {
  const addForm = manualAddFormHtml(opts, days);
  const messagesHtmlTop = opts.showMessagesForEmpId ? renderMessagesSection(opts.showMessagesForEmpId, days) : '';
  if (!rows.length) {
    return addForm + '<div class="empty-state">Aucun poinçon cette semaine.</div>' + messagesHtmlTop + mapCardHtml(opts);
  }

  // Les poinçons rejetés sont retirés des totaux et de la liste principale — ils vivent dans
  // une section repliable "Rejetés" plus bas (voir en fin de fonction), avec un bouton pour
  // les restaurer en cas d'erreur d'approbation.
  const rejectedRows = rows.filter(p => p.statut === 'Rejeté');
  rows = rows.filter(p => p.statut !== 'Rejeté');

  if (!rows.length) {
    return addForm + '<div class="empty-state">Aucun poinçon actif cette semaine.</div>' + messagesHtmlTop + mapCardHtml(opts) + renderRejectedSection(rejectedRows, counterpartLabel);
  }

  // --- Tableau sommaire (heures ajustées) ---
  const groups = {};
  rows.forEach(p => {
    const key = p[groupField] || '—';
    groups[key] = groups[key] || {};
    groups[key][p.date] = (groups[key][p.date] || 0) + (Number(p.totalAjuste) || 0);
  });
  const groupNames = Object.keys(groups).sort((a, b) => a.localeCompare(b));
  const dayTotals = {};
  days.forEach(d => { dayTotals[d] = 0; });
  let grandTotal = 0;

  // Regroupement par Tâche à l'intérieur de chaque ligne (projet en vue employé, employé en
  // vue projet) — sous-lignes affichées juste sous la ligne principale correspondante.
  const tacheLabel = t => t || '(sans tâche)';
  const byGroupTache = {};
  rows.forEach(p => {
    const key = p[groupField] || '—';
    const t = tacheLabel(p.tache);
    byGroupTache[key] = byGroupTache[key] || {};
    byGroupTache[key][t] = byGroupTache[key][t] || {};
    byGroupTache[key][t][p.date] = (byGroupTache[key][t][p.date] || 0) + (Number(p.totalAjuste) || 0);
  });
  // Sous-total par Tâche, toutes lignes confondues — affiché avant le total général.
  const byTacheGlobal = {};
  rows.forEach(p => {
    const t = tacheLabel(p.tache);
    byTacheGlobal[t] = byTacheGlobal[t] || {};
    byTacheGlobal[t][p.date] = (byTacheGlobal[t][p.date] || 0) + (Number(p.totalAjuste) || 0);
  });
  const tacheNamesGlobal = Object.keys(byTacheGlobal).sort((a, b) => a.localeCompare(b));

  let table = `<table class="summary-table"><thead><tr><th>${counterpartLabel === 'projet' ? 'Projet' : 'Employé'}</th>${days.map(d => `<th>${fmtDayHeader(d)}</th>`).join('')}<th>Total</th></tr></thead><tbody>`;
  groupNames.forEach(name => {
    let rowTotal = 0;
    table += `<tr><td>${name}</td>`;
    days.forEach(d => {
      const v = groups[name][d] || 0;
      rowTotal += v; dayTotals[d] += v; grandTotal += v;
      table += `<td>${v ? v.toFixed(2) : '—'}</td>`;
    });
    table += `<td><strong>${rowTotal.toFixed(2)}</strong></td></tr>`;

    const tacheNames = Object.keys(byGroupTache[name] || {}).sort((a, b) => a.localeCompare(b));
    tacheNames.forEach(tn => {
      let subTotal = 0;
      table += `<tr class="subrow-tache"><td>↳ ${tn}</td>`;
      days.forEach(d => {
        const v = byGroupTache[name][tn][d] || 0;
        subTotal += v;
        table += `<td>${v ? v.toFixed(2) : '—'}</td>`;
      });
      table += `<td>${subTotal.toFixed(2)}</td></tr>`;
    });
  });
  table += `</tbody><tfoot>`;
  tacheNamesGlobal.forEach(tn => {
    let rowTotalT = 0;
    table += `<tr class="subtotal-tache"><td>Sous-total — ${tn}</td>`;
    days.forEach(d => {
      const v = byTacheGlobal[tn][d] || 0;
      rowTotalT += v;
      table += `<td>${v ? v.toFixed(2) : '—'}</td>`;
    });
    table += `<td>${rowTotalT.toFixed(2)}</td></tr>`;
  });
  table += `<tr class="grand-total"><td>Total</td>${days.map(d => `<td>${dayTotals[d] ? dayTotals[d].toFixed(2) : '—'}</td>`).join('')}<td><strong>${grandTotal.toFixed(2)} h</strong></td></tr></tfoot></table>`;

  // --- Suivi de l'approbation ---
  const nApprouve = rows.filter(p => p.statut === 'Approuvé').length;
  const nAttente = rows.filter(p => !p.statut || p.statut === 'En attente').length;
  const nRejete = rejectedRows.length;
  const progress = `<div class="progress-note">${statusBadge('Approuvé')} ${nApprouve}<span>${statusBadge('En attente')} ${nAttente}</span><span>${statusBadge('Rejeté')} ${nRejete}</span></div>`;

  // --- Liste détaillée ---
  // Début/Fin/Tâche/KM restent modifiables directement sur chaque poinçon ; "Ajusté" (et
  // "Brut") ne le sont plus — ils se recalculent automatiquement (voir updateDayDisplay()).
  // Les 3 pauses (matin/dîner/PM) ne se gèrent PLUS par poinçon : elles sont désormais
  // regroupées sur une ligne de séparation PAR JOURNÉE (une seule fois par jour, même si
  // l'employé a plusieurs segments ce jour-là suite à un changement de chantier).
  const DETAIL_COLSPAN = 10;
  let list = `<div class="section-title">Détail des poinçons</div><table><thead><tr>
    <th>Date</th><th>${counterpartLabel === 'projet' ? 'Employé' : 'Projet'}</th><th>Tâche</th><th>Début</th><th>Fin</th><th>Brut</th><th>Ajusté</th><th>KM</th><th>Statut</th><th></th>
  </tr></thead><tbody>`;
  const sortedDetailRows = rows.slice().sort((a, b) => a.date.localeCompare(b.date) || (a.heureDebut || '').localeCompare(b.heureDebut || ''));
  const detailDayGroups = {};
  sortedDetailRows.forEach(p => { (detailDayGroups[p.date] = detailDayGroups[p.date] || []).push(p); });
  let lastDetailDate = null;
  sortedDetailRows.forEach(p => {
    if (p.date !== lastDetailDate) {
      lastDetailDate = p.date;
      const dayItems = detailDayGroups[p.date];
      // Le poinçon qui gère les pauses de la journée est celui qui a travaillé le PLUS
      // D'HEURES ce jour-là (pas nécessairement le dernier fermé chronologiquement) — même
      // convention que computeDayPayable()/saveDayGroup() plus bas et que le serveur
      // (api/punch.js, action 'finish').
      let biggestP = dayItems[0];
      dayItems.forEach(it => { if ((Number(it.totalBrut) || 0) >= (Number(biggestP.totalBrut) || 0)) biggestP = it; });
      const dayFinishMinutes = dayItems.reduce((max, it) => {
        const [fh, fm] = (it.heureFin || '00:00').split(':').map(Number);
        return Math.max(max, fh * 60 + (fm || 0));
      }, 0);
      const lunchApplicable = dayFinishMinutes >= 13 * 60;
      const afternoonApplicable = dayFinishMinutes >= 14 * 60;
      const dayTotalAjuste = dayItems.reduce((s, it) => s + (Number(it.totalAjuste) || 0), 0);
      const dayRaisonTitle = [
        biggestP.matinNP ? ('Matin non pris: ' + (biggestP.raisonMatin || '—')) : '',
        biggestP.dinerNP ? ('Dîner non pris: ' + (biggestP.raisonDiner || '—')) : ''
      ].filter(Boolean).join(' | ');
      list += `<tr class="day-sep" data-daysep="${p.date}">
        <td colspan="${DETAIL_COLSPAN}">
          <div class="day-sep-inner">
            <strong>${fmtDaySepLabel(p.date)}</strong>
            <span class="day-sep-pauses" title="${dayRaisonTitle.replace(/"/g, '&quot;')}">
              <label><input type="checkbox" class="day-chk-matin" ${!biggestP.matinNP ? 'checked' : ''}> Pause matin prise</label>
              <label><input type="checkbox" class="day-chk-diner" ${!biggestP.dinerNP ? 'checked' : ''} ${!lunchApplicable ? 'disabled' : ''}> Dîner pris</label>
              <label><input type="checkbox" class="day-chk-pm" ${biggestP.pmPrise ? 'checked' : ''} ${!afternoonApplicable ? 'disabled' : ''}> Pause PM prise</label>
            </span>
            <span class="day-sep-total">Total jour : <strong class="day-total-display">${dayTotalAjuste.toFixed(2)} h</strong></span>
          </div>
        </td>
      </tr>`;
    }
    // Quand une carte est disponible pour cette vue (Vue par employé ET Vue par projet), les
    // liens 📍début/fin la centrent dessus au lieu d'ouvrir Google Maps dans un nouvel onglet —
    // voir renderEmployeeMap()/renderProjectMap()/wireDetailEvents().
    const hasMap = !!opts.mapElId;
    const gpsLinks = [
      p.gpsDebut ? (hasMap
        ? `<a class="gps-link" href="#" data-map-focus="${p.itemId}_debut">📍début</a>`
        : `<a class="gps-link" target="_blank" href="https://maps.google.com/?q=${p.gpsDebut}">📍début</a>`) : '',
      p.gpsFin ? (hasMap
        ? `<a class="gps-link" href="#" data-map-focus="${p.itemId}_fin">📍fin</a>`
        : `<a class="gps-link" target="_blank" href="https://maps.google.com/?q=${p.gpsFin}">📍fin</a>`) : ''
    ].filter(Boolean).join(' ');
    const counterpart = counterpartLabel === 'projet' ? p.empName : p.projName;
    const autoFlag = p.arretAuto ? `<div class="auto-close-flag" title="Le poinçon était toujours ouvert à 20h00 — le système l'a fermé automatiquement à 15h15. Un message a été envoyé à l'employé pour confirmer l'heure réelle.">⚠ Arrêt automatique (15h15)</div>` : '';
    const geoStatus = geoStatusForPunch(p);
    list += `<tr data-item="${p.itemId}" data-date="${p.date}">
      <td>${p.date}<br>${gpsLinks}</td>
      <td>${counterpart}</td>
      <td><select class="sel-tache">${rowTacheOptionsHtml(p.empId, p.projId, p.tache)}</select></td>
      <td><div style="display:flex;align-items:center;gap:5px;"><input type="time" class="inp-debut" value="${p.heureDebut}">${geoDotHtml(geoStatus.debut)}</div>${autoFlag}</td>
      <td><div style="display:flex;align-items:center;gap:5px;"><input type="time" class="inp-fin" value="${p.heureFin}">${geoDotHtml(geoStatus.fin)}</div></td>
      <td class="brut-display">${p.totalBrut}</td>
      <td class="ajuste-display"><strong>${p.totalAjuste}</strong></td>
      <td><input type="number" step="0.1" class="inp-km" value="${kmForPunch(p)}"></td>
      <td>${statusBadge(p.statut)}</td>
      <td>
        <button class="btn btn-green btn-approve">✔</button>
        <button class="btn btn-danger btn-reject">✘</button>
      </td>
    </tr>`;
  });
  list += `</tbody></table>`;

  const messagesHtml = opts.showMessagesForEmpId ? renderMessagesSection(opts.showMessagesForEmpId, days) : '';

  return table + progress + addForm + list + messagesHtml + mapCardHtml(opts) + renderRejectedSection(rejectedRows, counterpartLabel);
}

// --- Section repliable des poinçons rejetés (exclus des totaux, restaurables) ---
function renderRejectedSection(rows, counterpartLabel) {
  if (!rows.length) return '';
  let html = `<details style="margin-top:16px;">
    <summary style="cursor:pointer;font-weight:700;font-size:13px;color:var(--text-secondary);">Poinçons rejetés (${rows.length})</summary>
    <table style="margin-top:8px;"><thead><tr>
      <th>Date</th><th>${counterpartLabel === 'projet' ? 'Employé' : 'Projet'}</th><th>Début</th><th>Fin</th><th>Ajusté</th><th>Statut</th><th></th>
    </tr></thead><tbody>`;
  rows.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(p => {
    const counterpart = counterpartLabel === 'projet' ? p.empName : p.projName;
    html += `<tr data-item="${p.itemId}" data-rejected="1">
      <td>${p.date}</td><td>${counterpart}</td><td>${p.heureDebut}</td><td>${p.heureFin}</td><td>${p.totalAjuste}</td><td>${statusBadge(p.statut)}</td>
      <td><button class="btn btn-outline btn-restore">↩ Restaurer</button></td>
    </tr>`;
  });
  html += `</tbody></table></details>`;
  return html;
}

async function restorePoincon(itemId) {
  showSaveStatus('Restauration en cours…');
  try {
    await gql(`mutation($board: ID!, $item: ID!, $cv: JSON!) { change_multiple_column_values(board_id: $board, item_id: $item, column_values: $cv) { id } }`,
      { board: String(POINCONS_BOARD), item: String(itemId), cv: JSON.stringify({ [P_STATUT]: { label: 'En attente' } }) });
    showToast('Poinçon restauré ✔');
    await loadPoinconsForWeek(true);
  } catch (err) { showToast('Erreur: ' + err.message); }
  finally { hideSaveStatus(); }
}

// --- Messages de l'employé, affichés à la fin de ses poinçons de la semaine (Vue par employé) ---
// Construit le fil de discussion complet avec un employé (toutes les semaines confondues —
// une conversation ne doit pas disparaître quand on change de semaine affichée). Les anciens
// messages avec une "Réponse" (ancien format, avant l'ajout de la colonne Auteur) sont
// affichés comme une bulle Admin distincte pour préserver l'historique.
function renderMessagesSection(empId, weekDates) {
  // Fil de discussion propre à CHAQUE semaine (Dim → Sam) : on filtre les messages à ceux
  // dont la date tombe dans la semaine actuellement affichée. Naviguer les semaines (en haut
  // de page) permet de revenir consulter les discussions passées, qui restent conservées.
  const weekStart = weekDates ? weekDates[0] : null;
  const weekEnd = weekDates ? weekDates[6] : null;
  const inWeek = dateStr => !weekStart || ((dateStr || '').slice(0, 10) >= weekStart && (dateStr || '').slice(0, 10) <= weekEnd);

  const bubbles = [];
  messagesCache.filter(m => m.empId === empId).forEach(m => {
    if (inWeek(m.date)) {
      bubbles.push({
        itemId: m.itemId, auteur: m.auteur || 'Employé', message: m.message, date: m.date,
        luAdmin: m.luAdmin, luEmploye: m.luEmploye, legacy: false
      });
    }
    if ((m.reponse || '').trim() && inWeek(m.reponseDate || m.date)) {
      bubbles.push({
        itemId: m.itemId + '-legacy', auteur: 'Admin', message: m.reponse, date: m.reponseDate || m.date,
        luAdmin: true, luEmploye: true, legacy: true
      });
    }
  });
  bubbles.sort((a, b) => a.date.localeCompare(b.date));

  const weekLabel = weekDates ? fmtWeekLabel(currentWeek) : '';
  const isCurrentWeek = weekDates ? currentWeek === mondayOfWeek(new Date()) : true;
  const notCurrentWeekNote = isCurrentWeek ? '' : `<div style="font-size:11px;color:var(--text-secondary);margin:-4px 0 8px;">Un nouveau message sera daté d'aujourd'hui et apparaîtra dans le fil de la semaine en cours, pas celui-ci.</div>`;

  let html = `<div class="section-title">Messages avec l'employé${weekLabel ? ' — ' + weekLabel : ''}</div><div class="msg-thread">`;
  if (!bubbles.length) {
    html += `<div class="empty-state" style="padding:14px;">Aucun message cette semaine-là.</div>`;
  } else {
    bubbles.forEach(b => {
      const mine = b.auteur === 'Admin';
      html += `<div class="msg-bubble-row ${mine ? 'mine' : ''}" data-msg="${b.itemId}" data-legacy="${b.legacy ? '1' : '0'}">
        <div class="msg-bubble ${mine ? 'admin' : 'emp'}">
          <div class="msg-bubble-meta">${mine ? 'Vous' : 'Employé'} — ${(b.date || '').slice(0, 10)}</div>
          <div class="msg-view">${(b.message || '').replace(/</g, '&lt;')}</div>
          <textarea class="msg-edit hidden">${(b.message || '').replace(/</g, '&lt;')}</textarea>
          <div class="flex-row" style="margin-top:6px;">
            <button class="btn btn-outline btn-msg-edit" style="padding:3px 8px;font-size:11px;">✏️</button>
            <button class="btn btn-outline btn-msg-save hidden" style="padding:3px 8px;font-size:11px;">Enreg.</button>
            <button class="btn btn-outline btn-msg-cancel hidden" style="padding:3px 8px;font-size:11px;">Annuler</button>
            <button class="btn btn-danger btn-msg-delete" style="padding:3px 8px;font-size:11px;">🗑️</button>
          </div>
        </div>
      </div>`;
    });
  }
  html += `</div>
    ${notCurrentWeekNote}
    <div class="msg-compose">
      <textarea class="msg-compose-text" placeholder="Écrire un message à cet employé…"></textarea>
      <button class="btn btn-primary btn-msg-send-new">✉️ Envoyer</button>
    </div>`;
  return html;
}

function manualAddFormHtml(opts, days) {
  const minDate = days[0], maxDate = days[6];
  const todayStr = new Date().toISOString().slice(0, 10);
  const defaultDate = (todayStr >= minDate && todayStr <= maxDate) ? todayStr : days[1]; // lundi par défaut

  const projectOptions = activeProjectsCache.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
  const employeeOptions = employeesCache.filter(e => e.statut === 'Actif' || e.statut === 'Inactif')
    .slice().sort((a, b) => a.name.localeCompare(b.name))
    .map(e => `<option value="${e.id}">${e.name}</option>`).join('');

  const empField = opts.manualMode === 'employee'
    ? `<div><label>Employé</label><input type="hidden" class="manual-emp" value="${opts.fixedEmpId || ''}"><div style="padding:6px 0;font-weight:600;font-size:13px;">${opts.fixedEmpName || ''}</div></div>`
    : `<label>Employé<select class="manual-emp wide"><option value="">— choisir —</option>${employeeOptions}</select></label>`;

  const projField = opts.manualMode === 'project'
    ? `<div><label>Projet</label><input type="hidden" class="manual-proj" value="${opts.fixedProjId || ''}"><div style="padding:6px 0;font-weight:600;font-size:13px;">${opts.fixedProjName || ''}</div></div>`
    : `<label>Projet<select class="manual-proj wide"><option value="">— choisir —</option>${projectOptions}</select></label>`;

  const initialEmpId = opts.manualMode === 'employee' ? (opts.fixedEmpId || '') : '';
  const initialProjId = opts.manualMode === 'project' ? (opts.fixedProjId || '') : '';
  const initialTaches = manualAllowedTaches(initialEmpId, initialProjId);

  return `<div class="manual-add-form">
    ${empField}
    ${projField}
    <label>Tâche<select class="manual-tache wide">${manualTacheOptionsHtml(initialTaches)}</select></label>
    <label>Date<input type="date" class="manual-date" value="${defaultDate}" min="${minDate}" max="${maxDate}"></label>
    <label>Début<input type="time" class="manual-hdebut"></label>
    <label>Fin<input type="time" class="manual-hfin"></label>
    <div style="display:flex;flex-direction:row;align-items:center;gap:14px;flex-wrap:nowrap;">
      <label style="flex-direction:row;align-items:center;gap:4px;white-space:nowrap;"><input type="checkbox" class="manual-matin" checked> Pause matin prise</label>
      <label style="flex-direction:row;align-items:center;gap:4px;white-space:nowrap;"><input type="checkbox" class="manual-diner" checked> Dîner pris</label>
      <label style="flex-direction:row;align-items:center;gap:4px;white-space:nowrap;"><input type="checkbox" class="manual-pm"> Pause PM prise</label>
    </div>
    <button class="btn btn-primary btn-manual-add">+ Ajouter un poinçon (oubli)</button>
  </div>`;
}

function wireDetailEvents(el, opts) {
  el.querySelectorAll('tr[data-item]').forEach(tr => {
    const itemId = tr.getAttribute('data-item');
    const btnApprove = tr.querySelector('.btn-approve');
    const btnReject = tr.querySelector('.btn-reject');
    const btnSave = tr.querySelector('.btn-save');
    const btnRestore = tr.querySelector('.btn-restore');
    const rowDateKey = tr.getAttribute('data-date');
    if (btnApprove) btnApprove.addEventListener('click', () => saveDayGroup(el, rowDateKey, { statusItemId: itemId, statusLabel: 'Approuvé' }));
    if (btnReject) btnReject.addEventListener('click', () => saveDayGroup(el, rowDateKey, { statusItemId: itemId, statusLabel: 'Rejeté' }));
    if (btnSave) btnSave.addEventListener('click', () => saveDayGroup(el, rowDateKey, {}));
    if (btnRestore) btnRestore.addEventListener('click', () => restorePoincon(itemId));
  });
  wireRowRecalc(el);
  wireRowAutosave(el);
  const addForm = el.querySelector('.manual-add-form');
  if (addForm) {
    // Le choix de Tâche dépend de l'employé (son métier) ET du projet (restriction Hors CCQ) —
    // on recalcule la liste dès que l'un ou l'autre change (n'a d'effet que sur les <select>
    // réels ; les champs fixes en <input type="hidden"> ne déclenchent jamais ce listener).
    const empEl = addForm.querySelector('.manual-emp');
    const projEl = addForm.querySelector('.manual-proj');
    if (empEl && empEl.tagName === 'SELECT') empEl.addEventListener('change', () => updateManualTacheSelect(addForm));
    if (projEl && projEl.tagName === 'SELECT') projEl.addEventListener('change', () => updateManualTacheSelect(addForm));
  }
  const addBtn = el.querySelector('.btn-manual-add');
  if (addBtn) addBtn.addEventListener('click', () => handleManualAdd(el));
  // Liens 📍début/fin (Vue par employé ET Vue par projet — voir renderEntityDetail) : centrer
  // la carte de la vue courante sur le poinçon plutôt que d'ouvrir Google Maps. opts.mapElId
  // distingue quelle instance/dictionnaire de marqueurs utiliser (employé vs projet).
  if (opts && opts.mapElId) {
    const isProjMap = opts.mapElId === 'project-map';
    el.querySelectorAll('.gps-link[data-map-focus]').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const key = link.getAttribute('data-map-focus');
        const mapInst = isProjMap ? projectMap : employeeMap;
        const markersDict = isProjMap ? projectMapMarkers : employeeMapMarkers;
        const entry = markersDict[key];
        const mapEl = document.getElementById(opts.mapElId);
        if (mapEl) mapEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        if (entry && mapInst) {
          mapInst.setView(entry.latlng, 16);
          entry.marker.openPopup();
        }
      });
    });
  }
  const msgEmpId = opts && opts.showMessagesForEmpId;
  wireMessageEvents(el, msgEmpId);
  // Consulter le fil de messages d'un employé = marquer lus les messages de LA SEMAINE AFFICHÉE
  // (pastille rouge du sidebar) — les messages d'autres semaines restent non lus tant qu'on
  // n'est pas allé les consulter dans leur propre fil.
  if (msgEmpId) markEmployeeMessagesReadByAdmin(msgEmpId, opts && opts.weekDates);
}

function wireMessageEvents(el, empId) {
  el.querySelectorAll('[data-msg]').forEach(row => {
    const itemId = row.getAttribute('data-msg');
    const isLegacy = row.getAttribute('data-legacy') === '1';
    const viewEl = row.querySelector('.msg-view');
    const editEl = row.querySelector('.msg-edit');
    const btnEdit = row.querySelector('.btn-msg-edit');
    const btnSave = row.querySelector('.btn-msg-save');
    const btnCancel = row.querySelector('.btn-msg-cancel');
    const btnDelete = row.querySelector('.btn-msg-delete');
    if (isLegacy) {
      // Bulle "réponse" historique (ancien format, avant la colonne Auteur) — non modifiable
      // individuellement ici, affichée pour préserver l'historique seulement.
      if (btnEdit) btnEdit.classList.add('hidden');
      if (btnSave) btnSave.classList.add('hidden');
      if (btnCancel) btnCancel.classList.add('hidden');
      if (btnDelete) btnDelete.classList.add('hidden');
      return;
    }
    if (btnEdit) btnEdit.addEventListener('click', () => {
      viewEl.classList.add('hidden'); btnEdit.classList.add('hidden');
      editEl.classList.remove('hidden'); btnSave.classList.remove('hidden'); btnCancel.classList.remove('hidden');
    });
    if (btnCancel) btnCancel.addEventListener('click', () => {
      editEl.value = viewEl.textContent;
      viewEl.classList.remove('hidden'); btnEdit.classList.remove('hidden');
      editEl.classList.add('hidden'); btnSave.classList.add('hidden'); btnCancel.classList.add('hidden');
    });
    if (btnSave) btnSave.addEventListener('click', async () => {
      const newText = editEl.value.trim();
      if (!newText) { showToast('Message vide.'); return; }
      try {
        await gql(`mutation($board: ID!, $item: ID!, $cv: JSON!) { change_multiple_column_values(board_id: $board, item_id: $item, column_values: $cv) { id } }`,
          { board: String(MESSAGES_BOARD), item: String(itemId), cv: JSON.stringify({ [M_MESSAGE]: { text: newText } }) });
        showToast('Message modifié ✔');
        await loadMessagesCache();
        renderParEmploye();
      } catch (err) { showToast('Erreur: ' + err.message); }
    });
    if (btnDelete) btnDelete.addEventListener('click', async () => {
      if (!confirm('Supprimer ce message ?')) return;
      try {
        await gql(`mutation($item: ID!) { delete_item(item_id: $item) { id } }`, { item: String(itemId) });
        showToast('Message supprimé ✔');
        await loadMessagesCache();
        renderParEmploye();
      } catch (err) { showToast('Erreur: ' + err.message); }
    });
  });

  // --- Envoyer un NOUVEAU message à l'employé (pas seulement répondre) ---
  const composeText = el.querySelector('.msg-compose-text');
  const btnSendNew = el.querySelector('.btn-msg-send-new');
  if (btnSendNew && empId) {
    btnSendNew.addEventListener('click', async () => {
      const text = (composeText.value || '').trim();
      if (!text) { showToast('Message vide.'); return; }
      const nowTor = new Date();
      const dateStr = nowTor.toLocaleDateString('en-CA', { timeZone: 'America/Toronto' });
      const timeStr = nowTor.toLocaleTimeString('en-CA', { timeZone: 'America/Toronto', hour12: false, hour: '2-digit', minute: '2-digit' });
      const cv = {
        [M_EMPLOYE]: { item_ids: [Number(empId)] },
        [M_MESSAGE]: { text },
        [M_DATE]: { date: dateStr, time: timeStr + ':00' },
        [M_STATUT]: { label: 'Nouveau' },
        [M_AUTEUR]: { label: 'Admin' },
        // L'admin vient d'écrire ce message : lu de son côté, pas encore de celui de l'employé
        // (déclenche la pastille rouge sur son bouton "Mes messages" mobile).
        [M_LU_ADMIN]: { checked: 'true' },
        [M_LU_EMPLOYE]: { checked: 'false' }
      };
      try {
        await gql(`mutation($board: ID!, $name: String!, $cv: JSON!) { create_item(board_id: $board, item_name: $name, column_values: $cv) { id } }`,
          { board: String(MESSAGES_BOARD), name: `Admin — ${dateStr}`, cv: JSON.stringify(cv) });
        showToast('Message envoyé ✔');
        await loadMessagesCache();
        renderParEmploye();
      } catch (err) { showToast('Erreur: ' + err.message); }
    });
  }
}

// Marque comme "lus par l'admin" tous les messages non lus envoyés par cet employé — appelé
// automatiquement chaque fois que son fil de messages est affiché (consulter = lire).
async function markEmployeeMessagesReadByAdmin(empId, weekDates) {
  const weekStart = weekDates ? weekDates[0] : null;
  const weekEnd = weekDates ? weekDates[6] : null;
  const inWeek = dateStr => !weekStart || ((dateStr || '').slice(0, 10) >= weekStart && (dateStr || '').slice(0, 10) <= weekEnd);
  const toMark = messagesCache.filter(m => m.empId === empId && m.auteur === 'Employé' && !m.luAdmin && inWeek(m.date));
  if (!toMark.length) return;
  for (const m of toMark) {
    try {
      await gql(`mutation($board: ID!, $item: ID!, $cv: JSON!) { change_multiple_column_values(board_id: $board, item_id: $item, column_values: $cv) { id } }`,
        { board: String(MESSAGES_BOARD), item: String(m.itemId), cv: JSON.stringify({ [M_LU_ADMIN]: { checked: 'true' } }) });
      m.luAdmin = true; // mise à jour optimiste du cache local
    } catch (e) { /* ignore — sera retenté au prochain rafraîchissement */ }
  }
  const badge = document.querySelector(`.split-sidebar button[data-emp="${empId}"] .badge-unread`);
  if (badge) badge.remove();
}

async function handleManualAdd(el) {
  const empEl = el.querySelector('.manual-emp');
  const projEl = el.querySelector('.manual-proj');
  const empId = empEl.value;
  const projId = projEl.value;
  const tacheVal = (el.querySelector('.manual-tache') || {}).value || '';
  const dateVal = el.querySelector('.manual-date').value;
  const hDebut = el.querySelector('.manual-hdebut').value;
  const hFin = el.querySelector('.manual-hfin').value;
  if (!empId || !projId || !dateVal || !hDebut || !hFin) { showToast('Veuillez remplir tous les champs.'); return; }
  if (!tacheVal) { showToast('Aucune tâche autorisée sélectionnée pour cet employé/projet.'); return; }

  const [dh, dm] = hDebut.split(':').map(Number);
  const [fh, fm] = hFin.split(':').map(Number);
  let elapsed = (fh * 60 + fm) - (dh * 60 + dm);
  if (elapsed < 0) elapsed += 1440;
  // Le total payable (plus bas) utilise le temps RÉEL écoulé (elapsed, non arrondi). Le total
  // brut affiché, lui, partage la même base décimale que l'ajusté (arrondi au quart d'heure).
  const brutH = Math.round((round15(elapsed) / 60) * 100) / 100;

  // Même logique CCQ que le poinçon mobile : dîner déduit seulement si la journée se rend à
  // 13h00+, pause PM ajustée seulement si elle se rend à 14h00+.
  const morningTaken = el.querySelector('.manual-matin').checked;
  const lunchTaken = el.querySelector('.manual-diner').checked;
  const afternoonTaken = el.querySelector('.manual-pm').checked;
  const finishMinutes = fh * 60 + fm;
  const lunchApplicable = finishMinutes >= 13 * 60;
  const afternoonApplicable = finishMinutes >= 14 * 60;
  const morningSkipped = !morningTaken;
  const lunchSkipped = lunchApplicable && !lunchTaken;
  const afternoonSkipped = afternoonApplicable && !afternoonTaken;
  // Dîner : pris = -30 min (pause non payée) ; NON pris = 0 (neutre, travaillé pendant la
  // pause donc payé) — ne jamais ajouter 30 min positivement.
  const lunchAdjust = lunchApplicable ? (lunchSkipped ? 0 : -30) : 0;
  const payableRaw = elapsed + lunchAdjust + (morningSkipped ? 15 : 0) + (afternoonSkipped ? 15 : 0);
  const payableMin = Math.max(0, round15(payableRaw));
  const ajusteH = Math.round((payableMin / 60) * 100) / 100;

  const cv = {
    [P_EMPLOYE]: { item_ids: [Number(empId)] },
    [P_PROJET]: { item_ids: [Number(projId)] },
    [P_DATE]: { date: dateVal },
    [P_SEMAINE]: mondayOfWeek(dateVal),
    [P_HDEBUT]: { hour: dh, minute: dm },
    [P_HFIN]: { hour: fh, minute: fm },
    [P_MATIN_NP]: { checked: morningSkipped ? 'true' : 'false' },
    [P_DINER_NP]: { checked: (lunchApplicable && !lunchTaken) ? 'true' : 'false' },
    [P_PM_PRISE]: { checked: afternoonTaken ? 'true' : 'false' },
    [P_TOTAL_BRUT]: brutH,
    [P_TOTAL_AJUSTE]: ajusteH,
    [P_STATUT]: { label: 'En attente' },
    [P_TACHE]: tacheVal
  };
  showSaveStatus('Ajout en cours…');
  try {
    await gql(`mutation($board: ID!, $name: String!, $cv: JSON!) { create_item(board_id: $board, item_name: $name, column_values: $cv) { id } }`,
      { board: String(POINCONS_BOARD), name: `Poinçon manuel ${dateVal}`, cv: JSON.stringify(cv) });
    showToast('Poinçon ajouté ✔');
    await loadPoinconsForWeek(true);
  } catch (err) { showToast('Erreur: ' + err.message); }
  finally { hideSaveStatus(); }
}

// ===================== Export PDF (Vue par employé / Vue par projet) =====================
// Version STATIQUE (sans champs modifiables, sans boutons d'action, sans le nouvel avertissement
// "Numéro d'employé manquant") du détail de la semaine — capturée en image (html2canvas) puis
// assemblée dans un PDF (jsPDF), paginée si le contenu dépasse une page. Même bibliothèques que
// l'export PDF de index.html (planification).
// opts.hideMainRowDayValues : sur la ligne principale (groupe), n'affiche que le total, pas le
// détail par jour — utilisé pour l'export "Vue par employé" (groupes = projets) car ce détail
// par jour est déjà visible sur les sous-lignes par tâche juste en dessous.
// opts.includeTacheBreakdown : inclut les sous-lignes par tâche sous chaque groupe ET le pied de
// page "Sous-total par tâche" — désactivé pour l'export "Vue par projet" (on veut simplement les
// lignes Employé + leur total, sans détail par tâche).
function buildExportSummaryTableHtml(rows, days, groupField, counterpartLabel, opts) {
  opts = opts || {};
  const activeRows = rows.filter(p => p.statut !== 'Rejeté');
  const groups = {};
  activeRows.forEach(p => {
    const key = p[groupField] || '—';
    groups[key] = groups[key] || {};
    groups[key][p.date] = (groups[key][p.date] || 0) + (Number(p.totalAjuste) || 0);
  });
  const groupNames = Object.keys(groups).sort((a, b) => a.localeCompare(b));
  const dayTotals = {};
  days.forEach(d => { dayTotals[d] = 0; });
  let grandTotal = 0;

  const tacheLabel = t => t || '(sans tâche)';
  const byGroupTache = {};
  const byTacheGlobal = {};
  if (opts.includeTacheBreakdown) {
    activeRows.forEach(p => {
      const key = p[groupField] || '—';
      const t = tacheLabel(p.tache);
      byGroupTache[key] = byGroupTache[key] || {};
      byGroupTache[key][t] = byGroupTache[key][t] || {};
      byGroupTache[key][t][p.date] = (byGroupTache[key][t][p.date] || 0) + (Number(p.totalAjuste) || 0);
    });
    activeRows.forEach(p => {
      const t = tacheLabel(p.tache);
      byTacheGlobal[t] = byTacheGlobal[t] || {};
      byTacheGlobal[t][p.date] = (byTacheGlobal[t][p.date] || 0) + (Number(p.totalAjuste) || 0);
    });
  }
  const tacheNamesGlobal = Object.keys(byTacheGlobal).sort((a, b) => a.localeCompare(b));

  let table = `<table><thead><tr><th>${counterpartLabel === 'projet' ? 'Projet' : 'Employé'}</th>${days.map(d => `<th>${fmtDayHeader(d)}</th>`).join('')}<th>Total</th></tr></thead><tbody>`;
  groupNames.forEach(name => {
    let rowTotal = 0;
    table += `<tr><td>${name}</td>`;
    days.forEach(d => {
      const v = groups[name][d] || 0;
      rowTotal += v; dayTotals[d] += v; grandTotal += v;
      table += `<td>${opts.hideMainRowDayValues ? '' : (v ? v.toFixed(2) : '—')}</td>`;
    });
    table += `<td><strong>${rowTotal.toFixed(2)}</strong></td></tr>`;
    if (opts.includeTacheBreakdown) {
      const tacheNames = Object.keys(byGroupTache[name] || {}).sort((a, b) => a.localeCompare(b));
      tacheNames.forEach(tn => {
        let subTotal = 0;
        table += `<tr><td>↳ ${tn}</td>`;
        days.forEach(d => {
          const v = byGroupTache[name][tn][d] || 0;
          subTotal += v;
          table += `<td>${v ? v.toFixed(2) : '—'}</td>`;
        });
        table += `<td>${subTotal.toFixed(2)}</td></tr>`;
      });
    }
  });
  table += `</tbody><tfoot>`;
  if (opts.includeTacheBreakdown) {
    tacheNamesGlobal.forEach(tn => {
      let rowTotalT = 0;
      table += `<tr class="export-subtotal"><td>Sous-total — ${tn}</td>`;
      days.forEach(d => {
        const v = byTacheGlobal[tn][d] || 0;
        rowTotalT += v;
        table += `<td>${v ? v.toFixed(2) : '—'}</td>`;
      });
      table += `<td>${rowTotalT.toFixed(2)}</td></tr>`;
    });
  }
  table += `<tr class="export-grand-total"><td>Total</td>${days.map(d => `<td>${dayTotals[d] ? dayTotals[d].toFixed(2) : '—'}</td>`).join('')}<td>${grandTotal.toFixed(2)} h</td></tr></tfoot></table>`;
  return table;
}
// Regroupe les poinçons PAR JOUR (comme la ligne de séparation de journée de l'admin) et insère,
// avant chaque groupe, une ligne indiquant les 3 pauses gérées ce jour-là (portées par le
// poinçon ayant le plus d'heures travaillées — même convention que computeDayPayable() /
// saveDayGroup()), pour que l'employé voie clairement ce qui a été approuvé.
function buildExportDetailTableHtml(rows, counterpartLabel) {
  const activeRows = rows.filter(p => p.statut !== 'Rejeté');
  const sorted = activeRows.slice().sort((a, b) => a.date.localeCompare(b.date) || (a.heureDebut || '').localeCompare(b.heureDebut || ''));
  const dayGroups = {};
  sorted.forEach(p => { (dayGroups[p.date] = dayGroups[p.date] || []).push(p); });
  const DETAIL_COLSPAN = 9;

  let html = `<table><thead><tr>
    <th>Date</th><th>${counterpartLabel === 'projet' ? 'Employé' : 'Projet'}</th><th>Tâche</th><th>Début</th><th>Fin</th><th>Brut</th><th>Ajusté</th><th>KM</th><th>Statut</th>
  </tr></thead><tbody>`;
  let lastDate = null;
  sorted.forEach(p => {
    if (p.date !== lastDate) {
      lastDate = p.date;
      const dayItems = dayGroups[p.date];
      let biggestP = dayItems[0];
      dayItems.forEach(it => { if ((Number(it.totalBrut) || 0) >= (Number(biggestP.totalBrut) || 0)) biggestP = it; });
      const dayFinishMinutes = dayItems.reduce((max, it) => {
        const [fh, fm] = (it.heureFin || '00:00').split(':').map(Number);
        return Math.max(max, fh * 60 + (fm || 0));
      }, 0);
      const lunchApplicable = dayFinishMinutes >= 13 * 60;
      const afternoonApplicable = dayFinishMinutes >= 14 * 60;
      const pauseParts = [`Pause matin : ${!biggestP.matinNP ? 'prise ✔' : 'non prise ✘'}`];
      if (lunchApplicable) pauseParts.push(`Dîner : ${!biggestP.dinerNP ? 'pris ✔' : 'non pris ✘'}`);
      if (afternoonApplicable) pauseParts.push(`Pause PM : ${biggestP.pmPrise ? 'prise ✔' : 'non prise ✘'}`);
      html += `<tr class="export-day-sep"><td colspan="${DETAIL_COLSPAN}"><strong>${fmtDaySepLabel(p.date)}</strong> — ${pauseParts.join(' &nbsp;·&nbsp; ')}</td></tr>`;
    }
    const counterpart = counterpartLabel === 'projet' ? p.empName : p.projName;
    html += `<tr>
      <td>${p.date}</td><td>${counterpart}</td><td>${p.tache || '—'}</td>
      <td>${p.heureDebut}</td><td>${p.heureFin}</td>
      <td>${p.totalBrut}</td><td>${p.totalAjuste}</td><td>${p.kmAjuste || p.kmSuggere || '—'}</td>
      <td>${p.statut || 'En attente'}</td>
    </tr>`;
  });
  html += `</tbody></table>`;
  return html;
}
async function exportEntityPDF(opts) {
  if (typeof window.html2canvas !== 'function' || !window.jspdf) {
    showToast("Bibliothèque d'export PDF non chargée. Vérifiez votre connexion internet et réessayez.");
    return;
  }
  const container = document.createElement('div');
  container.id = 'export-container';
  container.style.cssText = 'position:fixed;left:-9999px;top:0;width:900px;background:#fff;padding:24px;font-family:Arial,sans-serif;color:#1c1f26;';
  container.innerHTML = `
    <style>
      #export-container table { border-collapse:collapse; width:100%; margin-bottom:20px; }
      #export-container th, #export-container td { border:1px solid #e2e4ea; padding:5px 8px; font-size:11px; text-align:left; }
      #export-container th { background:#fafafa; }
      #export-container tr.export-subtotal td { font-weight:700; background:#e8edff; color:#2547cc; }
      #export-container tr.export-grand-total td { font-weight:700; background:#2547cc; color:#ffffff; }
      #export-container tr.export-day-sep td { background:#f4f5f7; font-size:10.5px; color:#3d4148; }
    </style>
    <div style="font-size:20px;font-weight:800;margin-bottom:2px;">${opts.title}</div>
    <div style="font-size:12px;color:#6b7080;margin-bottom:16px;">${opts.subtitle}</div>
    <div style="font-size:14px;font-weight:700;margin-bottom:6px;">Sommaire</div>
    ${buildExportSummaryTableHtml(opts.rows, opts.days, opts.groupField, opts.counterpartLabel, { hideMainRowDayValues: opts.hideMainRowDayValues, includeTacheBreakdown: opts.includeTacheBreakdown })}
    <div style="font-size:14px;font-weight:700;margin:16px 0 6px;">Détail des poinçons</div>
    ${buildExportDetailTableHtml(opts.rows, opts.counterpartLabel)}
  `;
  document.body.appendChild(container);
  try {
    const canvas = await window.html2canvas(container, { scale: 2, backgroundColor: '#ffffff' });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'portrait', unit: 'pt', format: 'letter' });
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const margin = 24;
    const imgW = pageWidth - margin * 2;
    const imgH = canvas.height * (imgW / canvas.width);
    const usableH = pageHeight - margin * 2;
    const imgData = canvas.toDataURL('image/png');
    let heightLeft = imgH;
    let position = margin;
    pdf.addImage(imgData, 'PNG', margin, position, imgW, imgH);
    heightLeft -= usableH;
    while (heightLeft > 0) {
      position = margin - (imgH - heightLeft);
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', margin, position, imgW, imgH);
      heightLeft -= usableH;
    }
    pdf.save(opts.filename);
  } catch (err) {
    showToast('Erreur export PDF: ' + err.message);
  } finally {
    container.remove();
  }
}

// ===================== Tab: Vue par employé =====================
function renderParEmploye() {
  const el = document.getElementById('parempl-content');
  const days = weekDatesSunToSat(currentWeek);

  // Employés à afficher : ceux qui ont un compte ACTIF sur l'app mobile, PLUS ceux qui ont au
  // moins un poinçon dans la semaine affichée (poinconsCache est déjà filtré sur currentWeek) —
  // ceci préserve l'historique : un employé désactivé/parti reste visible dans les semaines
  // passées où il a des poinçons, sans polluer la liste des semaines où il n'en a aucun.
  const empIdsWithPunchThisWeek = new Set(poinconsCache.map(p => p.empId));
  const sidebarEmployees = employeesCache.filter(e => (e.clerkUserId && e.accessEnabled) || empIdsWithPunchThisWeek.has(e.id))
    .slice()
    .sort((a, b) => (a.codeAvantage || '').localeCompare(b.codeAvantage || '', undefined, { numeric: true }));

  if (!selectedEmpId || !sidebarEmployees.some(e => e.id === selectedEmpId)) {
    const withPunch = sidebarEmployees.find(e => poinconsCache.some(p => p.empId === e.id));
    selectedEmpId = (withPunch || sidebarEmployees[0] || {}).id || null;
  }

  const sidebarHtml = sidebarEmployees.map(e => {
    const empPunches = poinconsCache.filter(p => p.empId === e.id);
    const count = empPunches.length;
    const pendingCount = empPunches.filter(p => !p.statut || p.statut === 'En attente').length;
    // Crochet vert : l'employé a des poinçons cette semaine ET plus aucun n'est en attente.
    const doneCheck = (count > 0 && pendingCount === 0) ? ' <span style="color:var(--green);" title="Aucun poinçon en attente">✔</span>' : '';
    const unreadMsgCount = messagesCache.filter(m => m.empId === e.id && m.auteur === 'Employé' && !m.luAdmin).length;
    const unreadBadge = unreadMsgCount ? ` <span class="badge-unread" title="${unreadMsgCount} nouveau message${unreadMsgCount > 1 ? 's' : ''}">${unreadMsgCount}</span>` : '';
    return `<button class="${e.id === selectedEmpId ? 'active' : ''}" data-emp="${e.id}">${e.name}${doneCheck}${unreadBadge}<span class="sub">${e.codeAvantage || '—'}${count ? ' · ' + count + ' poinçon' + (count > 1 ? 's' : '') : ''}</span></button>`;
  }).join('');

  const selectedEmp = sidebarEmployees.find(e => e.id === selectedEmpId);
  // Numéro d'employé avantage manquant : avertissement rouge à côté du nom (jamais inclus dans
  // l'export PDF ci-dessous, ni dans l'export paie .txt — voir exportEntityPDF/exportTxt).
  const missingCodeWarning = (selectedEmp && !selectedEmp.codeAvantage)
    ? ` <span style="color:var(--danger);font-weight:700;font-size:12px;">Numéro d'employé manquant</span>`
    : '';
  const empHeader = selectedEmp
    ? `<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;">
        <div>
          <div style="font-size:20px;font-weight:800;">${selectedEmp.name}${missingCodeWarning}</div>
          <div style="font-size:12px;color:var(--text-secondary);">${selectedEmp.codeAvantage || '—'}</div>
        </div>
        <button class="btn btn-outline" id="btn-export-emp-pdf">⬇ Export</button>
      </div>`
    : '';
  const empRows = poinconsCache.filter(p => p.empId === selectedEmpId);
  const detailOpts = { manualMode: 'employee', fixedEmpId: selectedEmpId, fixedEmpName: selectedEmp && selectedEmp.name, showMessagesForEmpId: selectedEmpId, mapElId: selectedEmpId ? 'employee-map' : null, weekDates: days };
  const mainHtml = selectedEmpId
    ? empHeader + renderEntityDetail(empRows, days, 'projName', 'employe', detailOpts)
    : '<div class="empty-state">Aucun employé actif ni avec poinçon cette semaine.</div>';

  el.innerHTML = `<div class="split-view">
    <div class="split-sidebar">${sidebarHtml || '<div class="empty-state">Aucun employé.</div>'}</div>
    <div class="split-main">${mainHtml}</div>
  </div>`;

  el.querySelectorAll('.split-sidebar button[data-emp]').forEach(btn => {
    btn.addEventListener('click', () => { selectedEmpId = btn.getAttribute('data-emp'); renderParEmploye(); });
  });
  const btnExportEmp = document.getElementById('btn-export-emp-pdf');
  if (btnExportEmp && selectedEmp) {
    btnExportEmp.addEventListener('click', () => exportEntityPDF({
      title: selectedEmp.name,
      subtitle: fmtWeekLabel(currentWeek),
      rows: empRows, days, groupField: 'projName', counterpartLabel: 'employe',
      hideMainRowDayValues: true, includeTacheBreakdown: true,
      filename: `Poinçons - ${selectedEmp.name} - ${currentWeek}.pdf`
    }));
  }
  wireDetailEvents(el, detailOpts);

  // Carte des poinçons de la semaine (voir mapCardHtml()) — "bonus" comme celle du Tableau de
  // bord : si le CDN Leaflet ne charge pas, ça ne doit jamais bloquer le reste de la Vue par employé.
  if (selectedEmpId) {
    ensureLeaflet().then(() => renderEmployeeMap(empRows)).catch(() => {
      const mapEl = document.getElementById('employee-map');
      if (mapEl) mapEl.outerHTML = '<div class="empty-state">Carte indisponible (problème réseau). Le reste de la vue fonctionne normalement.</div>';
    });
  }
}

// ===================== Tab: Vue par projet =====================
function renderParProjet() {

  wireDetailEvents(el, detailOpts);

  // Carte des poinçons de la semaine (voir mapCardHtml()) — "bonus" comme celle du Tableau de

  if (selectedProjId) {
    ensureLeaflet().then(() => renderProjectMap(projRows)).catch(() => {
      const mapEl = document.getElementById('project-map');
      if (mapEl) mapEl.outerHTML = '<div class="empty-state">Carte indisponible (problème réseau). Le reste de la vue fonctionne normalement.</div>';
    });
  }
}

async function loadComptes() {
  document.getElementById('comptes-content').innerHTML = '<div class="empty-state">Chargement…</div>';
  if (!tachesCache.length) { try { await loadMetiersTaches(); } catch (e) { /* affichera "—" pour les tâches */ } }
  const data = await gql(`
    query($board: [ID!]) {
      boards(ids: $board) {
        items_page(query_params: { rules: [
          { column_id: "${EMP_ENTREPRISE_COL}", compare_value: [1], operator: any_of },
          { column_id: "${EMP_STATUT_COL}", compare_value: [0,1,2], operator: any_of }
        ] }, limit: 300) {
          items { id name column_values(ids: ["${EMP_PHONE_COL}","${COL_CLERK_ID}","${COL_ACCESS}","${EMP_STATUT_COL}","${EMP_CODE_AVANTAGE_COL}","${EMP_TITRE_COL}","${EMP_ADRESSE_COL}"]) { id text } }
        }
      }
    }
  `, { board: [String(EMPLOYEES_BOARD)] });

  employeesCache = ((data.boards[0] && data.boards[0].items_page.items) || []).map(it => {
    const cv = cvIndex(it);
    return {
      id: it.id, name: it.name,
      phone: formatPhone10(cv[EMP_PHONE_COL].text),
      clerkUserId: cv[COL_CLERK_ID].text || '',
      accessEnabled: cv[COL_ACCESS].text === 'v',
      statut: cv[EMP_STATUT_COL].text || '',
      codeAvantage: cv[EMP_CODE_AVANTAGE_COL].text || '',
      titre: cv[EMP_TITRE_COL].text || '',
      adresse: cv[EMP_ADRESSE_COL].text || ''
    };
  }).sort((a, b) => a.name.localeCompare(b.name));

  renderComptes();
}

const COMPTES_COLS_HEAD = `<th>Employé</th><th>Titre d'emploi</th><th>Tâches autorisées</th><th>Code avantage</th><th>Adresse complète</th><th>Téléphone</th><th>Accès</th><th>Actions</th>`;
