<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exacto-Punch — Administration</title>
<script>
  // Applique le thème AVANT le premier rendu (évite un flash du mauvais thème) — clair/sombre,
  // mémorisé par navigateur (localStorage), défaut = clair pour cette app (voir demande).
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('exactoTheme_punch'); } catch (e) {}
    document.documentElement.setAttribute('data-theme', saved === 'light' || saved === 'dark' ? saved : 'light');
  })();
</script>
<style>
  :root {
    /* Entête toujours claire (voir header.topbar plus bas) — indépendante du thème, pour que
       le logo Exacto (tracé marine + bleu sur fond transparent) reste lisible dans les deux cas. */
    --header-bg:#ffffff; --header-text:#0b1e3d; --header-border:#dde4f0;
  }
  html[data-theme="light"] {
    color-scheme: light;
    --accent:#3b63ff; --accent-dark:#2547cc; --accent-bg:#e8edff;
    --bg:#f4f6fb; --panel:#ffffff; --panel-alt:#eef2fa; --border:#dde4f0;
    --text:#0b1e3d; --text-secondary:#5b6b85;
    --danger:#e2445c; --danger-bg:#fdecef;
    --green:#00c875; --green-bg:#e8faf1;
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --accent:#5b82ff; --accent-dark:#a9bdff; --accent-bg:#16264a;
    --bg:#0d1b30; --panel:#142a4a; --panel-alt:#1b3255; --border:#2a4066;
    --text:#eaf0fb; --text-secondary:#9db0d1;
    --danger:#ff5470; --danger-bg:#3e222b;
    --green:#2fd88a; --green-bg:#12332a;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); }
  #clerk-signin { max-width:420px; margin:60px auto; }
  header.topbar { display:flex; align-items:center; justify-content:space-between; padding:10px 20px; background:var(--header-bg); border-bottom:1px solid var(--header-border); color:var(--header-text); }
  #header-brand { display:flex; align-items:center; gap:10px; }
  #header-logo { height:40px; width:auto; display:block; }
  header.topbar .brand { font-weight:700; font-size:17px; color:var(--header-text); }
  #clerk-account { display:flex; align-items:center; gap:6px; flex-shrink:0; line-height:1; }
  #clerk-user-name { font-size:12px; color:var(--header-text); opacity:.7; font-weight:600; white-space:nowrap; }
  #clerk-user-button { display:flex; align-items:center; flex-shrink:0; }
  #theme-toggle { border:1px solid var(--header-border); background:#fff; color:var(--header-text); border-radius:8px; width:30px; height:30px; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  #theme-toggle:hover { background:#f2f5fb; }
  nav.tabs { display:flex; gap:4px; padding:10px 20px 0; background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:wrap; }
  nav.tabs button { border:none; background:none; padding:10px 14px; font-size:14px; font-weight:600; color:var(--text-secondary); cursor:pointer; border-bottom:3px solid transparent; }
  nav.tabs button.active { color:var(--accent-dark); border-bottom-color:var(--accent); }
  main { max-width:1200px; margin:0 auto; padding:20px; }
  /* Le Tableau de bord (carte + listes) profite de toute la largeur de l'écran — les autres
     onglets (tableaux) restent à une largeur lisible de 1200px. */
  main:has(#tab-dashboard.active) { max-width:none; }
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }
  .weeknav { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .weeknav button { border:1px solid var(--border); background:var(--panel); color:var(--text); border-radius:8px; padding:8px 12px; cursor:pointer; }
  .weeknav .weeklabel { font-weight:700; }
  table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  th, td { padding:8px 10px; border-bottom:1px solid var(--border); font-size:13px; text-align:left; vertical-align:middle; }
  th { background:var(--panel-alt); color:var(--text-secondary); font-weight:600; }
  tr:last-child td { border-bottom:none; }
  input[type=number], input[type=text], input[type=password], input[type=tel], select {
    padding:6px 8px; border:1px solid var(--border); border-radius:6px; font-size:13px; width:90px; background:var(--panel); color:var(--text);
  }
  input[type=text].wide, input[type=tel].wide { width:160px; }
  input[type=time] { padding:6px 6px; border:1px solid var(--border); border-radius:6px; font-size:13px; width:118px; }
  #credit-line { display:flex; align-items:center; justify-content:flex-end; gap:5px; padding:2px 12px 0; background:var(--panel); font-size:9px; color:var(--text-secondary); white-space:nowrap; }
  @media (max-width:768px) { #credit-line { display:none; } }
  .pause-cell { display:flex; flex-direction:row; gap:8px; white-space:nowrap; }
  .pause-cell label { display:flex; flex-direction:row; align-items:center; gap:3px; font-size:11px; color:var(--text-secondary); }
  /* Ligne de séparation "journée" (Détail des poinçons) : regroupe les 3 pauses AU NIVEAU DE
     LA JOURNÉE plutôt que par poinçon individuel — voir day-sep-inner ci-dessous. */
  tr.day-sep td { background:var(--panel-alt); border-top:2px solid var(--border); padding:8px 10px; }
  .day-sep-inner { display:flex; flex-direction:row; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .day-sep-inner strong { font-size:13px; text-transform:capitalize; }
  .day-sep-pauses { display:flex; flex-direction:row; gap:14px; flex-wrap:wrap; }
  .day-sep-pauses label { display:flex; flex-direction:row; align-items:center; gap:4px; font-size:12px; color:var(--text-secondary); white-space:nowrap; }
  .day-sep-pauses input[disabled] { opacity:.4; }
  .day-sep-total { font-size:12px; color:var(--text-secondary); white-space:nowrap; }
  .day-sep-total strong { color:var(--text); }
  .ajuste-display, .brut-display { font-size:13px; }
  .badge { display:inline-block; padding:3px 8px; border-radius:20px; font-size:11px; font-weight:700; }
  .badge-attente { background:var(--accent-bg); color:var(--accent-dark); }
  .badge-approuve { background:var(--green-bg); color:var(--green); }
  .badge-rejete { background:var(--danger-bg); color:var(--danger); }
  .badge-exporte { background:var(--accent-bg); color:var(--accent-dark); }
  .btn { border:none; border-radius:8px; padding:7px 12px; font-size:13px; font-weight:600; cursor:pointer; margin-right:4px; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-outline { background:var(--panel); border:1px solid var(--border); color:var(--text); }
  .btn-danger { background:var(--danger-bg); color:var(--danger); }
  .btn-green { background:var(--green-bg); color:var(--green); }
  .section-title { font-size:16px; font-weight:700; margin:24px 0 10px; }
  .empty-state { color:var(--text-secondary); padding:30px; text-align:center; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px; }
  .flex-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .reason-note { font-size:12px; color:var(--danger); margin-top:2px; }
  .auto-close-flag { font-size:10px; font-weight:700; color:var(--danger); margin-top:3px; white-space:nowrap; cursor:help; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#1c2b42; color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; z-index:200; }
  /* Barre persistante en bas de l'écran pendant qu'une sauvegarde est en cours — contrairement
     au .toast (ponctuel), elle reste visible tant que l'opération n'est pas terminée, pour que
     l'utilisateur sache qu'une modification est en train de s'enregistrer sans que la page se
     vide/recharge sous ses yeux. */
  #save-status-bar {
    position:fixed; left:0; right:0; bottom:0; display:none; align-items:center; justify-content:center;
    gap:8px; background:var(--accent); color:#fff; padding:9px 12px; font-size:13px; font-weight:600;
    z-index:250; box-shadow:0 -2px 8px rgba(0,0,0,.12);
  }
  #save-status-bar.visible { display:flex; }
  #save-status-bar .dot { width:7px; height:7px; border-radius:50%; background:#fff; animation:save-status-pulse 1s infinite ease-in-out; }
  @keyframes save-status-pulse { 0%,100% { opacity:.25; } 50% { opacity:1; } }
  .gps-link { font-size:11px; color:var(--accent-dark); text-decoration:none; }
  /* Indicateur de géorepérage à côté de Début/Fin (Vue par employé/projet) : cercle vert plein
     = position GPS dans le rayon toléré du chantier ; point rouge clignotant = hors zone. */
  .geo-dot { display:inline-block; width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .geo-dot-ok { background:#00c875; }
  .geo-dot-bad { background:#df2f4a; animation:geo-dot-blink 1s infinite; }
  @keyframes geo-dot-blink { 0%,100% { opacity:1; } 50% { opacity:.25; } }
  .split-view { display:flex; gap:16px; align-items:flex-start; }
  .split-sidebar { width:220px; flex:none; background:var(--panel); border:1px solid var(--border); border-radius:10px; overflow-y:auto; max-height:74vh; }
  .split-sidebar button { display:block; width:100%; text-align:left; padding:10px 12px; border:none; background:none; border-bottom:1px solid var(--border); cursor:pointer; font-size:13px; color:var(--text); }
  .split-sidebar button:last-child { border-bottom:none; }
  .split-sidebar button.active { background:var(--accent-bg); color:var(--accent-dark); font-weight:700; }
  .split-sidebar button .sub { display:block; font-size:11px; color:var(--text-secondary); font-weight:400; }
  .split-main { flex:1; min-width:0; }
  table.summary-table th, table.summary-table td { text-align:center; }
  table.summary-table th:first-child, table.summary-table td:first-child { text-align:left; }
  table.summary-table tfoot td { font-weight:700; background:var(--panel-alt); }
  /* Sous-lignes "par tâche" sous chaque projet/employé, et sous-total par tâche avant le
     total général — plus discrètes que les lignes principales. */
  table.summary-table tr.subrow-tache td { font-size:11px; color:var(--text-secondary); font-style:italic; font-weight:400; background:none; padding-top:3px; padding-bottom:3px; }
  table.summary-table tr.subrow-tache td:first-child { padding-left:22px; }
  table.summary-table tfoot tr.subtotal-tache td { font-weight:600; background:var(--panel-alt); color:var(--text-secondary); font-size:12px; }
  table.summary-table tfoot tr.grand-total td { font-weight:700; background:var(--panel-alt); }
  .progress-note { font-size:12px; color:var(--text-secondary); margin:10px 0; display:flex; gap:14px; align-items:center; }
  .manual-add-form { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-top:14px; padding-top:14px; border-top:1px dashed var(--border); }
  .manual-add-form label { display:flex; flex-direction:column; font-size:11px; color:var(--text-secondary); gap:2px; }
  .hidden { display:none !important; }
  .dashboard-grid { display:grid; grid-template-columns:1fr 1.3fr; gap:10px; align-items:start; }
  .dashboard-lists { display:flex; flex-direction:column; gap:8px; }
  .dashboard-lists .card { padding:8px 10px; margin-bottom:0; }
  .dashboard-lists .card h4 { margin:0 0 4px; font-size:12px; }
  .dashboard-lists .card-body { max-height:150px; overflow-y:auto; }
  /* Vue condensée de l'onglet Configuration : cartes de métiers en grille compacte plutôt
     qu'une longue colonne unique, pour limiter le défilement. */
  #tab-config .section-title { margin:16px 0 8px; font-size:14px; }
  #tab-config .section-title:first-child { margin-top:0; }
  .config-metiers-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:8px; align-items:start; }
  .config-metiers-grid .card { padding:8px 10px; margin-bottom:0; }
  .config-metiers-grid .card table { font-size:12px; }
  .config-metiers-grid .card th, .config-metiers-grid .card td { padding:4px 5px; }
  .config-metiers-grid .card strong { font-size:13px; }
  .config-metiers-grid .card .inp-tache-nom, .config-metiers-grid .card .new-tache-nom { width:100%; min-width:0; }
  .config-metiers-grid .card .inp-tache-code, .config-metiers-grid .card .new-tache-code { width:60px; }
  .config-metiers-grid .card .btn-toggle-masque { padding:3px 8px; font-size:11px; }
  #config-proj-scroll { max-height:340px; overflow-y:auto; border:1px solid var(--border); border-radius:8px; }
  #config-proj-scroll table { border:none; border-radius:0; }
  #config-proj-scroll thead th { position:sticky; top:0; z-index:1; }
  .dash-emp-row { display:flex; align-items:center; justify-content:space-between; padding:3px 0; border-bottom:1px solid var(--border); font-size:12px; line-height:1.25; }
  .dash-emp-row:last-child { border-bottom:none; }
  .dash-emp-row .proj { color:var(--text-secondary); font-size:11px; }
  .dashboard-map-card { padding:8px 10px; margin-bottom:0; }
  .dashboard-map-card h4 { margin:0 0 4px; font-size:12px; }
  #dashboard-map { height:340px; border-radius:8px; border:1px solid var(--border); }
  .map-legend { display:flex; gap:12px; align-items:center; margin:4px 0 6px; font-size:11px; }
  .map-legend .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; }
  #dash-map-search { width:100%; margin-bottom:6px; }
  .dashboard-lists .empty-state, .dashboard-map-card .empty-state { padding:8px; font-size:12px; }
  .employee-map-card { padding:10px 12px; }
  .employee-map-card h4 { margin:0 0 6px; font-size:13px; }
  #employee-map, #project-map { height:360px; border-radius:8px; border:1px solid var(--border); }
  .employee-map-card .empty-state { padding:8px; font-size:12px; }
  @media (max-width:900px) { .dashboard-grid { grid-template-columns:1fr; } }
  .msg-thread { display:flex; flex-direction:column; gap:8px; max-height:360px; overflow-y:auto; padding:8px; background:var(--bg); border-radius:10px; border:1px solid var(--border); }
  .msg-bubble-row { display:flex; }
  .msg-bubble-row.mine { justify-content:flex-end; }
  .msg-bubble { max-width:75%; border-radius:12px; padding:8px 10px; font-size:13px; background:var(--panel); border:1px solid var(--border); }
  .msg-bubble.admin { background:var(--accent-bg); }
  .msg-bubble-meta { font-size:10px; color:var(--text-secondary); margin-bottom:3px; }
  .msg-bubble textarea.msg-edit { width:100%; min-height:50px; font-size:13px; }
  .msg-compose { display:flex; gap:8px; margin-top:10px; align-items:flex-end; }
  .msg-compose-text { flex:1; min-height:44px; padding:8px; border:1px solid var(--border); border-radius:8px; font-size:13px; font-family:inherit; resize:vertical; }
  .badge-unread { display:inline-block; background:var(--danger); color:#fff; border-radius:20px; min-width:18px; height:18px; padding:0 5px; font-size:10px; font-weight:700; line-height:18px; text-align:center; margin-left:6px; }
</style>

function loadExternalScript(attrs) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    Object.entries(attrs).forEach(([k, v]) => { if (k === 'src') s.src = v; else s.setAttribute(k, v); });
    s.async = true; s.crossOrigin = 'anonymous';
    s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}
function showToast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}
// Barre persistante en bas de l'écran, affichée pendant qu'une opération (sauvegarde,
// approbation, ajout manuel...) est en cours, pour que l'utilisateur sache qu'un enregistrement
// est en train de se faire SANS que la page ne se vide/recharge sous ses yeux. Un compteur
// (saveStatusDepth) gère les opérations qui se chevauchent : la barre ne disparaît que lorsque
// la dernière opération en cours est terminée.
let saveStatusDepth = 0;
function showSaveStatus(msg) {
  saveStatusDepth++;
  const bar = document.getElementById('save-status-bar');
  document.getElementById('save-status-text').textContent = msg || 'Modification en cours…';
  bar.classList.add('visible');
}
function hideSaveStatus() {
  saveStatusDepth = Math.max(0, saveStatusDepth - 1);
  if (saveStatusDepth === 0) document.getElementById('save-status-bar').classList.remove('visible');
}
// Clerk (instance de développement) peut planter avec une erreur interne
// ("detectStore(...) is undefined") si plusieurs appels à Clerk.session.getToken()

// comme dans loadConfiguration()). On regroupe donc tous les appels concurrents sur
// UNE SEULE promesse de jeton, au lieu de laisser chaque appel gql() redemander son
// propre jeton en parallèle.
let _tokenPromise = null;
async function getClerkToken() {
  if (!_tokenPromise) {
    _tokenPromise = Clerk.session.getToken().finally(() => { _tokenPromise = null; });
  }
  return _tokenPromise;
}
async function gql(query, variables) {
  const token = await getClerkToken();
  const res = await fetch('/api/monday', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ query, variables })
  });
  const data = await res.json();
  if (data.errors) throw new Error(data.errors.map(e => e.message).join('; '));
  if (data.error) throw new Error(data.error);
  return data.data;
}
function cvIndex(item) {
  const m = {};
  (item.column_values || []).forEach(c => { m[c.id] = c; });
  return m;
}
function round15(minutes) {
  return Math.round(minutes / 15) * 15;
}
// Formate une Date en "YYYY-MM-DD" en utilisant ses composantes LOCALES (jamais toISOString,
// qui convertit en UTC et peut décaler la date d'un jour selon l'heure/fuseau — c'était la
// cause du bug de sélection de semaine décalée d'une journée).
function toLocalISODate(dt) {
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, '0');
  const day = String(dt.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function mondayOfWeek(d) {
  // Accepte soit un objet Date, soit une chaîne "YYYY-MM-DD" — dans les deux cas on travaille
  // en calendrier LOCAL, jamais via un parsing/format qui passe par UTC.
  const dt = (d instanceof Date) ? new Date(d.getFullYear(), d.getMonth(), d.getDate()) : new Date(d + 'T12:00:00');
  const day = dt.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  dt.setDate(dt.getDate() + diff);
  return toLocalISODate(dt);
}
function fmtWeekLabel(monday) {
  const start = new Date(monday + 'T12:00:00');
  start.setDate(start.getDate() - 1); // dimanche précédent le lundi de la semaine
  const end = new Date(start); end.setDate(end.getDate() + 6); // samedi
  const f = d => d.toLocaleDateString('fr-CA', { day: 'numeric', month: 'short' });
  return `Semaine du ${f(start)} au ${f(end)}`;
}
function hourText(cv) {
  if (!cv || cv.hour == null) return '';
  return String(cv.hour).padStart(2, '0') + ':' + String(cv.minute).padStart(2, '0');
}
function statusBadge(label) {
  const cls = { 'En attente': 'badge-attente', 'Approuvé': 'badge-approuve', 'Rejeté': 'badge-rejete', 'Exporté': 'badge-exporte' }[label] || 'badge-attente';
  return `<span class="badge ${cls}">${label || 'En attente'}</span>`;
}
// Retire l'indicatif "1" en tête (format monday: souvent "1" + 10 chiffres) afin
// de toujours afficher exactement 10 chiffres, sans indicatif.
function formatPhone10(raw) {
  const digits = String(raw || '').replace(/\D/g, '');
  const ten = (digits.length === 11 && digits[0] === '1') ? digits.slice(1) : digits;
  return ten;
}

function weekDatesSunToSat(monday) {
  const start = new Date(monday + 'T12:00:00');
  start.setDate(start.getDate() - 1); // dimanche précédent le lundi de la semaine
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    days.push(toLocalISODate(d));
  }
  return days;
}

  activeProjectsCache = ((data.boards[0] && data.boards[0].items_page.items) || [])

async function saveTacheRow(tr) {
  const tacheId = tr.getAttribute('data-tache');
  const nom = tr.querySelector('.inp-tache-nom').value.trim();
  const ccq = tr.querySelector('.inp-tache-ccq').checked;
  const code = tr.querySelector('.inp-tache-code').value.trim();
  if (!nom) { showToast('Le nom de la tâche est requis.'); return; }
  try {
    await gql(`mutation($board: ID!, $item: ID!, $cv: JSON!) { change_multiple_column_values(board_id: $board, item_id: $item, column_values: $cv) { id } }`,
      { board: String(TACHES_BOARD), item: String(tacheId), cv: JSON.stringify({ name: nom, [TACHE_CCQ]: { checked: ccq ? 'true' : 'false' }, [TACHE_CODE_AVANTAGE]: code }) });
    const t = tachesCache.find(x => x.id === tacheId);
    if (t) { t.name = nom; t.ccq = ccq; t.codeAvantage = code; }
    showToast('Enregistré ✔');
  } catch (err) { showToast('Erreur: ' + err.message); }
}

  el.querySelectorAll('[data-metier]').forEach(card => {

    card.querySelector('.btn-toggle-masque').addEventListener('click', async function () {

          await gql(`mutation($item: ID!) { delete_item(item_id: $item) { id } }`, { item: String(tacheId) });

    const addRow = card.querySelector('.row-add-tache');
    addRow.querySelector('.btn-add-tache').addEventListener('click', async () => {

        const met = metiersCache.find(x => x.id === metId);

  el.querySelectorAll('.inp-rayon').forEach(inp => {
    inp.addEventListener('change', async () => {

      inp.value = val;
      try {
        await gql(`mutation($board: ID!, $item: ID!, $cv: JSON!) { change_multiple_column_values(board_id: $board, item_id: $item, column_values: $cv) { id } }`,
          { board: String(PROJECTS_BOARD), item: String(projId), cv: JSON.stringify({ [PROJECT_RAYON_COL]: val }) });

        if (p) p.rayon = val;

  el.querySelectorAll('.chk-hors-ccq').forEach(chk => {
    chk.addEventListener('change', async () => {
      const tr = chk.closest('tr');
      const projId = tr.getAttribute('data-proj');

        await gql(`mutation($board: ID!, $item: ID!, $cv: JSON!) { change_multiple_column_values(board_id: $board, item_id: $item, column_values: $cv) { id } }`,
          { board: String(PROJECTS_BOARD), item: String(projId), cv: JSON.stringify({ [PROJECT_HORS_CCQ_COL]: { checked: chk.checked ? 'true' : 'false' } }) });
        const p = allProjectsCache.find(x => x.id === projId);
        if (p) p.horsCcq = chk.checked;
        const p2 = activeProjectsCache.find(x => x.id === projId);
        if (p2) p2.horsCcq = chk.checked;
        showToast('Enregistré ✔');
      } catch (err) { showToast('Erreur: ' + err.message); }
    });
  });
}
