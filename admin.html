  return `<tr data-emp="${e.id}" data-clerk="${e.clerkUserId}">
      <td>${e.name}</td>
      <td>${e.titre || '—'}</td>
      <td>${tachesHtml}</td>
      <td>${e.codeAvantage || '—'}</td>
      <td style="max-width:220px;">${e.adresse || '—'}</td>
      <td>${e.phone}</td>
      <td>${e.clerkUserId ? (e.accessEnabled ? '<span class="badge badge-approuve">Actif</span>' : '<span class="badge badge-rejete">Désactivé</span>') : '<span class="badge badge-attente">Aucun compte</span>'}</td>
      <td>
        ${!e.clerkUserId ? (isTermine ? '<span style="color:var(--text-secondary);font-size:12px;">Employé terminé — accès non disponible</span>' : `
          <input type="tel" class="inp-phone" placeholder="Téléphone" value="${e.phone}">
          <input type="password" class="inp-pass" placeholder="Mot de passe (min. 5)">
          <button class="btn btn-primary btn-create">Créer l'accès</button>
        `) : `
          <input type="password" class="inp-newpass" placeholder="Nouveau mot de passe">
          <button class="btn btn-outline btn-reset">Réinitialiser</button>
          <button class="btn ${e.accessEnabled ? 'btn-danger' : 'btn-green'} btn-toggle">${e.accessEnabled ? 'Désactiver' : 'Activer'}</button>
        `}
      </td>
    </tr>`;
}

function renderComptes() {
  const el = document.getElementById('comptes-content');
  const term = (document.getElementById('comptes-search').value || '').trim().toLowerCase();
  const matches = e => !term || [e.name, e.titre, e.codeAvantage, e.adresse, e.phone].join(' ').toLowerCase().includes(term);

  const actifs = employeesCache.filter(e => e.statut === 'Actif' && matches(e));
  const inactifs = employeesCache.filter(e => e.statut === 'Inactif' && matches(e));
  const termines = employeesCache.filter(e => e.statut === 'Terminé' && matches(e));

  let html = `<div class="section-title">Actifs</div>
    <table><thead><tr>${COMPTES_COLS_HEAD}</tr></thead>
    <tbody>${actifs.map(e => comptesRowHtml(e, false)).join('') || '<tr><td colspan="8" class="empty-state">Aucun résultat.</td></tr>'}</tbody></table>

    <div class="section-title">Inactifs</div>
    <table><thead><tr>${COMPTES_COLS_HEAD}</tr></thead>
    <tbody>${inactifs.map(e => comptesRowHtml(e, false)).join('') || '<tr><td colspan="8" class="empty-state">Aucun résultat.</td></tr>'}</tbody></table>

    <details style="margin-top:20px;" ${term ? 'open' : ''}>
      <summary style="cursor:pointer;font-weight:700;font-size:15px;color:var(--text-secondary);">Employés terminés (historique — ${termines.length})</summary>
      <table style="margin-top:10px;"><thead><tr>${COMPTES_COLS_HEAD}</tr></thead>
      <tbody>${termines.map(e => comptesRowHtml(e, true)).join('') || '<tr><td colspan="8" class="empty-state">Aucun résultat.</td></tr>'}</tbody></table>
    </details>`;
  el.innerHTML = html;

  el.querySelectorAll('tr[data-emp]').forEach(tr => {
    const empId = tr.getAttribute('data-emp');
    const clerkUserId = tr.getAttribute('data-clerk');
    const btnCreate = tr.querySelector('.btn-create');
    if (btnCreate) btnCreate.addEventListener('click', async () => {
      const phone = tr.querySelector('.inp-phone').value.trim();
      const pass = tr.querySelector('.inp-pass').value;
      if (!phone || !pass) { showToast('Téléphone et mot de passe requis.'); return; }
      try {
        const empName = tr.children[0].textContent;
        await employeeAdminCall({ action: 'createAccount', employeeItemId: empId, employeeName: empName, phone, password: pass });
        showToast('Compte créé ✔'); loadComptes();
      } catch (err) { showToast('Erreur: ' + err.message); }
    });
    const btnReset = tr.querySelector('.btn-reset');
    if (btnReset) btnReset.addEventListener('click', async () => {
      const pass = tr.querySelector('.inp-newpass').value;
      if (!pass) { showToast('Nouveau mot de passe requis.'); return; }
      try { await employeeAdminCall({ action: 'resetPassword', clerkUserId, password: pass }); showToast('Mot de passe changé ✔'); }
      catch (err) { showToast('Erreur: ' + err.message); }
    });
    const btnToggle = tr.querySelector('.btn-toggle');
    if (btnToggle) btnToggle.addEventListener('click', async () => {
      const emp = employeesCache.find(e => e.id === empId);
      try { await employeeAdminCall({ action: 'setAccess', clerkUserId, employeeItemId: empId, enabled: !emp.accessEnabled }); showToast('Mis à jour ✔'); loadComptes(); }
      catch (err) { showToast('Erreur: ' + err.message); }
    });
  });
}

async function employeeAdminCall(body) {
  const token = await Clerk.session.getToken();
  const res = await fetch('/api/employee-admin', {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('Erreur ' + res.status));
  return data;
}

// directement à la fin des poinçons du jour concerné, dans "Vue par employé" (voir
// renderMessagesSection). Ce cache est chargé une fois par cycle de loadPoinconsForWeek().
async function loadMessagesCache() {
  const data = await gql(`
    query($board: [ID!]) {
      boards(ids: $board) {
        items_page(limit: 300) {
          items { id created_at column_values(ids: ["${M_EMPLOYE}","${M_MESSAGE}","${M_DATE}","${M_STATUT}","${M_REPONSE}","${M_REPONSE_DATE}","${M_AUTEUR}","${M_LU_ADMIN}","${M_LU_EMPLOYE}"]) {
            id text ... on BoardRelationValue { linked_items { id name } }
          } }
        }
      }
    }
  `, { board: [String(MESSAGES_BOARD)] });

  messagesCache = ((data.boards[0] && data.boards[0].items_page.items) || []).map(it => {
    const cv = cvIndex(it);
    const emp = (cv[M_EMPLOYE].linked_items || [])[0] || { id: '', name: '?' };
    return {
      itemId: it.id, empId: emp.id, empName: emp.name,

      reponse: cv[M_REPONSE].text || '', reponseDate: cv[M_REPONSE_DATE].text || '',
      // Messages créés avant l'ajout de la colonne "Auteur" : traités comme envoyés par

      auteur: cv[M_AUTEUR].text || 'Employé',

function todayInMontreal() {
  const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Toronto', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
  const map = {}; parts.forEach(p => { map[p.type] = p.value; });
  return `${map.year}-${map.month}-${map.day}`;
}

let leafletLoaded = false;
let dashboardMap = null;
let dashboardMarkersByEmp = {};
async function ensureLeaflet() {
  if (leafletLoaded) return;
  if (!document.getElementById('leaflet-css')) {
    const link = document.createElement('link');
    link.id = 'leaflet-css'; link.rel = 'stylesheet';
    link.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css';
    document.head.appendChild(link);
  }
  await loadExternalScript({ src: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js' });
  leafletLoaded = true;
}
function parseGps(str) {
  if (!str) return null;
  const parts = String(str).split(',').map(Number);
  if (parts.length !== 2 || !isFinite(parts[0]) || !isFinite(parts[1])) return null;
  return { lat: parts[0], lng: parts[1] };
}

async function loadDashboard() {
  const el = document.getElementById('dashboard-content');
  el.innerHTML = '<div class="empty-state">Chargement…</div>';
  const today = todayInMontreal();
  document.getElementById('dash-label').textContent = new Date(today + 'T12:00:00').toLocaleDateString('fr-CA', { weekday: 'long', day: 'numeric', month: 'long' });

  if (!employeesCache.length) await loadComptes();

  let data;
  try {
    data = await gql(`
      query($poinBoard: ID!, $poinCol: String!, $poinVal: [String]!, $planBoard: ID!, $planCol: String!, $planVal: [String]!) {
        todayPunches: items_page_by_column_values(board_id: $poinBoard, columns: [{ column_id: $poinCol, column_values: $poinVal }], limit: 300) {
          items {
            id
            column_values(ids: ["${P_EMPLOYE}","${P_PROJET}","${P_HDEBUT}","${P_HFIN}","${P_GPS_DEBUT}","${P_GPS_FIN}"]) {
              id text
              ... on BoardRelationValue { linked_items { id name } }
              ... on HourValue { hour minute }
            }
          }
        }
        todayPlanning: items_page_by_column_values(board_id: $planBoard, columns: [{ column_id: $planCol, column_values: $planVal }], limit: 300) {
          items {
            id
            column_values(ids: ["${PL_PROJET}","${PL_MENUISIERS}"]) {
              id text
              ... on BoardRelationValue { linked_item_ids linked_items { id name } }
            }
          }
        }
      }
    `, { poinBoard: String(POINCONS_BOARD), poinCol: P_DATE, poinVal: [today], planBoard: String(PLANNING_BOARD), planCol: PL_DATE, planVal: [today] });
  } catch (err) { el.innerHTML = `<div class="empty-state">Erreur: ${err.message}</div>`; return; }

  const punchItems = ((data.todayPunches && data.todayPunches.items) || []).map(it => {
    const cv = cvIndex(it);
    const emp = (cv[P_EMPLOYE].linked_items || [])[0] || { id: '', name: '?' };
    const proj = (cv[P_PROJET].linked_items || [])[0] || { id: '', name: '?' };
    return {
      itemId: it.id, empId: emp.id, empName: emp.name, projName: proj.name,
      heureDebut: hourText(cv[P_HDEBUT]), heureFin: hourText(cv[P_HFIN]),
      gpsDebut: cv[P_GPS_DEBUT].text || '', gpsFin: cv[P_GPS_FIN].text || '',
      open: !cv[P_HFIN].text
    };
  });

  const empIdsWithOpenPunch = new Set(punchItems.filter(p => p.open).map(p => p.empId));
  const empIdsWithAnyPunch = new Set(punchItems.map(p => p.empId));

  const currentlyPunched = punchItems.filter(p => p.open).sort((a, b) => a.empName.localeCompare(b.empName));

  // "Terminé" = au moins un poinçon fermé aujourd'hui et AUCUN poinçon ouvert présentement.
  const finished = Array.from(empIdsWithAnyPunch).filter(id => !empIdsWithOpenPunch.has(id)).map(id => {
    const closedForEmp = punchItems.filter(p => p.empId === id && !p.open);
    const last = closedForEmp.slice().sort((a, b) => (b.heureFin || '').localeCompare(a.heureFin || ''))[0];
    return last ? { empId: id, empName: last.empName, projName: last.projName, heureFin: last.heureFin, gps: last.gpsFin } : null;
  }).filter(Boolean).sort((a, b) => a.empName.localeCompare(b.empName));

  // Employés planifiés aujourd'hui (tous chantiers) qui n'ont encore aucun poinçon.
  const plannedMap = new Map();
  ((data.todayPlanning && data.todayPlanning.items) || []).forEach(it => {
    const cv = cvIndex(it);
    const proj = (cv[PL_PROJET].linked_items || [])[0] || null;
    const menIds = (cv[PL_MENUISIERS].linked_item_ids || []);
    const menNames = cv[PL_MENUISIERS].linked_items || [];
    menIds.forEach((id, idx) => {
      const key = String(id);
      if (!plannedMap.has(key)) plannedMap.set(key, { empId: key, empName: (menNames[idx] && menNames[idx].name) || '?', projName: proj ? proj.name : '' });
    });
  });
  const plannedNotYetPunched = Array.from(plannedMap.values()).filter(p => !empIdsWithAnyPunch.has(p.empId)).sort((a, b) => a.empName.localeCompare(b.empName));

  const rowHtml = (name, sub) => `<div class="dash-emp-row"><span>${name}</span><span class="proj">${sub}</span></div>`;

  el.innerHTML = `<div class="dashboard-grid">
    <div class="dashboard-lists">
      <div class="card"><h4>🟢 Actuellement poinçonnés (${currentlyPunched.length})</h4>
        <div class="card-body">${currentlyPunched.length ? currentlyPunched.map(p => rowHtml(p.empName, `${p.projName} · depuis ${p.heureDebut}`)).join('') : '<div class="empty-state">Personne actuellement.</div>'}</div>
      </div>
      <div class="card"><h4>🟠 Planifiés aujourd'hui, pas encore poinçonnés (${plannedNotYetPunched.length})</h4>
        <div class="card-body">${plannedNotYetPunched.length ? plannedNotYetPunched.map(p => rowHtml(p.empName, p.projName)).join('') : '<div class="empty-state">Tout le monde a poinçonné.</div>'}</div>
      </div>
      <div class="card"><h4>⚪ Journée terminée (${finished.length})</h4>
        <div class="card-body">${finished.length ? finished.map(p => rowHtml(p.empName, `${p.projName} · fini à ${p.heureFin}`)).join('') : '<div class="empty-state">Personne n\'a encore terminé.</div>'}</div>
      </div>
    </div>
    <div class="card dashboard-map-card">
      <h4>Carte des poinçons du jour</h4>
      <input type="text" id="dash-map-search" list="dash-map-search-list" placeholder="🔎 Rechercher un employé…">
      <datalist id="dash-map-search-list"></datalist>
      <div id="dash-map-search-msg" style="font-size:11px;color:var(--text-secondary);min-height:14px;margin-bottom:4px;"></div>
      <div class="map-legend">
        <span><span class="dot" style="background:#00c875;"></span>Actuellement poinçonné</span>
        <span><span class="dot" style="background:#8b8f9c;"></span>Journée terminée</span>
      </div>
      <div id="dashboard-map"></div>
    </div>
  </div>`;

  // La carte (Leaflet, chargée depuis un CDN) est un "bonus" — si le script ne charge pas
  // (réseau bloqué, CDN inaccessible, etc.), ça ne doit JAMAIS empêcher le reste de
  // l'application (Vue de la semaine, Vue par employé, Vue par projet) de fonctionner.
  try {
    await ensureLeaflet();
    renderDashboardMap(currentlyPunched, finished);
  } catch (err) {
    const mapEl = document.getElementById('dashboard-map');
    if (mapEl) mapEl.outerHTML = '<div class="empty-state">Carte indisponible (problème réseau). Le reste du tableau de bord fonctionne normalement.</div>';
  }
}

function renderDashboardMap(currentlyPunched, finished) {
  const mapEl = document.getElementById('dashboard-map');
  if (!mapEl || typeof L === 'undefined') return;
  dashboardMap = L.map('dashboard-map');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap', maxZoom: 19
  }).addTo(dashboardMap);

  // Conserve un marqueur par employé pour permettre à la recherche de centrer/zoomer dessus.
  dashboardMarkersByEmp = {};
  const bounds = [];
  currentlyPunched.forEach(p => {
    const gps = parseGps(p.gpsDebut);
    if (!gps) return;
    const marker = L.circleMarker([gps.lat, gps.lng], { radius: 8, color: '#0a8a52', fillColor: '#00c875', fillOpacity: 0.9, weight: 2 })
      .addTo(dashboardMap).bindPopup(`<strong>${p.empName}</strong><br>${p.projName}<br>Depuis ${p.heureDebut}`);
    dashboardMarkersByEmp[p.empId] = { marker, name: p.empName, latlng: [gps.lat, gps.lng] };
    bounds.push([gps.lat, gps.lng]);
  });
  finished.forEach(p => {
    const gps = parseGps(p.gps);
    if (!gps) return;
    const marker = L.circleMarker([gps.lat, gps.lng], { radius: 7, color: '#5a5f6d', fillColor: '#8b8f9c', fillOpacity: 0.85, weight: 2 })
      .addTo(dashboardMap).bindPopup(`<strong>${p.empName}</strong><br>${p.projName}<br>Terminé à ${p.heureFin}`);
    dashboardMarkersByEmp[p.empId] = { marker, name: p.empName, latlng: [gps.lat, gps.lng] };
    bounds.push([gps.lat, gps.lng]);
  });

  if (bounds.length) dashboardMap.fitBounds(bounds, { padding: [30, 30] });
  else dashboardMap.setView([45.5019, -73.5674], 10); // Vue par défaut (Montréal) si aucune position GPS

  // --- Recherche d'employé sur la carte ---
  const searchList = document.getElementById('dash-map-search-list');
  if (searchList) {
    searchList.innerHTML = Object.values(dashboardMarkersByEmp).map(m => `<option value="${m.name}"></option>`).join('');
  }
  const searchInput = document.getElementById('dash-map-search');
  const searchMsg = document.getElementById('dash-map-search-msg');
  if (searchInput) {
    const doSearch = () => {
      const term = searchInput.value.trim().toLowerCase();
      if (!term) { searchMsg.textContent = ''; return; }
      const match = Object.values(dashboardMarkersByEmp).find(m => m.name.toLowerCase().includes(term));
      if (match) {
        dashboardMap.setView(match.latlng, 15);
        match.marker.openPopup();
        searchMsg.textContent = '';
      } else {
        searchMsg.textContent = 'Aucun poinçon aujourd\'hui pour cet employé.';
      }
    };
    searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
    searchInput.addEventListener('change', doSearch);
  }
}

// ----- Carte "Vue par employé" / "Vue par projet" (mêmes bases que la carte du Tableau de bord) -----
// Fonction générique : affiche un marqueur par relevé GPS (début ET fin) de chaque poinçon
// fourni, coloré selon le géorepérage (vert = dans la zone, rouge = hors zone, gris = non
// validable — pas d'adresse géolocalisée pour ce projet ou relevé GPS absent), ainsi qu'un
// cercle (rayon toléré, voir Configuration > Restriction de projets) par CHANTIER distinct
// référencé dans les lignes fournies. `labelField` choisit le libellé affiché dans les popups
// des marqueurs ('projName' en vue employé — pour savoir sur quel chantier — ou 'empName' en
// vue projet — pour savoir quel employé). Retourne { map, markers } (markers indexé par
// "itemId_debut"/"itemId_fin", pour permettre aux liens 📍début/fin du tableau de détail de
// centrer la carte dessus — voir wireDetailEvents()) ou null si le conteneur/Leaflet est absent.
function renderPunchMap(elId, rows, labelField) {
  const mapEl = document.getElementById(elId);
  if (!mapEl || typeof L === 'undefined') return null;
  const map = L.map(elId);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap', maxZoom: 19
  }).addTo(map);

  const markers = {};
  const bounds = [];

  // Cercles de rayon toléré — un seul par projet distinct référencé.
  const seenProj = new Set();
  rows.forEach(p => {
    if (!p.projId || seenProj.has(p.projId)) return;
    seenProj.add(p.projId);
    const geo = projectGeoCache[String(p.projId)];
    if (!geo) return;
    L.circle([geo.lat, geo.lng], { radius: geo.radius, color: '#3457d5', weight: 1, fillColor: '#3457d5', fillOpacity: 0.08 })
      .addTo(map)
      .bindPopup(`<strong>${p.projName}</strong><br>Rayon toléré : ${geo.radius} m`);
    bounds.push([geo.lat, geo.lng]);
  });

  const colorForStatus = status => status
    ? (status.ok ? { color: '#0a8a52', fillColor: '#00c875' } : { color: '#a3122f', fillColor: '#df2f4a' })
    : { color: '#5a5f6d', fillColor: '#8b8f9c' };

  rows.forEach(p => {
    const geoStatus = geoStatusForPunch(p);
    const label = p[labelField] || '';
    const posDebut = parseGpsText(p.gpsDebut);
    if (posDebut) {
      const col = colorForStatus(geoStatus.debut);
      const marker = L.circleMarker([posDebut.lat, posDebut.lng], { radius: 7, color: col.color, fillColor: col.fillColor, fillOpacity: 0.9, weight: 2 })
        .addTo(map)
        .bindPopup(`<strong>${label}</strong><br>Début ${p.heureDebut} — ${p.date}${geoStatus.debut ? `<br>≈${geoStatus.debut.distance} m du chantier` : ''}`);
      markers[`${p.itemId}_debut`] = { marker, latlng: [posDebut.lat, posDebut.lng] };
      bounds.push([posDebut.lat, posDebut.lng]);
    }
    const posFin = parseGpsText(p.gpsFin);
    if (posFin) {
      const col = colorForStatus(geoStatus.fin);
      const marker = L.circleMarker([posFin.lat, posFin.lng], { radius: 7, color: col.color, fillColor: col.fillColor, fillOpacity: 0.9, weight: 2 })
        .addTo(map)
        .bindPopup(`<strong>${label}</strong><br>Fin ${p.heureFin} — ${p.date}${geoStatus.fin ? `<br>≈${geoStatus.fin.distance} m du chantier` : ''}`);
      markers[`${p.itemId}_fin`] = { marker, latlng: [posFin.lat, posFin.lng] };
      bounds.push([posFin.lat, posFin.lng]);
    }
  });

  if (bounds.length) map.fitBounds(bounds, { padding: [30, 30] });
  else map.setView([45.5019, -73.5674], 10); // Vue par défaut (Montréal) si aucune position GPS
  return { map, markers };
}
function renderEmployeeMap(rows) {
  const result = renderPunchMap('employee-map', rows, 'projName');
  if (result) { employeeMap = result.map; employeeMapMarkers = result.markers; }
}
function renderProjectMap(rows) {
  const result = renderPunchMap('project-map', rows, 'empName');
  if (result) { projectMap = result.map; projectMapMarkers = result.markers; }
}

// ===================== Export .txt =====================
// La semaine exportée est choisie librement dans #export-week-select, INDÉPENDAMMENT de la
// semaine actuellement affichée dans les autres onglets (Vue de la semaine/par employé/par
// projet) — on va donc chercher les poinçons de la semaine choisie via une requête dédiée,
// plutôt que de dépendre de poinconsCache (qui, lui, suit currentWeek).
function exportWeekOptionsList() {
  // Propose les 26 semaines passées et les 4 semaines à venir à partir d'AUJOURD'HUI, plus la
  // semaine actuellement affichée ailleurs dans l'app (currentWeek) si elle sort de cette plage.
  const weeks = [];
  const seen = new Set();
  const addWeek = monday => { if (!seen.has(monday)) { seen.add(monday); weeks.push(monday); } };
  const base = new Date(mondayOfWeek(new Date()) + 'T12:00:00');
  for (let i = 4; i >= -26; i--) {
    const d = new Date(base); d.setDate(d.getDate() + i * 7);
    addWeek(toLocalISODate(d));
  }
  addWeek(currentWeek);
  return weeks.sort((a, b) => b.localeCompare(a)); // plus récentes en premier
}
function populateExportWeekSelect() {
  const sel = document.getElementById('export-week-select');
  if (!sel) return;
  const previousValue = sel.value;
  const weeks = exportWeekOptionsList();
  sel.innerHTML = weeks.map(w => `<option value="${w}">${fmtWeekLabel(w)}</option>`).join('');
  sel.value = weeks.includes(previousValue) ? previousValue : currentWeek;
}
// Requête légère (colonnes minimales) pour une semaine ARBITRAIRE, sans toucher à poinconsCache.
async function fetchPoinconsForWeek(weekMonday) {
  const data = await gql(`
    query($board: ID!, $col: String!, $val: [String]!) {
      items_page_by_column_values(board_id: $board, columns: [{ column_id: $col, column_values: $val }], limit: 300) {
        items {
          id
          column_values(ids: ["${P_EMPLOYE}","${P_PROJET}","${P_DATE}","${P_STATUT}","${P_TOTAL_AJUSTE}","${P_TACHE}"]) {
            id text
            ... on BoardRelationValue { linked_items { id name } }
          }
        }
      }
    }
  `, { board: String(POINCONS_BOARD), col: P_SEMAINE, val: [weekMonday] });
  return (data.items_page_by_column_values.items || []).map(it => {
    const cv = cvIndex(it);
    const emp = (cv[P_EMPLOYE].linked_items || [])[0] || { id: '', name: '?' };
    const proj = (cv[P_PROJET].linked_items || [])[0] || { id: '', name: '?' };
    return {
      itemId: it.id, empId: emp.id, empName: emp.name, projId: proj.id, projName: proj.name,
      date: cv[P_DATE].text || '', totalAjuste: cv[P_TOTAL_AJUSTE].text || '',
      statut: cv[P_STATUT].text || 'En attente', tache: cv[P_TACHE].text || ''
    };
  });
}
async function refreshExportPendingNote() {
  const el = document.getElementById('export-pending-note');
  const sel = document.getElementById('export-week-select');
  const btn = document.getElementById('btn-export-txt');
  if (!el || !sel) return;
  const weekMonday = sel.value || currentWeek;
  el.innerHTML = '<span style="font-size:12px;color:var(--text-secondary);">Vérification…</span>';
  try {
    const weekPoincons = await fetchPoinconsForWeek(weekMonday);
    const n = weekPoincons.filter(p => !p.statut || p.statut === 'En attente').length;
    if (n > 0) {
      el.innerHTML = `<p style="color:var(--danger);font-size:13px;font-weight:600;">⚠ Il reste ${n} poinçon${n > 1 ? 's' : ''} en attente d'approbation cette semaine — l'export est bloqué tant qu'ils ne sont pas tous approuvés ou rejetés.</p>`;
      if (btn) { btn.disabled = true; btn.style.opacity = '0.5'; btn.style.cursor = 'not-allowed'; }
    } else {
      el.innerHTML = '';
      if (btn) { btn.disabled = false; btn.style.opacity = ''; btn.style.cursor = ''; }
    }
  } catch (err) {
    el.innerHTML = `<p style="color:var(--danger);font-size:12px;">Erreur de vérification: ${err.message}</p>`;
  }
}
// Format de paie "Avantage" — une ligne par poinçon APPROUVÉ de la semaine choisie :
//   RQ<n>,W08,<code entreprise>,SEMP="<code employé, 4 car.>",SDEBUT="<dim. YYYY/MM/DD>",
//   SFIN="<sam. YYYY/MM/DD>",SREG="<heures ajustées>",SCONT="<# Projet Avantage>",
//   SMODNUM="<code Avantage de la Tâche>"
// RQ<n> est une suite numérique (1, 2, 3…) sur l'ensemble des lignes exportées. W08 est un type
// d'export fixe (feuilles de temps), identique sur toutes les lignes peu importe la semaine.
// SDEBUT/SFIN sont le dimanche et le samedi de la semaine de paie CHOISIE — PAS la date du
// poinçon lui-même (comme dans l'exemple fourni par l'utilisateur, ces deux valeurs sont
// identiques sur toutes les lignes du fichier). Fin de ligne CRLF, tel qu'attendu par le système
// de paie (vérifié sur un exemple de fichier réel).
function fmtSlashDate(iso) { return (iso || '').replace(/-/g, '/'); }
function findProjectForExport(projId) {
  return allProjectsCache.find(x => x.id === projId) || activeProjectsCache.find(x => x.id === projId) || null;
}

async function exportTxt() {
  const sel = document.getElementById('export-week-select');
  const weekMonday = (sel && sel.value) || currentWeek;
  const btn = document.getElementById('btn-export-txt');
  if (btn) btn.disabled = true;
  showSaveStatus('Génération du fichier…');
  try {
    const weekPoincons = await fetchPoinconsForWeek(weekMonday);
    const pendingN = weekPoincons.filter(p => !p.statut || p.statut === 'En attente').length;
    if (pendingN > 0) { showToast(`Impossible d'exporter : ${pendingN} poinçon${pendingN > 1 ? 's' : ''} en attente pour cette semaine.`); return; }
    const approved = weekPoincons.filter(p => p.statut === 'Approuvé');
    if (!approved.length) { showToast('Aucun poinçon approuvé pour cette semaine.'); return; }

    // S'assure que tout est chargé même si l'admin arrive directement sur cet onglet — en
    // particulier allProjectsCache (TOUS les projets, pas seulement "en cours" — un poinçon
    // approuvé peut viser un projet devenu Terminé depuis) et le code entreprise.
    if (!configGeneraleLoaded) await loadConfigGenerale();
    if (!allProjectsCache.length) await loadAllProjectsForConfig();
    if (!tachesCache.length) await loadMetiersTaches();
    if (!employeesCache.length) await loadComptes();

    const weekDays = weekDatesSunToSat(weekMonday);
    const sdebut = fmtSlashDate(weekDays[0]);
    const sfin = fmtSlashDate(weekDays[6]);
    const codeEntreprise = configCache.codeEntreprise || '';

    const missing = { emp: new Set(), proj: new Set(), tache: new Set() };
    const lines = approved.map((p, i) => {
      const emp = employeesCache.find(e => e.id === p.empId);
      const proj = findProjectForExport(p.projId);
      const tache = tachesCache.find(t => t.name === p.tache);

      if (!emp || !emp.codeAvantage) missing.emp.add(p.empName || p.empId);
      if (!proj || !proj.numAvantage) missing.proj.add(p.projName || p.projId);
      if (!tache || !tache.codeAvantage) missing.tache.add(p.tache || '(sans tâche)');

      const semp = String((emp && emp.codeAvantage) || '').padStart(4, '0');
      const scont = (proj && proj.numAvantage) || '';
      const smodnum = (tache && tache.codeAvantage) || '';

      return `RQ${i + 1},W08,${codeEntreprise},SEMP="${semp}",SDEBUT="${sdebut}",SFIN="${sfin}",SREG="${p.totalAjuste}",SCONT="${scont}",SMODNUM="${smodnum}"`;
    });

    const blob = new Blob([lines.join('\r\n') + '\r\n'], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${weekDays[6]}.TXT`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);

    const warnings = [];
    if (missing.emp.size) warnings.push(`code employé manquant — ${[...missing.emp].join(', ')}`);
    if (missing.proj.size) warnings.push(`# Projet Avantage manquant — ${[...missing.proj].join(', ')}`);
    if (missing.tache.size) warnings.push(`code Tâche manquant — ${[...missing.tache].join(', ')}`);
    showToast(warnings.length
      ? 'Fichier généré, mais à vérifier : ' + warnings.join(' | ')
      : `Fichier généré ✔ (${lines.length} ligne${lines.length > 1 ? 's' : ''})`);
  } catch (err) {
    showToast('Erreur: ' + err.message);
  } finally {
    hideSaveStatus();
    if (btn) btn.disabled = false;
  }
}

// ===================== Navigation =====================
document.querySelectorAll('nav.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));

    if (btn.dataset.tab === 'config' && !configLoaded) loadConfiguration();
    if (btn.dataset.tab === 'export') { populateExportWeekSelect(); refreshExportPendingNote(); }
  });
});
document.getElementById('dash-refresh').addEventListener('click', loadDashboard);
document.getElementById('config-refresh').addEventListener('click', loadConfiguration);
function goPrevWeek() { const d = new Date(currentWeek + 'T12:00:00'); d.setDate(d.getDate() - 7); currentWeek = mondayOfWeek(d); loadPoinconsForWeek(); }
function goNextWeek() { const d = new Date(currentWeek + 'T12:00:00'); d.setDate(d.getDate() + 7); currentWeek = mondayOfWeek(d); loadPoinconsForWeek(); }
document.getElementById('wk-prev').addEventListener('click', goPrevWeek);
document.getElementById('wk-next').addEventListener('click', goNextWeek);

document.getElementById('wk-next2').addEventListener('click', goNextWeek);

document.getElementById('wk-next3').addEventListener('click', goNextWeek);
document.getElementById('wk-refresh3').addEventListener('click', loadPoinconsForWeek);
document.getElementById('btn-export-txt').addEventListener('click', exportTxt);

// ----- Thème clair/sombre (mémorisé par navigateur, défaut = clair pour cette app) -----
function currentTheme() { return document.documentElement.getAttribute('data-theme') || 'light'; }
function updateThemeToggleIcon() {
  const btn = document.getElementById('theme-toggle');
  if (btn) btn.textContent = currentTheme() === 'dark' ? '☀️' : '🌙';
}
function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem('exactoTheme_punch', theme); } catch (e) { /* navigation privée, tant pis */ }
  updateThemeToggleIcon();
}
document.getElementById('theme-toggle').addEventListener('click', () => setTheme(currentTheme() === 'dark' ? 'light' : 'dark'));
updateThemeToggleIcon();

// ===================== Auth / démarrage =====================
let appStarted = false;
async function initApp() {
  const meta = Clerk.user.publicMetadata || {};
  if (meta.role === 'employee' || meta.role === 'employee_disabled') {
    document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;">⚠ Accès réservé aux administrateurs.</div>';
    return;
  }
  appStarted = true;
  document.getElementById('clerk-signin').classList.add('hidden');
  document.getElementById('app').style.display = 'block';
  // Icône ronde Clerk (avatar + menu incluant "Se déconnecter"), même patron que index.html —
  // remplace l'ancien bouton texte "Déconnexion".
  const btnEl = document.getElementById('clerk-user-button');
  if (btnEl && !btnEl.dataset.mounted) {
    Clerk.mountUserButton(btnEl, { appearance: { elements: { userButtonAvatarBox: { width: '30px', height: '30px' } } } });
    btnEl.dataset.mounted = '1';
  }
  const nameEl = document.getElementById('clerk-user-name');
  if (nameEl) nameEl.textContent = Clerk.user.fullName || Clerk.user.firstName || (Clerk.user.primaryEmailAddress && Clerk.user.primaryEmailAddress.emailAddress) || '';
  // Le Tableau de bord ne doit JAMAIS empêcher le reste de l'app de charger — s'il échoue pour
  // une raison quelconque (réseau, CDN, etc.), on l'affiche en erreur mais on continue.
  try {
    await loadDashboard();
  } catch (err) {
    const el = document.getElementById('dashboard-content');
    if (el) el.innerHTML = `<div class="empty-state">Erreur de chargement du tableau de bord: ${err.message}</div>`;
  }
  await loadPoinconsForWeek();
}

async function boot() {
  const clerkDomain = atob(CLERK_PUBLISHABLE_KEY.split('_')[2]).slice(0, -1);
  await loadExternalScript({ src: `https://${clerkDomain}/npm/@clerk/ui@1/dist/ui.browser.js` });
  await loadExternalScript({ src: `https://${clerkDomain}/npm/@clerk/clerk-js@6/dist/clerk.browser.js`, 'data-clerk-publishable-key': CLERK_PUBLISHABLE_KEY });
  await window.Clerk.load({ ui: { ClerkUI: window.__internal_ClerkUICtor } });
  // IMPORTANT : Clerk redéclenche périodiquement ce callback (rafraîchissement de session en
  // arrière-plan), même sans changement réel d'utilisateur. Sans le garde-fou `appStarted`,
  // ça relançait loadPoinconsForWeek() en boucle (~toutes les 30s) et vidait la page en plein
  // travail. On n'initialise donc qu'une seule fois, à la vraie connexion.
  window.Clerk.addListener(({ user }) => { if (user && !appStarted) initApp(); });
  if (window.Clerk.user) { initApp(); }
  else { window.Clerk.mountSignIn(document.getElementById('clerk-signin'), { appearance: { elements: { rootBox: { width: '100%' } } } }); }
}
boot();
