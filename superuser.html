<!DOCTYPE html>
<!--
  superuser.html — "Gestion des entreprises" (Superuser, gestion de plateforme multi-tenant).

  Page entièrement séparée d'admin.html / planif.html / punch.html — ne modifie et ne dépend
  d'aucun de ces fichiers. Réservée aux comptes Clerk avec le rôle personnalisé "superuser"
  (voir Plan-Technique-Multi-Entite-Exacto.md, section 4 et 6).

  Rappel important (bootstrap) : le tout premier compte superuser doit être créé manuellement
  dans le dashboard Clerk (Users → sélectionner le compte dédié → Metadata → public metadata →
  ajouter { "role": "superuser" }). Cette page ne peut pas créer son propre premier accès.
-->
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exacto — Gestion des entreprises</title>
<style>
  :root {
    --accent:#3b63ff; --accent-dark:#2547cc; --accent-bg:#e8edff;
    --bg:#f4f6fb; --panel:#ffffff; --panel-alt:#eef2fa; --border:#dde4f0;
    --text:#0b1e3d; --text-secondary:#5b6b85;
    --danger:#d64545; --danger-bg:#fbe7e7; --ok:#1f9d55; --ok-bg:#e6f7ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent:#5b82ff; --accent-dark:#a9bdff; --accent-bg:#16264a;
      --bg:#0d1b30; --panel:#142a4a; --panel-alt:#1b3255; --border:#2a4066;
      --text:#eaf0fb; --text-secondary:#9db0d1;
      --danger:#ff7a7a; --danger-bg:#3a1d24; --ok:#5fd88f; --ok-bg:#173926;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; justify-content:space-between; padding:14px 22px; background:var(--panel); border-bottom:1px solid var(--border); }
  header h1 { font-size:17px; margin:0; }
  header .sub { font-size:12px; color:var(--text-secondary); margin-top:2px; }
  main { max-width:980px; margin:0 auto; padding:22px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:18px; margin-bottom:20px; }
  .card h2 { font-size:15px; margin:0 0 14px; }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:8px 10px; border-bottom:1px solid var(--border); font-size:13px; text-align:left; vertical-align:middle; }
  th { background:var(--panel-alt); color:var(--text-secondary); font-weight:600; }
  .badge { display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:700; }
  .badge-active { background:var(--ok-bg); color:var(--ok); }
  .badge-suspended { background:var(--danger-bg); color:var(--danger); }
  .flag-on { color:var(--ok); font-weight:700; }
  .flag-off { color:var(--text-secondary); }
  form.inline-form { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; }
  form.inline-form label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--text-secondary); }
  input[type=text], input[type=email], input[type=password], select {
    padding:7px 9px; border:1px solid var(--border); border-radius:6px; font-size:13px; background:var(--panel); color:var(--text); min-width:160px;
  }
  .checkline { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text); }
  button { border:none; border-radius:7px; padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-outline { background:var(--panel); border:1px solid var(--border); color:var(--text); }
  .btn-danger { background:var(--danger-bg); color:var(--danger); }
  .btn-sm { padding:5px 9px; font-size:12px; }
  .row-actions { display:flex; gap:6px; flex-wrap:wrap; }
  .empty-state { color:var(--text-secondary); padding:24px; text-align:center; font-size:13px; }
  .toast { position:fixed; bottom:20px; right:20px; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:10px 16px; font-size:13px; box-shadow:0 4px 16px rgba(0,0,0,.15); z-index:999; }
  .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; z-index:100; }
  .modal-box { background:var(--panel); border-radius:10px; padding:20px; width:360px; max-width:92vw; }
  .modal-box h3 { margin:0 0 12px; font-size:14px; }
  .modal-box label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--text-secondary); margin-bottom:10px; }
  .modal-box input { width:100%; }
  .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }
  .hidden { display:none !important; }
  #clerk-signin { max-width:400px; margin:60px auto; }
</style>
</head>
<body>

<div id="clerk-signin"></div>

<div id="app" class="hidden">
  <header>
    <div>
      <h1>🏢 Gestion des entreprises</h1>
      <div class="sub">Exacto — Superuser</div>
    </div>
    <div id="clerk-user-button"></div>
  </header>

  <main>
    <div class="card">
      <h2>Nouvelle entreprise</h2>
      <form id="form-create-tenant" class="inline-form">
        <label>Nom
          <input type="text" id="ct-name" required placeholder="Ex. Construction ABC">
        </label>
        <label>Identifiant (slug)
          <input type="text" id="ct-slug" placeholder="généré automatiquement">
        </label>
        <label class="checkline" style="padding-bottom:8px;">
          <input type="checkbox" id="ct-ccq"> Entreprise de la construction (CCQ)
        </label>
        <label class="checkline" style="padding-bottom:8px;">
          <input type="checkbox" id="ct-primes"> Gestion de primes applicables
        </label>
        <label>Logiciel de paie
          <select id="ct-payroll">
            <option value="">— Aucun —</option>
            <option value="avantage">Export Avantage</option>
          </select>
        </label>
        <button type="submit" class="btn-primary">Créer l'entreprise</button>
      </form>
    </div>

    <div class="card">
      <h2>Entreprises (tenants)</h2>
      <div id="tenants-table"><div class="empty-state">Chargement…</div></div>
    </div>
  </main>
</div>

<div id="modal-host"></div>

<script>
const CLERK_PUBLISHABLE_KEY = 'pk_live_Y2xlcmsuZXhhY3RvYXBwLmNhJA';

function loadExternalScript(attrs) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    Object.entries(attrs).forEach(([k, v]) => { if (k === 'src') s.src = v; else s.setAttribute(k, v); });
    s.async = true; s.crossOrigin = 'anonymous';
    s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}
function showToast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function slugifyClient(str) {
  return String(str || '').toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}

async function callApi(action, body) {
  const token = await Clerk.session.getToken();
  const res = await fetch('/api/superuser-tenants', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify(Object.assign({ action }, body || {}))
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('Erreur ' + res.status));
  return data;
}

let tenantsCache = [];

async function loadTenants() {
  const el = document.getElementById('tenants-table');
  try {
    const { tenants } = await callApi('list');
    tenantsCache = tenants;
    renderTenants(tenants);
  } catch (err) {
    el.innerHTML = `<div class="empty-state">Erreur: ${escapeHtml(err.message)}</div>`;
  }
}

function renderTenants(tenants) {
  const el = document.getElementById('tenants-table');
  if (!tenants.length) { el.innerHTML = '<div class="empty-state">Aucune entreprise pour l\'instant.</div>'; return; }
  el.innerHTML = `
    <table>
      <thead><tr>
        <th>Nom</th><th>Identifiant</th><th>Statut</th><th>CCQ</th><th>Primes</th><th>Paie</th><th></th>
      </tr></thead>
      <tbody>
        ${tenants.map(t => {
          const s = t.settings || {};
          return `<tr data-id="${t.id}">
            <td>${escapeHtml(t.name)}</td>
            <td>${escapeHtml(t.slug)}</td>
            <td><span class="badge ${t.status === 'active' ? 'badge-active' : 'badge-suspended'}">${t.status === 'active' ? 'Active' : 'Suspendue'}</span></td>
            <td class="${s.ccqEnabled ? 'flag-on' : 'flag-off'}">${s.ccqEnabled ? '✓' : '—'}</td>
            <td class="${s.primesEnabled ? 'flag-on' : 'flag-off'}">${s.primesEnabled ? '✓' : '—'}</td>
            <td>${s.payrollSoftware === 'avantage' ? 'Avantage' : '—'}</td>
            <td class="row-actions">
              <button class="btn-outline btn-sm" data-act="admin" data-id="${t.id}">+ Admin</button>
              <button class="btn-outline btn-sm" data-act="toggle" data-id="${t.id}" data-status="${t.status}">${t.status === 'active' ? 'Suspendre' : 'Activer'}</button>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  `;
  el.querySelectorAll('[data-act="toggle"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const next = btn.dataset.status === 'active' ? 'suspended' : 'active';
      btn.disabled = true;
      try {
        await callApi('setStatus', { tenantId: id, status: next });
        showToast('Statut mis à jour.');
        await loadTenants();
      } catch (err) { showToast('Erreur: ' + err.message); btn.disabled = false; }
    });
  });
  el.querySelectorAll('[data-act="admin"]').forEach(btn => {
    btn.addEventListener('click', () => openCreateAdminModal(btn.dataset.id));
  });
}

function openCreateAdminModal(tenantId) {
  const tenant = tenantsCache.find(t => t.id === tenantId);
  const host = document.getElementById('modal-host');
  host.innerHTML = `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal-box">
        <h3>Premier accès admin — ${escapeHtml(tenant ? tenant.name : '')}</h3>
        <form id="form-create-admin">
          <label>Nom<input type="text" id="ca-name" required></label>
          <label>Courriel<input type="email" id="ca-email" required></label>
          <label>Mot de passe temporaire<input type="password" id="ca-password" required minlength="5"></label>
          <div class="modal-actions">
            <button type="button" class="btn-outline" id="ca-cancel">Annuler</button>
            <button type="submit" class="btn-primary">Créer l'accès</button>
          </div>
        </form>
      </div>
    </div>
  `;
  document.getElementById('ca-cancel').addEventListener('click', () => host.innerHTML = '');
  document.getElementById('modal-backdrop').addEventListener('click', (e) => { if (e.target.id === 'modal-backdrop') host.innerHTML = ''; });
  document.getElementById('form-create-admin').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('ca-name').value.trim();
    const email = document.getElementById('ca-email').value.trim();
    const password = document.getElementById('ca-password').value;
    try {
      await callApi('createFirstAdmin', { tenantId, name, email, password });
      showToast('Accès admin créé — mot de passe à réinitialiser à la première connexion.');
      host.innerHTML = '';
    } catch (err) { showToast('Erreur: ' + err.message); }
  });
}

document.getElementById('ct-name').addEventListener('input', (e) => {
  const slugField = document.getElementById('ct-slug');
  if (!slugField.dataset.touched) slugField.value = slugifyClient(e.target.value);
});
document.getElementById('ct-slug').addEventListener('input', (e) => { e.target.dataset.touched = '1'; });

document.getElementById('form-create-tenant').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('ct-name').value.trim();
  const slug = document.getElementById('ct-slug').value.trim();
  const ccqEnabled = document.getElementById('ct-ccq').checked;
  const primesEnabled = document.getElementById('ct-primes').checked;
  const payrollSoftware = document.getElementById('ct-payroll').value || null;
  try {
    await callApi('create', { name, slug, ccqEnabled, primesEnabled, payrollSoftware });
    showToast('Entreprise créée.');
    e.target.reset();
    document.getElementById('ct-slug').dataset.touched = '';
    await loadTenants();
  } catch (err) { showToast('Erreur: ' + err.message); }
});

// ===================== Auth / démarrage =====================
async function initApp() {
  const meta = Clerk.user.publicMetadata || {};
  if (meta.role !== 'superuser') {
    document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;">⚠ Accès réservé aux comptes superuser (gestion de plateforme).</div>';
    return;
  }
  document.getElementById('clerk-signin').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  const btnEl = document.getElementById('clerk-user-button');
  Clerk.mountUserButton(btnEl, { appearance: { elements: { userButtonAvatarBox: { width: '30px', height: '30px' } } } });
  await loadTenants();
}

let appStarted = false;
async function boot() {
  const clerkDomain = atob(CLERK_PUBLISHABLE_KEY.split('_')[2]).slice(0, -1);
  await loadExternalScript({ src: `https://${clerkDomain}/npm/@clerk/ui@1/dist/ui.browser.js` });
  await loadExternalScript({ src: `https://${clerkDomain}/npm/@clerk/clerk-js@6/dist/clerk.browser.js`, 'data-clerk-publishable-key': CLERK_PUBLISHABLE_KEY });
  await window.Clerk.load({ ui: { ClerkUI: window.__internal_ClerkUICtor } });
  window.Clerk.addListener(({ user }) => { if (user && !appStarted) { appStarted = true; initApp(); } });
  if (window.Clerk.user) { appStarted = true; initApp(); }
  else { window.Clerk.mountSignIn(document.getElementById('clerk-signin'), { appearance: { elements: { rootBox: { width: '100%' } } } }); }
}
boot();
</script>
</body>
</html>
