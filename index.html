<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exacto-Finance — Bons de commande</title>
<link rel="icon" type="image/png" href="/exacto-icon.png">
<style>
  :root {
    --bg:#f3f5fa; --panel:#ffffff; --border:#dbe1ee; --text:#17223b; --muted:#6a7691;
    --accent:#2f5bea; --accent-dark:#2347c0; --accent-soft:#e8eeff; --ok:#12805c; --ok-soft:#dff5ec;
    --warn:#a96100; --warn-soft:#fff1d9; --bad:#c0263d; --bad-soft:#fde4e8; --grey-soft:#e9ecf3;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif; font-size:14px; }
  .hidden { display:none !important; }
  header { background:#fff; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:18px; padding:0 22px; height:58px; position:sticky; top:0; z-index:20; }
  header img.logo { height:30px; }
  header .app-name { font-weight:700; font-size:16px; color:var(--text); border-left:1px solid var(--border); padding-left:16px; }
  nav { display:flex; gap:4px; margin-left:12px; }
  nav button { background:none; border:none; padding:8px 14px; border-radius:7px; font-size:14px; font-weight:600; color:var(--muted); cursor:pointer; }
  nav button.active { background:var(--accent-soft); color:var(--accent-dark); }
  nav a { padding:8px 14px; border-radius:7px; font-size:14px; font-weight:600; color:var(--muted); text-decoration:none; }
  nav a:hover { background:#f4f6fb; }
  .spacer { flex:1; }
  #clerk-account { display:flex; align-items:center; gap:8px; }
  #clerk-user-name { font-size:12.5px; color:var(--muted); font-weight:600; }
  main { max-width:1280px; margin:0 auto; padding:22px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin-bottom:14px; }
  .stat { background:#fff; border:1px solid var(--border); border-radius:10px; padding:10px 14px; } .stat.click { cursor:pointer; } .stat.click:hover { border-color:var(--accent); }
  .stat .lbl { font-size:12px; color:var(--muted); font-weight:600; } .stat .val { font-size:20px; font-weight:800; margin:2px 0; } .stat .sub { font-size:12.5px; color:var(--muted); } .stat.hot { border-color:var(--accent); background:var(--accent-soft); } .stat.zero { opacity:.55; }
  th[data-sort] { cursor:pointer; user-select:none; } th[data-sort]:hover { color:var(--accent-dark); } .sarr { font-size:10px; }
  .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .toolbar input[type=search], .toolbar select { height:36px; border:1px solid var(--border); border-radius:8px; padding:0 11px; background:#fff; font-size:14px; }
  .toolbar input[type=search] { width:280px; }
  button.btn { height:36px; padding:0 15px; border-radius:8px; border:1px solid var(--border); background:#fff; font-weight:600; font-size:14px; cursor:pointer; color:var(--text); }
  button.btn:hover { background:#f4f6fb; }
  button.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.btn.primary:hover { background:var(--accent-dark); }
  button.btn.danger { color:var(--bad); border-color:#f0b9c2; }
  button.btn:disabled { opacity:.5; cursor:not-allowed; }
  button.btn.small { height:30px; padding:0 11px; font-size:13px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; }
  table.list { width:100%; border-collapse:collapse; }
  table.list th { text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:11px 14px; border-bottom:1px solid var(--border); background:#fafbfe; }
  table.list td { padding:11px 14px; border-bottom:1px solid #eef1f7; vertical-align:middle; }
  table.list tr.row { cursor:pointer; }
  table.list tr.row:hover td { background:#f7f9ff; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:700; white-space:nowrap; }
  .b-brouillon { background:var(--grey-soft); color:#4c5670; }
  .b-envoye { background:var(--accent-soft); color:var(--accent-dark); }
  .b-vu { background:var(--warn-soft); color:var(--warn); }
  .b-signe { background:var(--ok-soft); color:var(--ok); }
  .b-annule { background:var(--bad-soft); color:var(--bad); }
  .muted { color:var(--muted); }
  .empty { padding:46px 20px; text-align:center; color:var(--muted); }
  /* Modales */
  .overlay { position:fixed; inset:0; background:rgba(14,22,43,.5); z-index:50; display:flex; align-items:flex-start; justify-content:center; overflow:auto; padding:30px 14px; }
  .modal { background:#fff; border-radius:14px; width:100%; max-width:960px; box-shadow:0 20px 60px rgba(0,0,0,.3); }
  .modal.narrow { max-width:560px; }
  .modal.wide { max-width:1100px; }
  .modal-head { display:flex; align-items:center; gap:12px; padding:16px 22px; border-bottom:1px solid var(--border); }
  .modal-head h2 { margin:0; font-size:18px; flex:1; }
  .modal-body { padding:18px 22px; }
  .modal-foot { padding:14px 22px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; background:#fafbfe; border-radius:0 0 14px 14px; }
  .x { background:none; border:none; font-size:22px; cursor:pointer; color:var(--muted); line-height:1; }
  .grid { display:grid; gap:12px 14px; }
  .g2 { grid-template-columns:1fr 1fr; }
  .g3 { grid-template-columns:1fr 1fr 1fr; }
  .g4 { grid-template-columns:1.2fr 1.2fr 1fr 1.6fr; }
  label.f { display:flex; flex-direction:column; gap:4px; font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; position:relative; }
  label.f input, label.f select, label.f textarea { border:1px solid var(--border); border-radius:8px; padding:0 10px; height:36px; font-size:14px; font-weight:400; color:var(--text); text-transform:none; letter-spacing:0; background:#fff; font-family:inherit; }
  label.f textarea { height:auto; padding:8px 10px; resize:vertical; line-height:1.4; }
  label.f input:disabled { background:#f1f3f8; color:#566; }
  label.f input:focus, label.f textarea:focus { outline:2px solid var(--accent-soft); border-color:var(--accent); }
  h3.sec { margin:20px 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent-dark); border-bottom:1px solid var(--border); padding-bottom:6px; }
  h3.sec:first-child { margin-top:0; }
  .suggest { position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid var(--border); border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,.15); z-index:60; max-height:260px; overflow:auto; margin-top:2px; }
  .suggest div { padding:8px 12px; cursor:pointer; text-transform:none; letter-spacing:0; font-weight:400; color:var(--text); font-size:14px; }
  .suggest div:hover, .suggest div.sel { background:var(--accent-soft); }
  .suggest small { color:var(--muted); margin-left:8px; }
  .suggest .none { color:var(--muted); cursor:default; }
  table.lines { width:100%; border-collapse:collapse; }
  table.lines th { font-size:11.5px; text-transform:uppercase; color:var(--muted); text-align:left; padding:4px 6px; }
  table.lines td { padding:3px 4px; vertical-align:top; }
  table.lines input, table.lines textarea { width:100%; border:1px solid var(--border); border-radius:7px; padding:6px 8px; font-size:14px; font-family:inherit; }
  table.lines textarea { resize:vertical; min-height:34px; }
  table.lines td.sub { text-align:right; padding-top:9px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .totals { margin-left:auto; width:300px; margin-top:12px; font-variant-numeric:tabular-nums; }
  .totals div { display:flex; justify-content:space-between; padding:3px 0; }
  .totals .tot { font-weight:700; font-size:16px; border-top:1px solid var(--border); margin-top:4px; padding-top:7px; }
  .note { background:var(--accent-soft); border-radius:8px; padding:9px 12px; font-size:13px; color:var(--accent-dark); }
  .warn { background:var(--warn-soft); color:var(--warn); border-radius:8px; padding:9px 12px; font-size:13px; }
  .err { background:var(--bad-soft); color:var(--bad); border-radius:8px; padding:9px 12px; font-size:13px; }
  .kv { display:grid; grid-template-columns:170px 1fr; gap:6px 12px; font-size:14px; }
  .kv .k { color:var(--muted); font-weight:600; }
  ul.timeline { list-style:none; margin:0; padding:0; font-size:13px; }
  ul.timeline li { padding:6px 0 6px 16px; border-left:2px solid var(--border); position:relative; }
  ul.timeline li:before { content:''; position:absolute; left:-5px; top:11px; width:8px; height:8px; border-radius:50%; background:var(--accent); }
  #toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:#17223b; color:#fff; padding:11px 18px; border-radius:9px; z-index:100; font-size:14px; max-width:90vw; box-shadow:0 8px 30px rgba(0,0,0,.3); }
  #toast.error { background:var(--bad); }
  #boot, #auth-gate { display:flex; justify-content:center; padding:80px 20px; color:var(--muted); }
  .spin { display:inline-block; width:15px; height:15px; border:2px solid #c9d3ee; border-top-color:var(--accent); border-radius:50%; animation:sp .7s linear infinite; vertical-align:-3px; margin-right:6px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  textarea.terms { width:100%; min-height:360px; border:1px solid var(--border); border-radius:8px; padding:12px; font-family:Consolas,'Courier New',monospace; font-size:13px; line-height:1.45; }
  iframe.preview { width:100%; height:78vh; border:none; }
  @media (max-width:760px) { .g2,.g3,.g4 { grid-template-columns:1fr; } .toolbar input[type=search] { width:100%; } table.list th:nth-child(n+6), table.list td:nth-child(n+6) { display:none; } }

  nav.nav-right { margin-left:0; }
  .subnav { display:flex; gap:6px; padding:6px 22px; background:#f4f6fb; border-bottom:1px solid var(--border); }
  .subnav a { font-size:12.5px; font-weight:600; padding:4px 11px; border-radius:6px; color:var(--muted); text-decoration:none; }
  .subnav a:hover { background:#e9eef8; } .subnav a.active { background:#fff; color:var(--accent-dark); box-shadow:0 0 0 1px var(--border); }
  .grp-toggle { display:flex; align-items:center; gap:6px; font-size:13.5px; font-weight:600; cursor:pointer; user-select:none; white-space:nowrap; } .grp-toggle input { width:16px; height:16px; accent-color:var(--accent); }
  .proj-sec { margin-bottom:24px; } .proj-sec > h2 { font-size:17px; margin:0 0 8px; display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; } .proj-sec > h2 small { font-size:12.5px; font-weight:600; color:var(--muted); }
  tr.pgrp td { background:#eaf0fb; font-weight:800; font-size:13.5px; color:var(--text); border-top:2px solid #cfd9ee; }
  tr.pgrp td small { font-weight:600; color:var(--muted); margin-left:8px; }
 .proj-sec > h2 { cursor:pointer; user-select:none; } .proj-sec > h2::before { content:'▾'; font-size:14px; color:var(--muted); width:14px; } .proj-sec.collapsed > h2::before { content:'▸'; } .proj-sec.collapsed > :not(h2) { display:none !important; } .proj-sec.collapsed { margin-bottom:8px; }
  tr.pgrp td { cursor:pointer; user-select:none; } tr.pgrp td::before { content:'▾ '; color:var(--muted); } tr.pgrp.pg-c td::before { content:'▸ '; } tr.pg-hid { display:none !important; }
  .stack-prog { font-size:13px; color:var(--muted); margin:6px 0 14px; }
  /* ===== Mobile (téléphone) ===== */
  @media (max-width:760px) {
    html,body { font-size:15px; -webkit-text-size-adjust:100%; }
    header { flex-wrap:wrap; height:auto; padding:8px 12px 0; gap:6px 10px; }
    header img.logo { height:26px; }
    header .app-name { font-size:15px; padding-left:10px; flex:1; border-left:1px solid var(--border); }
    header .spacer { display:none; }
    #clerk-user-name { display:none; }
    header nav:not(.nav-right) { order:5; width:100%; margin:0 -12px; padding:4px 12px 8px; overflow-x:auto; flex-wrap:nowrap; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    header nav:not(.nav-right)::-webkit-scrollbar { display:none; }
    header nav a { white-space:nowrap; padding:8px 13px; font-size:14px; }
    #nav-dash, #nav-av, #nav-def, #nav-sch, nav.nav-right { display:none !important; }
    .subnav { padding:6px 12px; overflow-x:auto; }
    main { padding:12px; }
    .toolbar { gap:8px; }
    .toolbar > * { flex:1 1 140px; min-width:0; }
    .toolbar input[type=search], .toolbar select, .toolbar .btn { width:100%; }
    .toolbar .spacer { display:none; }
    input, select, textarea { font-size:16px !important; }
    button.btn { height:40px; }
    button.btn.small, .btn.sm { height:34px; }
    .stats { grid-template-columns:1fr 1fr !important; gap:8px; }
    .stat { padding:9px 11px; } .stat .val { font-size:17px; }
    .g2,.g3,.g4,.cards,.iv-grid { grid-template-columns:1fr !important; }
    .kv { grid-template-columns:1fr; gap:2px 0; } .kv .k { margin-top:6px; }
    .card.pad { padding:13px; }
    /* Tableaux -> cartes */
    table.list, table.list tbody { display:block; width:100%; }
    table.list thead { display:none; }
    table.list tr { display:block; }
    table.list tr.row, table.list tr[data-id] { background:#fff; border:1px solid var(--border); border-radius:12px; margin:0 0 10px; padding:6px 12px; box-shadow:0 1px 2px rgba(23,34,59,.04); }
    table.list tr.row:active { background:#f4f7ff; }
    table.list td, table.list th:not(:empty) { display:flex !important; justify-content:space-between; align-items:center; gap:12px; padding:6px 0 !important; border-bottom:1px dashed #e8ecf5; text-align:right; }
    table.list tr.row td:last-child { border-bottom:none; }
    table.list td[data-l]:before { content:attr(data-l); color:var(--muted); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; text-align:left; flex:none; }
    table.list td:empty { display:none !important; }
    table.list td.num { text-align:right; }
    table.list tr.pgrp { margin:14px 0 6px; } table.list tr.pgrp td { display:block !important; border:none; border-radius:8px; padding:9px 12px !important; text-align:left; }
    table.list td input[type=checkbox] { width:20px; height:20px; }
    /* Modales plein écran */
    .overlay { padding:0; }
    .modal, .modal.narrow, .modal.xl { max-width:100%; min-height:100vh; border-radius:0; box-shadow:none; }
    .modal-head { padding:12px 14px; position:sticky; top:0; background:#fff; z-index:2; border-radius:0; }
    .modal-head h2 { font-size:16px; }
    .modal-body { padding:12px 14px; overflow-x:auto; }
    .modal-foot { padding:10px 14px; position:sticky; bottom:0; border-radius:0; }
    .modal-foot .btn { flex:1 1 auto; }
    table.entry, table.lines { font-size:12.5px; }
    .viewer iframe { height:55vh; }
    #toast { bottom:14px; width:calc(100% - 24px); text-align:center; }
    .proj-head h1 { font-size:18px; }
  }
  .dz { border:2px dashed #b9c6ea; border-radius:10px; padding:14px; background:#fafcff; text-align:center; transition:background .15s,border-color .15s; }
  .dz.over { background:var(--accent-soft); border-color:var(--accent); }
.navbadge { display:inline-block; min-width:18px; padding:0 5px; margin-left:6px; border-radius:9px; background:#d93025; color:#fff; font-size:11px; font-weight:800; line-height:18px; text-align:center; vertical-align:middle; }
</style>
</head>

<script>
/* =====================================================================
   Exacto-Finance — Étape A : bons de commande
   Authentification Clerk (même instance que Planif / Punch). Chaque appel envoie le jeton de
   session à /api/finance, qui le vérifie côté serveur. La clé ci-dessous est la clé PUBLIQUE
   Clerk (conçue pour être visible côté client).
   ===================================================================== */
const CLERK_PUBLISHABLE_KEY = 'pk_live_Y2xlcmsuZXhhY3RvYXBwLmNhJA';
let clerkInstance = null, appStarted = false;

const S = { me: null, projects: [], suppliers: [], pos: [], terms: null, cur: null };

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function money(n) { { const v = Number(n || 0); return (v < 0 ? '-' : '') + '$' + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }; }
function fmtDate(d) { if (!d) return ''; const m = String(d).slice(0, 10).match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? m[3] + '/' + m[2] + '/' + m[1] : String(d); }
function fmtDT(d) { if (!d) return ''; try { return new Date(d).toLocaleString('fr-CA', { timeZone: 'America/Toronto', dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { return String(d); } }
function round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }

let toastTimer = null;
window.__navigating = false;
(function () {
  const st = document.createElement('style');
  st.textContent = '#topbar{position:fixed;left:0;top:0;height:3px;width:0;background:#3860f8;z-index:9999;opacity:0;pointer-events:none;transition:width .4s ease,opacity .2s}#topbar.on{opacity:1;width:80%;transition:width 3s cubic-bezier(.1,.7,.2,1)}';
  document.head.appendChild(st);
  const bar = document.createElement('div'); bar.id = 'topbar'; document.body.appendChild(bar);
  let pend = 0, tm = null, lastUser = 0;
  ['pointerdown', 'keydown'].forEach(function (ev) { document.addEventListener(ev, function () { lastUser = Date.now(); }, true); });
  const _f = window.fetch;
  window.fetch = function (u) {
    const isApi = typeof u === 'string' && u.indexOf('/api/') === 0 && (Date.now() - lastUser < 1500);
    if (isApi) { pend++; clearTimeout(tm); tm = setTimeout(function () { if (pend > 0) { bar.classList.add('on');  } }, 120); }
    const p = _f.apply(this, arguments);
    if (isApi) { const done = function () { if (--pend <= 0) { pend = 0; clearTimeout(tm); bar.style.width = '100%'; setTimeout(function () { bar.classList.remove('on'); bar.style.width = ''; }, 200); } }; p.then(done, done); }
    return p;
  };
})();
['beforeunload', 'pagehide'].forEach(function (ev) { window.addEventListener(ev, function () { window.__navigating = true; }); });
window.addEventListener('pageshow', function () { window.__navigating = false; });
document.addEventListener('click', function (ev) {
  const a = ev.target.closest && ev.target.closest('a[href]');
  if (!a || a.target || a.hasAttribute('download') || ev.ctrlKey || ev.metaKey || ev.shiftKey || a.origin !== location.origin) return;
  const h = a.getAttribute('href') || ''; if (!h || h[0] === '#') return;
  window.__navigating = true; setTimeout(function () { window.__navigating = false; }, 4000);
}, true);

/* ---------- Clerk ---------- */
function loadExternalScript(attrs) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    Object.keys(attrs).forEach(k => s.setAttribute(k, attrs[k]));
    s.crossOrigin = 'anonymous'; s.onload = resolve;
    s.onerror = () => reject(new Error('Échec de chargement: ' + attrs.src));
    document.head.appendChild(s);
  });
}
async function initClerkAuth() {
  const clerkDomain = atob(CLERK_PUBLISHABLE_KEY.split('_')[2]).slice(0, -1);
  try {
    await Promise.all([
      loadExternalScript({ src: `https://${clerkDomain}/npm/@clerk/ui@1/dist/ui.browser.js` }),
      loadExternalScript({ src: `https://${clerkDomain}/npm/@clerk/clerk-js@6/dist/clerk.browser.js`, 'data-clerk-publishable-key': CLERK_PUBLISHABLE_KEY }),
      loadExternalScript({ src: '/clerk-fr-fr.js' })
    ]);
    await window.Clerk.load({ ui: { ClerkUI: window.__internal_ClerkUICtor }, localization: window.CLERK_LOCALIZATION_FR });
  } catch (err) {
    $('boot').innerHTML = '⚠ Impossible de charger Clerk (' + esc(err.message) + '). Vérifiez votre connexion et réessayez.';
    return;
  }
  clerkInstance = window.Clerk;
  clerkInstance.addListener(({ user }) => {
    if (user) {
      $('boot').classList.add('hidden'); $('auth-gate').classList.add('hidden'); $('app').classList.remove('hidden');
      const btnEl = $('clerk-user-button');
      if (btnEl && !btnEl.dataset.mounted) { clerkInstance.mountUserButton(btnEl, { appearance: { elements: { userButtonAvatarBox: { width: '26px', height: '26px' } } } }); btnEl.dataset.mounted = '1'; }
      $('clerk-user-name').textContent = user.fullName || user.firstName || (user.primaryEmailAddress && user.primaryEmailAddress.emailAddress) || '';
      if (!appStarted) { appStarted = true; start(); }
    } else {
      appStarted = false; $('boot').classList.add('hidden'); $('app').classList.add('hidden'); $('auth-gate').classList.remove('hidden');
      const el = $('clerk-sign-in');
      if (el && !el.dataset.mounted) { clerkInstance.mountSignIn(el, { appearance: { elements: { rootBox: { width: '100%' }, card: { width: '100%' } } } }); el.dataset.mounted = '1'; }
    }
  });
}
async function getClerkToken() {
  for (let i = 0; i < 5; i++) {
    if (clerkInstance && clerkInstance.session) return await clerkInstance.session.getToken();
    await new Promise(r => setTimeout(r, 200));
  }
  return null;
}
async function api(action, params) {
  let res;
  try {
    const token = await getClerkToken();
    res = await fetch('/api/finance', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (token || '') }, body: JSON.stringify(Object.assign({ action }, params || {})) });
  } catch (e) { if (window.__navigating) return new Promise(function () {}); throw new Error('Impossible de joindre le serveur (' + e.message + ')'); }
  let json = {};
  try { json = await res.json(); } catch (e) { throw new Error('Réponse invalide du serveur (HTTP ' + res.status + ')'); }
  if (!res.ok) throw new Error(json.error || ('Erreur serveur (HTTP ' + res.status + ')'));
  return json;
}

const SORT = { key: '', dir: 1 };
function sortRows(rows, G) {
  if (!SORT.key || !G[SORT.key]) return rows;
  const g = G[SORT.key];
  return rows.slice().sort((a, b) => { const x = g(a), y = g(b); const c = (typeof x === 'number' && typeof y === 'number') ? x - y : String(x == null ? '' : x).localeCompare(String(y == null ? '' : y), 'fr', { numeric: true, sensitivity: 'base' }); return c * SORT.dir; });
}
function bindSort(root, rerender) {

    if (SORT.key === th.dataset.sort) th.insertAdjacentHTML('beforeend', ' <span class="sarr">' + (SORT.dir > 0 ? '▲' : '▼') + '</span>');
    th.addEventListener('click', () => { if (SORT.key === th.dataset.sort) SORT.dir = -SORT.dir; else { SORT.key = th.dataset.sort; SORT.dir = 1; } rerender(); });
  });
}

function applyGrp(root, infoOf) {
  const tb = root.querySelector('tbody'); if (!tb) return;
  const ncols = root.querySelectorAll('thead th').length || 8;
  const m = new Map();
  Array.from(tb.children).forEach(tr => { const i = infoOf(tr) || { key: '', label: '' }; if (!m.has(i.key)) m.set(i.key, { label: i.label, rows: [] }); m.get(i.key).rows.push(tr); });
  const keys = Array.from(m.keys()).sort((a, b) => a.localeCompare(b, 'fr', { numeric: true }));
  tb.innerHTML = '';
  window.__pgOpen = window.__pgOpen || new Set();
  keys.forEach(k => { const g = m.get(k); const h = document.createElement('tr'); h.className = 'pgrp'; const op = window.__pgOpen.has(k); const rowsOf = g.rows; if (!op) h.classList.add('pg-c'); h.innerHTML = '<td colspan="' + ncols + '">' + esc(g.label || '— Sans projet —') + '<small>' + g.rows.length + ' ligne' + (g.rows.length > 1 ? 's' : '') + '</small></td>'; tb.appendChild(h); g.rows.forEach(r => { if (!op) r.classList.add('pg-hid'); tb.appendChild(r); });
    h.addEventListener('click', () => { const nowC = !h.classList.contains('pg-c'); h.classList.toggle('pg-c', nowC); rowsOf.forEach(r => r.classList.toggle('pg-hid', nowC)); if (nowC) window.__pgOpen.delete(k); else window.__pgOpen.add(k); }); });
}

function openModal(html, cls) {
  if (window.__ld) { if (window.__ld.parentNode) window.__ld.remove(); window.__ld = null; }
  const root = $('modal-root');
  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.innerHTML = '<div class="modal ' + (cls || '') + '">' + html + '</div>';
  wrap.addEventListener('mousedown', ev => { if (ev.target === wrap && !wrap.dataset.sticky) { /* clic extérieur : ignoré pour ne pas perdre la saisie */ } });
  root.appendChild(wrap);
  wrap.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => closeModal(wrap)));
  return wrap;
}

/* ---------- Suggestions (projet / fournisseur) ---------- */
function attachSuggest(input, getItems, onPick) {
  let box = null, items = [], idx = -1;
  const close = () => { if (box) { box.remove(); box = null; } };
  const render = () => {
    close(); items = getItems(input.value.trim());
    box = document.createElement('div'); box.className = 'suggest';
    box.innerHTML = items.length ? items.map((it, i) => '<div data-i="' + i + '">' + esc(it.label) + (it.sub ? '<small>' + esc(it.sub) + '</small>' : '') + '</div>').join('') : '<div class="none">Aucun résultat</div>';
    input.parentNode.appendChild(box); idx = -1;
    box.querySelectorAll('[data-i]').forEach(d => d.addEventListener('mousedown', ev => { ev.preventDefault(); pick(+d.dataset.i); }));
  };
  const pick = i => { const it = items[i]; if (!it) return; close(); onPick(it); };
  input.addEventListener('input', render);
  input.addEventListener('focus', render);
  input.addEventListener('blur', () => setTimeout(close, 120));
  input.addEventListener('keydown', ev => {
    if (!box) return;
    const els = box.querySelectorAll('[data-i]');
    if (ev.key === 'ArrowDown') { idx = Math.min(idx + 1, els.length - 1); ev.preventDefault(); }
    else if (ev.key === 'ArrowUp') { idx = Math.max(idx - 1, 0); ev.preventDefault(); }
    else if (ev.key === 'Enter' && idx >= 0) { ev.preventDefault(); pick(idx); return; }
    else if (ev.key === 'Escape') { close(); return; }
    els.forEach((e, i) => e.classList.toggle('sel', i === idx));
    if (els[idx]) els[idx].scrollIntoView({ block: 'nearest' });
  });
}

function recalc(root) {
  let sub = 0;
  root.querySelectorAll('#f-lines tr').forEach(tr => {
    const p = parseFloat(tr.querySelector('.l-price').value) || 0, q = parseFloat(tr.querySelector('.l-qty').value) || 0;
    const s = round2(p * q); sub += s; tr.querySelector('.l-sub').textContent = money(s);
  });
  sub = round2(sub);
  const tps = round2(sub * (S.me ? S.me.tps : 0.05)), tvq = round2(sub * (S.me ? S.me.tvq : 0.09975));
  root.querySelector('#t-sub').textContent = money(sub); root.querySelector('#t-tps').textContent = money(tps);
  root.querySelector('#t-tvq').textContent = money(tvq); root.querySelector('#t-tot').textContent = money(round2(sub + tps + tvq));
}

function wireForm(root, st, readonly) {
  root._budget = st && st.budget_item_id ? { id: st.budget_item_id } : null;
  if (readonly) { recalc(root); return; }
  const bi = root.querySelector('#f-budget');
  if (bi) {
    (S.budP || (S.budP = loadBudget(false))).then(() => {});
    attachSuggest(bi, term => {
      const t = term.toLowerCase();
      return (S.budget || []).filter(x => !t || (x.name + ' ' + x.gl + ' ' + x.glLabel).toLowerCase().includes(t)).slice(0, 60)
        .map(x => ({ label: x.name, sub: x.gl ? 'G/L ' + x.gl + ' — ' + x.glLabel.replace(/^\s*\d+\s*-\s*/, '') : 'AUCUN compte G/L dans Monday', value: x }));
    }, it => {
      if (!it.value.gl) { toast("Ce poste n'a pas de compte G/L dans Monday : choisissez-en un autre.", true); return; }
      bi.value = it.label; root._budget = { id: it.value.id };
      root.querySelector('#h-budget').innerHTML = 'Compte G/L : <b>' + esc(it.value.gl) + '</b> — ' + esc(it.value.glLabel);
    });
    bi.addEventListener('input', () => { if (!bi.value.trim()) { root._budget = null; root.querySelector('#h-budget').textContent = ''; } });
  }
  const body = root.querySelector('#f-lines');
  const bind = () => {
    body.querySelectorAll('input').forEach(i => { i.oninput = () => recalc(root); });
    body.querySelectorAll('.l-del').forEach(b => { b.onclick = () => { if (body.querySelectorAll('tr').length > 1) { b.closest('tr').remove(); recalc(root); } }; });
    body.querySelectorAll('textarea').forEach(t => { t.oninput = () => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }; t.oninput(); });
  };
  root.querySelector('#f-addline').onclick = () => { body.insertAdjacentHTML('beforeend', lineRow(null, body.children.length)); bind(); recalc(root); };
  bind(); recalc(root);
}

function collectForm(root) {
  const g = id => { const e = root.querySelector('#' + id); return e ? e.value : ''; };
  const lines = [...root.querySelectorAll('#f-lines tr')].map(tr => ({ name: tr.querySelector('.l-name').value, price: parseFloat(tr.querySelector('.l-price').value) || 0, qty: parseFloat(tr.querySelector('.l-qty').value) || 0 }))
    .filter(l => l.name.trim() || l.price);
  const contacts = [...root.querySelectorAll('.c-row')].map(r => ({ role: r.querySelector('.c-role').value, name: r.querySelector('.c-name').value, phone: r.querySelector('.c-phone').value, email: r.querySelector('.c-email').value }));
  return {
    supplierEmail: g('f-semail'), supplierPhone: g('f-sphone'), contactName: g('f-cname'), saveContact: root.querySelector('#f-savecontact') ? root.querySelector('#f-savecontact').checked : undefined, poDate: g('f-date'), soumissionNumber: g('f-soum'),
    retentionPct: parseFloat(g('f-ret')), projectLink: g('f-link'), contacts, lines,
    owner: { name: g('o-name'), address: g('o-addr'), cadastre: g('o-cad'), email: g('o-email') },
    infoAdditional: g('f-info'), termsText: g('f-terms'),
    budgetItemId: root._budget ? root._budget.id : undefined
  };
}

/* ---------- Contacts du fournisseur (liste mémorisée) ---------- */
function renderSupContacts(root, supplier, list) {
  const box = root.querySelector('#f-contacts'), save = root.querySelector('#f-savebox');
  save.classList.remove('hidden');
  if (!list.length) { box.className = 'hidden'; return; }
  const cur = (root.querySelector('#f-semail').value || '').trim().toLowerCase();
  box.className = '';
  box.innerHTML = '<div class="muted" style="font-size:12.5px;margin-bottom:5px">Contacts connus de ce fournisseur — cliquez sur « Utiliser », retirez ceux qui ne travaillent plus là, ou saisissez un nouveau contact dans les champs ci-dessus :</div>' +
    list.map((c, i) => '<div data-i="' + i + '" style="display:flex;gap:10px;align-items:center;padding:6px 10px;border:1px solid ' + (c.email && c.email.toLowerCase() === cur ? 'var(--accent)' : 'var(--border)') + ';border-radius:8px;margin-bottom:5px;background:#fff">' +
      '<button type="button" class="btn small sc-use">Utiliser</button>' +
      '<div style="flex:1;font-size:13.5px"><b>' + esc(c.name || (c.email ? c.email.split('@')[0] : 'Contact')) + '</b> <span class="muted">' + esc([c.email, c.phone].filter(Boolean).join(' · ')) + '</span>' +
      (c.source === 'avantage' ? ' <span class="muted" style="font-size:11.5px">(fiche Avantage)</span>' : '') + '</div>' +
      (c.source === 'saved' ? '<button type="button" class="x sc-del" title="Retirer ce contact de la liste">×</button>' : '') + '</div>').join('');
  box.querySelectorAll('[data-i]').forEach(row => {
    const c = list[Number(row.dataset.i)];
    row.querySelector('.sc-use').onclick = () => {
      root.querySelector('#f-semail').value = c.email || ''; root.querySelector('#f-sphone').value = c.phone || ''; root.querySelector('#f-cname').value = c.name || '';
      renderSupContacts(root, supplier, list);
    };
    const del = row.querySelector('.sc-del');
    if (del) del.onclick = async () => {
      if (!confirm('Retirer « ' + (c.name || c.email || c.phone) + ' » de la liste de ce fournisseur ?\n(à utiliser quand la personne ne travaille plus chez lui)')) return;
      try { await api('supplierContactDelete', { supplierItemId: supplier.id, contactId: c.id }); const r = await api('supplierContacts', { supplierItemId: supplier.id }); renderSupContacts(root, supplier, r.contacts); toast('Contact retiré.'); }
      catch (e) { toast(e.message, true); }
    };
  });
}

/* ---------- Nouveau bon de commande ---------- */
async function ensureTerms() {
  if (S.terms == null) { try { S.terms = (await api('termsGet')).terms; } catch (e) { toast(e.message, true); S.terms = ''; } }
  return S.terms;
}

async function openNew() {
  // Le formulaire s'ouvre tout de suite ; projets, fournisseurs et conditions se chargent en arrière-plan.
  const m = openModal('<div class="modal-head"><h2>Nouveau bon de commande <span id="n-number" class="muted" style="font-size:14px"></span></h2><button class="x" data-close>×</button></div>' +
    '<div class="modal-body" id="n-body"><div id="n-load" class="note" style="margin-bottom:12px"><span class="spin"></span> Chargement des projets et des fournisseurs depuis Monday…</div>' +
    formHtml({ terms_text: S.terms || '', contacts: null, __quoteInput: true }, false, false) + '<div id="n-err" class="err hidden" style="margin-top:12px"></div></div>' +
    '<div class="modal-foot"><button class="btn" data-close>Fermer</button><button class="btn primary" id="n-create">Créer le brouillon</button></div>');
  const root = m.querySelector('#n-body');
  wireForm(root, null, false);
  let project = null, supplier = null;

  (async () => {
    const note = m.querySelector('#n-load');
    try {
      await Promise.all([S.projP || loadProjects(false), S.supP || loadSuppliers(false), ensureTerms()]);
      if (!S.projects.length) { await loadProjects(true); }
    } catch (e) { /* les erreurs sont déjà affichées par loadProjects/loadSuppliers */ }
    if (!root.isConnected) return;
    const ta = root.querySelector('#f-terms'); if (ta && !ta.value.trim() && S.terms) ta.value = S.terms;
    if (!S.projects.length) { note.className = 'err'; note.textContent = "Aucun projet disponible : vous devez être « Chargé de projet » d'un projet dans Monday (ou administrateur)."; }
    else note.remove();
  })();

  attachSuggest(root.querySelector('#f-project'), term => {
    const t = term.toLowerCase();
    return S.projects.filter(p => !t || (p.number + ' ' + p.name).toLowerCase().includes(t)).slice(0, 40).map(p => ({ label: p.number + ' — ' + p.name, sub: p.status, value: p }));
  }, async it => {
    root.querySelector('#f-project').value = it.label; project = it.value;
    try {
      const r = await api('projectGet', { itemId: it.value.id });
      m.querySelector('#n-number').textContent = '→ ' + r.defaults.nextNumber;
      const d = r.defaults;
      d.contacts.forEach((c, i) => { const row = root.querySelectorAll('.c-row')[i]; if (!row) return; row.querySelector('.c-role').value = c.role; row.querySelector('.c-name').value = c.name; row.querySelector('.c-phone').value = c.phone; row.querySelector('.c-email').value = c.email; });
      root.querySelector('#o-name').value = d.owner.name; root.querySelector('#o-addr').value = d.owner.address; root.querySelector('#o-cad').value = d.owner.cadastre; root.querySelector('#o-email').value = d.owner.email;
      root.querySelector('#f-link').value = d.link || '';
      project.defaults = d;
    } catch (e) { toast(e.message, true); }
  });

  attachSuggest(root.querySelector('#f-supplier'), term => {
    const t = term.toLowerCase();
    return S.suppliers.filter(s => !t || s.name.toLowerCase().includes(t)).slice(0, 40).map(s => ({ label: s.name, sub: [s.type, s.active === false ? 'INACTIF — non commandable' : '', s.blacklisted ? 'LISTE NOIRE' : ''].filter(Boolean).join(' · '), value: s }));
  }, it => {
    if (it.value.blacklisted || it.value.active === false) {
      supplier = null; root.querySelector('#f-supplier').value = '';
      const w0 = root.querySelector('#f-supwarn'); w0.className = 'err';
      w0.textContent = it.value.blacklisted ? 'Ce fournisseur est sur la liste noire : impossible d\u2019émettre un bon de commande.' : 'Ce fournisseur est « Inactif » (Avantage) : impossible d\u2019émettre un bon de commande. Demandez à la comptabilité de le réactiver.';
      return;
    }
    supplier = it.value; root.querySelector('#f-supplier').value = it.value.name;
    root.querySelector('#f-semail').value = (it.value.emails && it.value.emails[0]) || ''; root.querySelector('#f-sphone').value = it.value.phone || '';
    const w = root.querySelector('#f-supwarn');
    if (it.value.blacklisted) { w.className = 'err'; w.textContent = 'Ce fournisseur est sur la liste noire dans Monday : le bon de commande sera refusé.'; }
    else if (!it.value.active) { w.className = 'warn'; w.textContent = 'Ce fournisseur est marqué « Inactif » dans Monday.'; }
    else if (!(it.value.emails || []).length) { w.className = 'warn'; w.textContent = "Aucun courriel dans Monday pour ce fournisseur : saisissez-le ci-dessus."; }
    else w.className = 'hidden';
    api('supplierContacts', { supplierItemId: it.value.id }).then(r => {
      if (supplier !== it.value) return;   // un autre fournisseur a été choisi entre-temps
      const first = (r.contacts || []).find(c => c.source === 'saved');
      if (first) { root.querySelector('#f-semail').value = first.email || ''; root.querySelector('#f-sphone').value = first.phone || ''; root.querySelector('#f-cname').value = first.name || ''; }
      renderSupContacts(root, it.value, r.contacts || []);
    }).catch(() => { /* la liste de contacts est facultative */ });
  });

  m.querySelector('#n-create').addEventListener('click', async ev => {
    const btn = ev.target, errBox = m.querySelector('#n-err'); errBox.classList.add('hidden');
    if (!project) { errBox.textContent = 'Choisissez un projet dans la liste.'; errBox.classList.remove('hidden'); return; }
    if (!supplier) { errBox.textContent = 'Choisissez un fournisseur dans la liste.'; errBox.classList.remove('hidden'); return; }
    if (!root._budget) { errBox.textContent = 'Choisissez le poste budgétaire dans la liste (obligatoire : il détermine le compte G/L).'; errBox.classList.remove('hidden'); return; }
    const qf = root.querySelector('#n-qfile') && root.querySelector('#n-qfile').files[0];
    if (qf && qf.size > 3.2 * 1024 * 1024) { errBox.textContent = 'La soumission dépasse 3,2 Mo. Compressez le PDF avant de le joindre.'; errBox.classList.remove('hidden'); return; }
    btn.disabled = true; btn.textContent = 'Création…';
    try {
      const f = collectForm(root);
      const r = await api('poCreate', Object.assign({ projectItemId: project.id, supplierItemId: supplier.id }, f));
      let quoteErr = '';
      if (qf) {
        try {
          btn.textContent = 'Téléversement de la soumission…';
          const b64 = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = () => rej(new Error('Lecture du fichier impossible.')); fr.readAsDataURL(qf); });
          await api('poUploadQuote', { id: r.id, filename: qf.name, dataBase64: b64 });
        } catch (e) { quoteErr = e.message; }
      }
      closeModal(m); toast(quoteErr ? ('Brouillon ' + r.po_number + ' créé, mais la soumission n\'a pas été jointe : ' + quoteErr) : ('Bon de commande ' + r.po_number + ' créé (brouillon).'), !!quoteErr);
      await reloadList(); openDetail(r.id);
    } catch (e) { errBox.textContent = e.message; errBox.classList.remove('hidden'); btn.disabled = false; btn.textContent = 'Créer le brouillon'; }
  });
}

    if (f.size > 3.2 * 1024 * 1024) { err('La soumission dépasse 3,2 Mo. Compressez le PDF avant de le joindre.'); ev.target.value = ''; return; }
    try {
      const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = () => rej(new Error('Lecture du fichier impossible.')); r.readAsDataURL(f); });
      toast('Téléversement…');
      await api('poUpdate', Object.assign({ id }, collectForm(root))); // conserve les modifications en cours
      await api('poUploadQuote', { id, filename: f.name, dataBase64: b64 }); toast('Soumission jointe.'); refresh();
    } catch (e) { err(e.message); ev.target.value = ''; }
  };
  if ($$('#d-save')) $$('#d-save').onclick = ev => busy(ev.target, async () => { await api('poUpdate', Object.assign({ id }, collectForm(root))); toast('Enregistré.'); refresh(); });
  if ($$('#d-send')) $$('#d-send').onclick = ev => busy(ev.target, async () => {
    if (editable) await api('poUpdate', Object.assign({ id }, collectForm(root))); // enregistre d'abord les modifications
    await openSend(po, m);
  });
}

async function openSend(po, parentModal) {
  let d;
  try { d = await api('poEmailDraft', { id: po.id }); } catch (e) { toast(e.message, true); return; }
  const m = openModal('<div class="modal-head"><h2>Envoyer le bon de commande ' + esc(po.po_number) + '</h2><button class="x" data-close>×</button></div><div class="modal-body">' +
    (po.quote ? '' : '<div class="warn" style="margin-bottom:12px">Aucune soumission du sous-traitant n\'est jointe à ce bon de commande.</div>') +
    '<div class="grid"><label class="f">À (séparer par des virgules)<input id="s-to" value="' + esc(d.to) + '"></label>' +
    '<label class="f">Cc (en plus de vous)<input id="s-cc" value="' + esc(d.cc) + '"></label>' +
    '<label class="f">Objet<input id="s-subj" value="' + esc(d.subject) + '"></label>' +
    '<label class="f">Message<textarea id="s-body" rows="16" style="font-size:13.5px">' + esc(d.body) + '</textarea></label></div>' +
    '<p class="muted" style="font-size:13px;margin:8px 0">Le texte ci-dessus est modifiable. <code>{{LIEN}}</code> est remplacé par le lien de signature (affiché « Utilisez ce lien pour l\'accepter. »). Mise en forme : <code>* </code> en début de ligne = puce, <code>**texte**</code> = gras. Le PDF est joint au courriel. Les réponses du fournisseur sont dirigées vers <b>' + esc(d.replyTo) + '</b>.</p>' +
    '<p class="muted" style="font-size:13px;margin:0 0 8px">Après l\'envoi, le bon de commande n\'est plus modifiable.</p>' +
    '<div id="s-err" class="err hidden"></div></div><div class="modal-foot"><button class="btn" data-close>Annuler</button><button class="btn primary" id="s-go">Envoyer</button></div>', 'narrow');
  m.querySelector('.modal').style.maxWidth = '720px';
  m.querySelector('#s-go').onclick = async ev => {
    const btn = ev.target; btn.disabled = true; btn.textContent = 'Envoi…'; m.querySelector('#s-err').classList.add('hidden');
    try {
      await api('poSend', { id: po.id, to: m.querySelector('#s-to').value, cc: m.querySelector('#s-cc').value, subject: m.querySelector('#s-subj').value, body: m.querySelector('#s-body').value });
      closeModal(m); closeModal(parentModal); toast('Bon de commande envoyé.'); await reloadList(); openDetail(po.id);
    } catch (e) { const bx = m.querySelector('#s-err'); bx.textContent = e.message; bx.classList.remove('hidden'); btn.disabled = false; btn.textContent = 'Envoyer'; }
  };
}

function b64ToBlobUrl(b64) { const bin = atob(b64); const arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); return URL.createObjectURL(new Blob([arr], { type: 'application/pdf' })); }
function showPdf(r) {
  const url = b64ToBlobUrl(r.dataBase64);
  const m = openModal('<div class="modal-head"><h2>' + esc(r.filename) + '</h2><a class="btn small" style="text-decoration:none;display:inline-flex;align-items:center" href="' + url + '" download="' + esc(r.filename) + '">Télécharger</a><button class="x" data-close>×</button></div><iframe class="preview" src="' + url + '"></iframe>', 'wide');
  m.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => URL.revokeObjectURL(url)));
}
function downloadB64(r) { const a = document.createElement('a'); a.href = b64ToBlobUrl(r.dataBase64); a.download = r.filename; document.body.appendChild(a); a.click(); a.remove(); }

<script>
/* ===== Mobile : étiquettes de cartes + pages réservées au poste de travail ===== */
(function () {
  var mq = window.matchMedia ? window.matchMedia('(max-width:760px)') : null;
  var isMob = function () { return mq && mq.matches; };
  if (isMob() && /^\/(dashboard|fournisseurs|configuration)\/?$/.test(location.pathname)) { location.replace('/'); return; }
  function label() {
    if (!isMob()) return;
    document.querySelectorAll('table.list').forEach(function (t) {
      var ths = t.querySelectorAll('thead th'); if (!ths.length) return;
      t.querySelectorAll('tbody tr').forEach(function (tr) {
        if (tr.getAttribute('data-lb') === '1' || tr.classList.contains('pgrp')) return;
        var tds = tr.children; if (tds.length < 2) return;
        for (var i = 0; i < tds.length && i < ths.length; i++) { var l = (ths[i].textContent || '').trim(); if (l && !tds[i].hasAttribute('data-l')) tds[i].setAttribute('data-l', l); }
        tr.setAttribute('data-lb', '1');
      });
    });
  }
  var pend = false;
  new MutationObserver(function () { if (pend) return; pend = true; setTimeout(function () { pend = false; label(); }, 60); }).observe(document.documentElement, { childList: true, subtree: true });
  label();
})();
</script>
<script>
(function () {
  function zone(t) { return t && t.closest ? t.closest('.dz') : null; }
  ['dragenter', 'dragover'].forEach(function (ev) { document.addEventListener(ev, function (e) { var z = zone(e.target); if (!z) return; e.preventDefault(); z.classList.add('over'); }); });
  document.addEventListener('dragleave', function (e) { var z = zone(e.target); if (z && !z.contains(e.relatedTarget)) z.classList.remove('over'); });
  document.addEventListener('drop', function (e) {
    var z = zone(e.target); if (!z) return; e.preventDefault(); z.classList.remove('over');
    var inp = z.querySelector('input[type=file]'), f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (!inp || !f) return;
    if (!/\.pdf$/i.test(f.name) && f.type !== 'application/pdf') { if (window.toast) toast('Seuls les fichiers PDF sont acceptés.', true); return; }
    var dt = new DataTransfer(); dt.items.add(f); inp.files = dt.files; inp.dispatchEvent(new Event('change', { bubbles: true }));
  });
  // Un fichier lâché à côté d'une zone ne doit pas ouvrir le PDF dans l'onglet
  window.addEventListener('dragover', function (e) { if (e.dataTransfer && [].indexOf.call(e.dataTransfer.types || [], 'Files') >= 0) e.preventDefault(); });
  window.addEventListener('drop', function (e) { if (!zone(e.target)) e.preventDefault(); });
})();
</script>
