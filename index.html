<style>
  :root {
    --bg:#f4f6fb; --panel:#ffffff; --panel-alt:#eef2fa; --border:#dde4f0;
    --text:#0b1e3d; --text-secondary:#5b6b85;
    --accent:#3b63ff; --accent-dark:#2547cc;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; height:100%; overflow-x:hidden; }
  body {
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px 16px;
  }
  .logo { height:110px; width:auto; margin-bottom:8px; }
  h1 { font-size:15px; font-weight:600; color:var(--text-secondary); margin:0 0 40px; text-align:center; letter-spacing:.02em; }
  .cards { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; max-width:900px; width:100%; }
  .card {
    background:var(--panel); border:1px solid var(--border); border-radius:16px;
    padding:32px 26px; width:230px; text-align:center; text-decoration:none; color:var(--text);
    display:flex; flex-direction:column; align-items:center; gap:12px;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .card:hover { transform:translateY(-4px); border-color:var(--accent); background:var(--panel-alt); }
  .card .icon { width:42px; height:42px; object-fit:contain; }
  .card .label { font-size:16px; font-weight:700; }
  .card .sub { font-size:12px; color:var(--text-secondary); }
  .card .login-hint { font-size:10.5px; color:var(--accent-dark); font-weight:700; margin-top:2px; }
  .mobile-only { display:none; }
  @media (max-width:768px) {
    .desktop-only { display:none; }
    .mobile-only { display:flex; }
    .logo { height:auto; width:65vw; max-width:220px; }
  }
  footer { margin-top:48px; font-size:11px; color:var(--text-secondary); text-align:center; }
</style>
</head>
